<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9C7FD0">
<title></title>
<script>
// base דינמי לפני כל תג עם כתובת יחסית — כשה-service worker מגיש את הקליפה בנתיב עמוק, כתובת יחסית נפתרת רמה אחת עמוק מדי.
// אחרת המניפסט, העובד והאייקונים מחזירים 404, והעובד נרשם בהיקף שגוי.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/ha-kupa\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.ba19ef31.png">
<link rel="icon" href="icons/favicon-32.660c86d2.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.ce583c8e.png" sizes="16x16">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="core/chart.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- הקליפה מתחילה חשופה — המסגרת נחשפת עם הרינדור הראשון. -->
<div id="shell" class="is-bare">
<!-- הסרגל מחוץ למיכל התוכן — סרגל שנבנה בתוך המסך נמחק איתו בכל רינדור. -->
<nav id="tabbar" class="tabbar" aria-label="ניווט"></nav>

<!-- הלוגו מוצג בשלוש הלשוניות בלבד — מסכי המשנה הם זרימה, והכותרת אינה חלק מהם. -->
<header id="masthead" class="brand hidden"></header>

<main id="view"><div class="view-loading" role="status" aria-label="טוען"><span class="view-spin"></span></div></main>

<!-- הפלוס הוא ציור ולא תו — תו נשען על קו הבסיס של הגופן, ומרכזו האופטי זז בין מנוע למנוע. -->
<div class="fabrail"><div class="in"><button id="fab" class="fab" data-act="add-open" aria-label="רישום חדש"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button></div></div>
</div>

<!-- מיכל המודאל ילד ישיר של body — מיכל בתוך מסך נמחק איתו במעבר, והדיאלוג מפסיק להיפתח בשקט. -->
<div id="modal" class="veil">
  <div class="sheet ksave" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>

<div id="ask" class="veil">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>

<script type="module" src="app/main.js"></script>

</body>
</html>

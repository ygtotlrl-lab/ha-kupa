/*  ⛔ הוראה חלה על חודש רק בתוך תוקפה — ⚠️ גרסה שנפתחה בעריכת מופע
 *  מקבלת «תוקף עד» החודש הקודם, ⭐ והחדשה מתחילה מהחודש הנוכחי:
 *  ⛔ מופעים קודמים אינם משתנים. */
function orderAppliesTo(o, m) {
  var key = m.hebrew_year + '-' + String(m.ordinal);
  if (o.valid_from_month && key < o.valid_from_month) return false;
  if (o.valid_to_month && key > o.valid_to_month) return false;
  return true;
}
function soDate(monthKey, o) {
  var m = monthByKey(monthKey);
  if (!m || !m.start_date || !o) return m && m.start_date ? m.start_date : '';
  var d = new Date(m.start_date + 'T12:00:00');
  d.setDate(d.getDate() + (Math.max(1, +o.day_of_month || 1) - 1));
  return d.toISOString().slice(0, 10);
}

/*  ⛔ המופעים נוצרים בתחילת כל חודש עברי — ⚠️ פעם אחת לכל צמד
 *  הוראה+חודש: ⭐ והקריאה אידמפוטנטית, ⛔ וריצה שנייה אינה משנה דבר. */
function soEnsureInstances(monthKey) {
  var m = monthByKey(monthKey);
  if (!m) return [];
  var made = [], os = ordersLive(), i, o, has;
  for (i = 0; i < os.length; i++) {
    o = os[i];
    if (!orderAppliesTo(o, m)) continue;
    has = instancesOfMonth(monthKey).some(function (x) {
      return idEq(x.standing_order_client_id, o.client_id);
    });
    if (has) continue;
    made.push({ client_id: newClientId(), standing_order_client_id: o.client_id,
                month_client_id: monthKey, amount: +o.amount || 0,
                status: 'pending', updated_at: Date.now(), deleted: false });
  }
  return made;
}

/* ══════════════════════════════════════════════════════════════════════════
   הרינדור
   ══════════════════════════════════════════════════════════════════════════ */
function openerHTML() { return '<div class="opener">' + esc(MSG_OPENER) + '</div>'; }
function closerHTML() { return '<div class="closer">' + esc(MSG_CLOSER) + '</div>'; }

function iconFor(kind) {
  /*  ⛔ סט קווי-מעוגל אחד, עובי 1.75 — ⚠️ ואייקון קבוע לכל מקור:
   *  ⭐ צבע נגזר מהתפקיד ⛔ ולא מהמקור. */
  var p = {
    cash:     'M3 7h18v10H3z M7 12h.01 M17 12h.01',
    bit:      'M12 3v18 M7 8h7a3 3 0 010 6H7',
    card:     'M3 7h18v10H3z M3 11h18',
    transfer: 'M4 12h16 M14 6l6 6-6 6',
    other:    'M12 4v16 M4 12h16',
    income:   'M12 20V4 M6 10l6-6 6 6',
    standing: 'M12 7v5l3 2 M21 12a9 9 0 11-18 0 9 9 0 0118 0z'
  }[kind] || 'M12 4v16 M4 12h16';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +
         p.split(' M').map(function (s, i) { return '<path d="' + (i ? 'M' + s : s) + '"/>'; }).join('') +
         '</svg>';
}

function detailRowHTML(r) {
  var isInc = r.type === 'income';
  var tag = r.source === 'standing' ? 'הו״ק' : (isInc ? 'הכנסה' : (r.verified ? 'אומת' : ''));
  var kind = isInc ? 'income' : (r.source === 'standing' ? 'standing' : (r.method || 'other'));
  return '<li data-act="entry-menu" data-id="' + esc(r.client_id) + '"' +
         (r.pending ? ' class="pend"' : '') + '>' +
         '<span class="ico' + (isInc ? ' peach' : '') + '">' + iconFor(kind) + '</span>' +
         '<span class="nm">' + esc(r.description || '') + '</span>' +
         '<span class="tag">' + esc(tag) + '</span>' +
         '<span class="amt">' + plain(r.amount) + '</span></li>';
}

function monthScreenHTML() {
  var m = monthByKey(view.monthKey);
  if (!m) return openerHTML() + '<div class="card"><div class="empty">' +
             '<div class="skel"></div><div class="skel"></div></div></div>' + closerHTML();
  var c = chainOf(view.monthKey) || {};
  var rows = kpSortEntries(monthRows(view.monthKey));
  var prev = prevMonthOf(view.monthKey);
  var pc = prev ? chainOf(prev.client_id) : null;

  var h = openerHTML();

  /* 2 — שם החודש והחצים, ומעליהם פס החוב מהחודש הקודם. */
  h += '<div class="mrow">' +
       '<button class="mnav" data-act="month-prev" aria-label="חודש קודם">›</button>' +
       '<span class="mname">' + esc(m.name) + '</span>' +
       '<button class="mnav" data-act="month-next" aria-label="חודש הבא">‹</button>' +
       '</div>';
  if (pc && pc.short > EPS)
    h += '<button class="carry" data-act="month-goto" data-id="' + esc(prev.client_id) + '">' +
         esc(MSG_CARRY_PRE + prev.name + MSG_CARRY_MID + plain(pc.short)) +
         '<span class="arw">‹</span></button>';

  /* 3 — הכנסות החודש. */
  h += '<div class="inc">' + esc('הכנסות החודש · ') +
       (c.income > EPS ? money(c.income) : esc(MSG_NO_INCOME)) + '</div>';

  /* 4 — כרטיס החומש. */
  var fill = Math.max(0, c.tzedakah + Math.max(0, c.prevBalance));
  var goal = c.chumash;
  var noGoal = goal <= EPS;
  var pct = noGoal ? 100 : Math.min(100, fill / goal * 100);
  h += '<div class="card"><h2>חומש' +
       '<span class="st ' + (fill + EPS >= goal ? 'ok' : 'left') + '">' +
       (noGoal ? '' : (fill + EPS >= goal ? 'עקפנו ב־' + plain(fill - goal) + ' ✓'
                                          : 'עוד ' + plain(goal - fill) + ' ליעד')) +
       '</span></h2>' +
       '<div class="big">' + money(fill) + '</div>' +
       '<div class="sml">' + (noGoal ? esc(MSG_GOAL_FROM_INCOME) : 'יעד ' + plain(goal)) + '</div>' +
       '<div class="u-mt-5">' + bar(pct.toFixed(1)) + '</div></div>';

  /* 5 — כרטיס הפלעזדש. */
  var pp = c.pleziash > EPS ? Math.min(100, c.fill / c.pleziash * 100) : 0;
  h += '<div class="card"><h2>פלעזדש' +
       '<span class="st ' + (c.done ? 'ok' : 'peach') + '">' +
       (c.done ? 'הושלם ✓ · +' + plain(c.carryOut) + ' לחודש הבא'
               : 'נשאר ' + plain(c.short)) + '</span></h2>' +
       '<div class="big">' + plain(c.fill) + ' מתוך ' + plain(c.pleziash) + '</div>' +
       '<div class="sml' + (c.selfPct > 50 ? ' strong' : '') + '">אישי ' +
       Math.round(c.selfPct) + '%</div>' +
       (c.carryIn > EPS ? '<div class="sml">מחודש קודם +' + plain(c.carryIn) + '</div>' : '') +
       '<div class="u-mt-5">' + bar(pp.toFixed(1), 'peach') + '</div></div>';

  /* 6 — הפירוט. */
  if (!rows.length) {
    h += '<div class="card"><div class="empty">' + esc(MSG_EMPTY_PRE + m.name) + '</div></div>';
    h += ordersCardHTML();
  } else {
    h += '<div class="card"><h2>פירוט</h2><ul class="det">' +
         rows.map(detailRowHTML).join('') + '</ul></div>';
  }
  /*  ⛔ הביטול הוא כפתור על המסך ⛔ ולא טקסט בטוסט — ⚠️ טוסט הוא הודעה
   *  ואינו אתר לחיצה: ⭐ «בטל» שאין לו כפתור הוא הבטחה שאין לה מסלול. */
  if (UNDO.row)
    h += '<button class="btn ghost" data-act="entry-undo">' + esc(MSG_UNDO) + '</button>';
  h += '<button class="btn ghost" data-act="settings-open">' + esc(MSG_SETTINGS_TITLE) + '</button>';
  return h + closerHTML();
}

function prevMonthOf(k) {
  var ms = monthsSorted(), i;
  for (i = 0; i < ms.length; i++) if (idEq(ms[i].client_id, k)) return i > 0 ? ms[i - 1] : null;
  return null;
}
function nextMonthOf(k) {
  var ms = monthsSorted(), i;
  for (i = 0; i < ms.length; i++) if (idEq(ms[i].client_id, k)) return i < ms.length - 1 ? ms[i + 1] : null;
  return null;
}

function ordersCardHTML() {
  var os = ordersLive();
  if (!os.length) return '';
  return '<div class="card"><h2>' + esc(MSG_ORDERS_TITLE) + '</h2><ul class="det">' +
    os.map(function (o) {
      return '<li data-act="order-edit" data-id="' + esc(o.client_id) + '">' +
             '<span class="ico">' + iconFor('standing') + '</span>' +
             '<span class="nm">' + esc(o.name) + '</span>' +
             '<span class="tag">' + esc('יום ' + o.day_of_month) + '</span>' +
             '<span class="amt">' + plain(o.amount) + '</span></li>';
    }).join('') + '</ul></div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   שני תהליכי הרישום — מסך אחר מסך, שדה אחד
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ **מה נכנס**: הטיוטה והשלב שבו היא נמצאת; ⛔ **ומה מפיל**: שדה שנקרא
   ישירות מה-DOM אחרי מעבר מסך — ⭐ האלמנט כבר אינו שם.
   ══════════════════════════════════════════════════════════════════════════ */
var FLOW_TZ = ['amount', 'desc', 'source', 'category', 'date'];
var FLOW_INC = ['amount', 'desc', 'method', 'date'];

var SRC_DEFAULT = ['מזומן', 'ביט', 'אשראי מענדי', 'אשראי חני', 'העברה', 'אחר'];
var METHOD_DEFAULT = ['העברה ישירה', 'ביט ופייבוקס', 'מזומן', 'צ׳קים'];
var CAT_LIST = ['לאחרים', KP_CAT_SELF];

function lookupList(kind, dflt) {
  var l = kpLive(DATA.kp_lookups).filter(function (r) { return r.kind === kind; })
    .sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); })
    .map(function (r) { return r.label; });
  return l.length ? l : dflt;
}

/*  ⛔ ההשלמה נגזרת מהפירוטים שכבר נרשמו — ⚠️ distinct לפי תדירות:
 *  ⭐ מה שנרשם הרבה עולה ראשון, ⛔ ואין רשימה שנייה לתחזק. */
function descSuggest(q) {
  var seen = {}, l = kpLive(DATA.kp_entries), i, d;
  for (i = 0; i < l.length; i++) {
    d = (l[i].description || '').trim();
    if (!d) continue;
    seen[d] = (seen[d] || 0) + 1;
  }
  return Object.keys(seen)
    .filter(function (d) { return !q || d.indexOf(q) === 0; })
    .sort(function (a, b) { return seen[b] - seen[a] || a.localeCompare(b); })
    .slice(0, 5);
}

function flowSteps() { return view.flow === 'income' ? FLOW_INC : FLOW_TZ; }

function flowScreenHTML() {
  var steps = flowSteps(), key = steps[view.step], d = view.draft;
  var isInc = view.flow === 'income';
  var h = openerHTML() +
    '<div class="flow ksave"><button class="back" data-act="flow-back" ' +
    'aria-label="חזרה">›</button>';

  if (key === 'amount') {
    h += '<h2>' + (isInc ? 'סכום ההכנסה' : 'סכום הצדקה') + '</h2>' +
      '<div class="fld"><label for="f-amount">סכום</label>' +
      '<input id="f-amount" type="text" inputmode="decimal" autocomplete="off" ' +
      'value="' + esc(d.amount === null ? '' : String(d.amount)) + '"></div>';
  } else if (key === 'desc') {
    h += '<h2>פירוט</h2>' +
      '<div class="fld"><label for="f-desc">פירוט</label>' +
      '<input id="f-desc" type="text" autocomplete="off" value="' + esc(d.description) + '">' +
      '<div class="acbox" id="f-ac">' + descSuggest('').map(function (s) {
        return '<button type="button" data-act="flow-ac" data-v="' + esc(s) + '">' +
               esc(s) + '</button>';
      }).join('') + '</div></div>';
  } else if (key === 'source' || key === 'method') {
    var list = key === 'source' ? lookupList('source', SRC_DEFAULT)
                                : lookupList('method', METHOD_DEFAULT);
    h += '<h2>' + (key === 'source' ? 'מקור' : 'אופן') + '</h2><div class="opts">' +
      list.map(function (s) {
        var on = (key === 'source' ? d.method : d.method) === s;
        return '<button type="button" class="opt' + (on ? ' on' : '') +
               '" data-act="flow-pick" data-k="method" data-v="' + esc(s) + '">' +
               esc(s) + '</button>';
      }).join('') + '</div>';
  } else if (key === 'category') {
    h += '<h2>קטגוריה</h2><div class="opts">' + CAT_LIST.map(function (s) {
      return '<button type="button" class="opt' + (d.category === s ? ' on' : '') +
             '" data-act="flow-pick" data-k="category" data-v="' + esc(s) + '">' +
             esc(s) + '</button>';
    }).join('') + '</div>';
  } else if (key === 'date') {
    h += '<h2>תאריך</h2>' +
      '<div class="fld"><label for="f-date">תאריך</label>' +
      '<input id="f-date" type="date" value="' + esc(d.entry_date) + '">' +
      '<div class="sml" id="f-hdate">' + esc(hebLabel(d.entry_date)) + '</div></div>';
  }

  h += '<button class="btn" data-act="flow-next" data-ksave>' +
       (view.step === steps.length - 1 ? 'אישור' : 'המשך') + '</button>' +
       '<button class="btn ghost u-mt-5" data-act="flow-back" data-kesc>חזרה</button>' +
       '</div>';
  return h + closerHTML();
}

/*  ⛔ הציון העברי נגזר מהמנוע האחד — ⚠️ ואין ספריית לוח חיצונית:
 *  ⭐ `ysHebDate` מעל `Intl`, ובנפילה-חזרה טבלה אריתמטית. */
function hebLabel(iso) {
  if (!iso) return '';
  /*  ⛔ העוגן בצהריים מקומיים — ⚠️ חצות נופל ליום הקודם במעבר לשעון חורף. */
  var h;
  try { h = ysHebDate(new Date(iso + 'T12:00:00')); } catch (e) { return ''; }
  /*  ⛔ המנוע מחזיר מבנה ⛔ ולא מחרוזת — ⚠️ הצבתו כלשונו במסך מדפיסה
   *  «[object Object]»: ⭐ והתצוגה נגזרת מהשדות שהוא מחזיר. */
  if (!h || !h.ok) return '';
  return h.dayLabel + ' ' + h.monthName + ' ' + h.yearLabel;
}
/*  ⛔ החודש נגזר מהתאריך ⛔ ואינו נבחר — ⚠️ שדה שני לאותו מושג הוא
 *  מקור אמת שני, ⭐ ושניהם היו מתפצלים ביום שאחד מהם נערך. */
function monthKeyForDate(iso) {
  var ms = monthsSorted(), i, m;
  for (i = 0; i < ms.length; i++) {
    m = ms[i];
    if (m.start_date && m.end_date && iso >= m.start_date && iso <= m.end_date)
      return m.client_id;
  }
  return view.monthKey;
}

function flowStart(kind) {
  view.flow = kind;
  view.step = 0;
  view.screen = 'flow';
  view.draft = { amount: null, description: '', method: '', category: '',
                 entry_date: new Date().toISOString().slice(0, 10) };
  kpRender();
}

function flowCollect() {
  var steps = flowSteps(), key = steps[view.step], el;
  if (key === 'amount') {
    el = kpQ('#f-amount');
    /*  ⛔ הקריאה עוברת ב-`readNum` — ⚠️ המרה ישירה מחזירה `NaN` על שדה
     *  ריק, ⭐ ו-`NaN` בהשוואה נכשל בשקט. */
    view.draft.amount = el ? readNum(el, null) : null;
  } else if (key === 'desc') {
    el = kpQ('#f-desc'); view.draft.description = el ? el.value.trim() : '';
  } else if (key === 'date') {
    el = kpQ('#f-date'); if (el && el.value) view.draft.entry_date = el.value;
  }
}

function flowValid() {
  var key = flowSteps()[view.step], d = view.draft;
  if (key === 'amount') {
    if (d.amount === null) return MSG_NEED_AMOUNT;
    /*  ⛔ בהכנסה מותר סכום שלילי — ⚠️ הוא קיזוז: ⭐ ובצדקה הוא חייב
     *  להיות גדול מאפס. */
    if (view.flow !== 'income' && d.amount <= EPS) return MSG_NEED_AMOUNT;
    if (view.flow === 'income' && Math.abs(d.amount) <= EPS) return MSG_NEED_AMOUNT;
    return '';
  }
  if (key === 'desc') return d.description ? '' : MSG_NEED_DESC;
  if (key === 'source' || key === 'method') return d.method ? '' : MSG_FILL_ALL;
  if (key === 'category') return d.category ? '' : MSG_FILL_ALL;
  return '';
}

/* ══════════════════════════════════════════════════════════════════════════
   מסך אישור המטבע
   ══════════════════════════════════════════════════════════════════════════
   ⛔ המטבע נגרר חופשי ומשוחרר מעל היעד — ⚠️ שחרור בצד מחזיר אותו למקום:
   ⭐ האישור הוא התנועה עצמה, ⛔ ואין כפתור שני שמאשר.
   ══════════════════════════════════════════════════════════════════════════ */
var COIN = { el: null, tgt: null, dx: 0, dy: 0, over: false };

function slideScreenHTML() {
  var isInc = view.flow === 'income';
  var art = document.getElementById(isInc ? 'asset-wallet' : 'asset-kupa');
  return '<div class="slide" id="slide">' +
    '<button class="back bk" data-act="flow-back" aria-label="חזרה">›</button>' +
    '<div class="ttl">' + esc(isInc ? MSG_SLIDE_WALLET : MSG_SLIDE_KUPA) + '</div>' +
    '<div class="sub">' + esc(MSG_SLIDE_SUB) + '</div>' +
    '<div class="target ' + (isInc ? 'wide' : 'narrow') + '" id="slide-target">' +
    (art ? art.innerHTML : '') + '</div>' +
    '<div class="coin" id="coin"><span class="ring"></span>' +
    plain(Math.abs(view.draft.amount)) + '</div></div>';
}

function coinWire() {
  var c = document.getElementById('coin'), t = document.getElementById('slide-target');
  if (!c || !t) { uiNoDialog('coinWire', 'coin'); return; }
  COIN.el = c; COIN.tgt = t;
  var box = t.getBoundingClientRect();
  c.style.left = (window.innerWidth / 2 - 75) + 'px';
  c.style.top = (box.bottom + 40) + 'px';
  c.addEventListener('pointerdown', coinDown);
}
function coinDown(e) {
  var c = COIN.el, r = c.getBoundingClientRect();
  COIN.dx = e.clientX - r.left; COIN.dy = e.clientY - r.top;
  c.setPointerCapture(e.pointerId);
  c.addEventListener('pointermove', coinMove);
  c.addEventListener('pointerup', coinUp);
}
function coinMove(e) {
  var c = COIN.el;
  c.style.left = (e.clientX - COIN.dx) + 'px';
  c.style.top = (e.clientY - COIN.dy) + 'px';
  var over = coinOverTarget();
  if (over !== COIN.over) { COIN.over = over; c.classList.toggle('over', over); }
}
function coinOverTarget() {
  var a = COIN.el.getBoundingClientRect(), b = COIN.tgt.getBoundingClientRect();
  var cx = a.left + a.width / 2, cy = a.top + a.height / 2;
  return cx > b.left && cx < b.right && cy > b.top && cy < b.bottom + 40;
}
function coinUp(e) {
  var c = COIN.el;
  c.removeEventListener('pointermove', coinMove);
  c.removeEventListener('pointerup', coinUp);
  if (!coinOverTarget()) { coinReturn(); return; }
  coinSwallow();
}
function coinReturn() {
  var c = COIN.el, box = COIN.tgt.getBoundingClientRect();
  c.classList.remove('over');
  c.style.transition = 'left var(--dur-4) ease, top var(--dur-4) ease';
  c.style.left = (window.innerWidth / 2 - 75) + 'px';
  c.style.top = (box.bottom + 40) + 'px';
}

/*  ⛔ הרגישות עוברת כאן בלבד — ⚠️ הצליל נוצר ב-`AudioContext`:
 *  ⭐ אין קובץ שמע, ⛔ ואין טעינה מהרשת. */
function sensoryFire() {
  if (!APP_SENSORY.on) return;
  try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
  try {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    var ctx = new A(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.38);
  } catch (e) { console.warn('[snd] הצליל לא נוצר', e); }
}

/*  ⛔ הפטל אינו כאן — ⚠️ **מה נכנס**: אסימון צבע שהפתית נושאת;
 *  ⛔ **ומה מפיל**: `--rasp` או `--rasp-ink` — ⭐ הם הסימן של שני המקומות,
 *  ⛔ וצבע שמופיע בכל מקום מפסיק להיות סימן. */
var CONF_COLORS = ['--purple-3', '--peach-2', '--purple-6', '--bg', '--purple-5'];
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var box = document.createElement('div');
  box.className = 'conf';
  var i, s = '';
  for (i = 0; i < 90; i++)
    s += '<i style="left:' + Math.round(Math.random() * 100) + '%;top:' +
         Math.round(Math.random() * 40) + '%;background:var(' +
         CONF_COLORS[i % CONF_COLORS.length] + ')"></i>';
  box.innerHTML = s;
  document.body.appendChild(box);
  setTimeout(function () { box.remove(); }, 1300);
}

function coinSwallow() {
  var c = COIN.el, b = COIN.tgt.getBoundingClientRect();
  c.style.transition = 'left var(--dur-4) ease, top var(--dur-4) ease';
  c.style.left = (b.left + b.width / 2 - 75) + 'px';
  c.style.top = (b.top) + 'px';
  setTimeout(function () {
    c.style.transition = 'transform var(--dur-4) ease, opacity var(--dur-4) ease';
    c.style.transform = 'scale(.9,.06)';
    c.style.opacity = '0';
  }, 280);
  setTimeout(function () { sensoryFire(); confetti(); flowCommit(); }, 600);
}

/* ══════════════════════════════════════════════════════════════════════════
   הכתיבה — מקומית-תחילה, והדחיפה היא רענון
   ══════════════════════════════════════════════════════════════════════════ */
function localPut(table, row) {
  var l = DATA[table], i;
  for (i = 0; i < l.length; i++) if (idEq(l[i].client_id, row.client_id)) { l[i] = row; break; }
  if (i === l.length) l.push(row);
  mirrorSave(table, l);
  pendMark(table, row.client_id);
}

function flowCommit() {
  var d = view.draft, isInc = view.flow === 'income';
  var row = {
    client_id: newClientId(),
    month_client_id: monthKeyForDate(d.entry_date),
    type: isInc ? 'income' : 'tzedakah',
    amount: d.amount,
    description: d.description,
    entry_date: d.entry_date,
    method: d.method,
    category: isInc ? '' : d.category,
    source: 'manual',
    verified: false,
    so_instance_client_id: null,
    updated_at: Date.now(),
    deleted: false
  };
  localPut('kp_entries', row);
  view.monthKey = row.month_client_id;
  var before = chainOf(view.monthKey);
  pushSoon();
  view.screen = 'done';
  view.doneInc = isInc;
  kpRender();
  if (before && before.done) {
    toast(MSG_MONTH_DONE, 4000, 'good');
  }
}

function doneScreenHTML() {
  var c = chainOf(view.monthKey) || {};
  var isInc = view.doneInc;
  return openerHTML() + '<div class="done">' +
    '<div class="line1">' + esc(isInc ? MSG_OPENER : MSG_TZ_BLESS) + '</div>' +
    '<div class="line2">' + esc('נרשם · ' + (isInc
      ? 'הכנסות החודש ' + money(c.income || 0)
      : 'נשאר לפלעזדש החודש ' + money(c.short || 0))) + '</div>' +
    '<button class="btn u-mt-5" data-act="done-close">חזרה</button></div>' + closerHTML();
}

/* ══════════════════════════════════════════════════════════════════════════
   עריכה ומחיקה רכה
   ══════════════════════════════════════════════════════════════════════════
   ⛔ המחיקה רכה — ⚠️ ואחריה «בטל» לחמש שניות: ⭐ החלון הוא מה שמפריד בין
   טעות לפעולה, ⛔ ומחיקה פיזית אינה קיימת בשום מסלול.
   ══════════════════════════════════════════════════════════════════════════ */
var UNDO = { row: null, timer: null };

function entryById(id) {
  var l = kpLive(DATA.kp_entries), i;
  for (i = 0; i < l.length; i++) if (idEq(l[i].client_id, id)) return l[i];
  return null;
}

/*  ⛔ מפת האב-ובן — ⚠️ **מה נכנס**: טבלת האב ⟵ כל בן שתלוי בשורה שלה
 *  ובשם העמודה שקושרת ביניהם; ⛔ **ומה מפיל**: זוג שחי בסכימה ואינו כאן —
 *  ⚠️ הוא נשאר יתום אחרי מחיקת האב. ⭐ **ולמה המבנה קיים**: המחיקה עוברת
 *  בנקודה אחת, ⛔ והיא צריכה לדעת את מי לגרור. */
var KP_CHILDREN = {
  kp_standing_orders: [{ table: 'kp_so_instances', fk: 'standing_order_client_id' }],
  kp_months:          [{ table: 'kp_so_instances', fk: 'month_client_id' },
                       { table: 'kp_entries',      fk: 'month_client_id' }],
  kp_so_instances:    [{ table: 'kp_entries',      fk: 'so_instance_client_id' }]
};

/*  ⛔ הבן יורש את מחיקת האב ואת חותמתה — ⚠️ דגל המחיקה, חותמת המחיקה
 *  וחותמת העריכה נלקחים מרשומת האב: ⭐ מחיקת אב ובניו היא אירוע אחד,
 *  ⛔ ושתי חותמות לאותה מחיקה הן שתי הכרעות במנוע המיזוג. */
function kpChildKill(parent, kid) {
  kid.deleted = !!parent.deleted;
  kid.deleted_at = parent.deleted_at;
  kid.deleted_by = parent.deleted_by;
  kid.updated_at = parent.updated_at;
  return kid;
}

/*  ⛔ כל מחיקה רכה עוברת כאן — ⚠️ הרשומה מסומנת, ⭐ וכל בן שתלוי בה יורש
 *  את אותה חותמת בדיוק: ⛔ מחיקה שנכתבת באתר הקריאה משאירה בן יתום,
 *  ⚠️ והוא נספר בסיכום של חודש שכבר אינו קיים. */
function kpKill(table, row) {
  row.deleted = true;
  row.deleted_at = new Date().toISOString();
  row.deleted_by = devId();
  row.updated_at = Date.now();
  localPut(table, row);
  var kids = KP_CHILDREN[table] || [], i, j, list, kid;
  for (i = 0; i < kids.length; i++) {
    list = kpLive(DATA[kids[i].table] || []);
    for (j = 0; j < list.length; j++) {
      kid = list[j];
      if (!idEq(kid[kids[i].fk], row.client_id)) continue;
      localPut(kids[i].table, kpChildKill(row, kid));
    }
  }
  return row;
}

function entryDelete(id) {
  var r = entryById(id);
  if (!r) { uiNoDialog('entryDelete', id); return Promise.resolve(); }
  return ask(MSG_DELETE, MSG_DEL_PRE + r.description + ' ' + money(r.amount) + MSG_DEL_POST,
             MSG_DELETE).then(function (yes) {
    if (!yes) return;
    var copy = JSON.parse(JSON.stringify(r));
    kpKill('kp_entries', r);
    UNDO.row = copy;
    if (UNDO.timer) clearTimeout(UNDO.timer);
    UNDO.timer = setTimeout(function () { UNDO.row = null; pushSoon(); }, 5000);
    kpRender();
    toast(MSG_DELETED + ' · ' + MSG_UNDO, 5000);
  });
}

function entryUndo() {
  if (!UNDO.row) return;
  var r = UNDO.row;
  r.deleted = false; r.deleted_at = null; r.deleted_by = null; r.updated_at = Date.now();
  localPut('kp_entries', r);
  UNDO.row = null;
  if (UNDO.timer) clearTimeout(UNDO.timer);
  pushSoon();
  kpRender();
}

/* ══════════════════════════════════════════════════════════════════════════
   הוראות קבע — עריכה פותחת גרסה
   ══════════════════════════════════════════════════════════════════════════
   ⛔ עריכת מופע היא עריכת ההוראה **מהחודש והלאה** — ⚠️ הישנה מקבלת
   «תוקף עד» החודש הקודם, ⭐ והחדשה מתחילה כאן: ⛔ מופעים קודמים אינם
   משתנים, שהם כבר נספרו.
   ══════════════════════════════════════════════════════════════════════════ */
function orderNewVersion(o, patch, fromMonth) {
  var m = monthByKey(fromMonth) || monthByKey(view.monthKey);
  if (!m) { uiNoDialog('orderNewVersion', fromMonth); return null; }
  var key = m.hebrew_year + '-' + String(m.ordinal);
  var prev = prevMonthOf(m.client_id);
  var old = kpLive(DATA.kp_standing_orders).filter(function (x) {
    return idEq(x.client_id, o.client_id);
  })[0];
  if (old) {
    old.valid_to_month = prev ? (prev.hebrew_year + '-' + String(prev.ordinal)) : key;
    old.active = false;
    old.updated_at = Date.now();
    localPut('kp_standing_orders', old);
  }
  var next = {
    client_id: newClientId(), name: patch.name != null ? patch.name : o.name,
    amount: patch.amount != null ? patch.amount : o.amount,
    day_of_month: patch.day_of_month != null ? patch.day_of_month : o.day_of_month,
    method: o.method, category: o.category, active: true,
    valid_from_month: key, valid_to_month: null,
    supersedes_id: o.client_id, updated_at: Date.now(), deleted: false
  };
  localPut('kp_standing_orders', next);
  return next;
}

/* ══════════════════════════════════════════════════════════════════════════
   ההגדרות
   ══════════════════════════════════════════════════════════════════════════ */
function settingsScreenHTML() {
  return openerHTML() +
    '<div class="mrow"><span class="mname">' + esc(MSG_SETTINGS_TITLE) + '</span></div>' +
    ordersCardHTML() +
    '<div class="card"><h2>' + esc(MSG_SENSORY) + '</h2>' +
    '<button class="opt' + (APP_SENSORY.on ? ' on' : '') + '" data-act="sensory-toggle">' +
    esc(APP_SENSORY.on ? 'פועל' : 'כבוי') + '</button></div>' +
    '<div class="card"><h2>מקורות</h2><ul class="det">' +
    lookupList('source', SRC_DEFAULT).map(function (s) {
      return '<li><span class="ico">' + iconFor('other') + '</span>' +
             '<span class="nm">' + esc(s) + '</span></li>';
    }).join('') + '</ul></div>' +
    monthsChartHTML() +
    '<button class="btn ghost" data-act="settings-close">חזרה</button>' + closerHTML();
}

/*  ⛔ הסדרה נבנית מהרכיב המשותף ⛔ ולא מספרייה — ⚠️ פס יחיד ופס בסדרה
 *  הם רכיב אחד, ⭐ ו-`barChart` מחזיר מחרוזת ריקה בפחות משתי נקודות:
 *  ⛔ חודש אחד אינו סדרה. */
function monthsChartHTML() {
  var rows = monthsSorted().map(function (m) {
    var c = chainOf(m.client_id) || {};
    var got = Math.max(0, (c.tzedakah || 0) + Math.max(0, c.prevBalance || 0));
    var tgt = Math.max(0, c.chumash || 0);
    return { lab: m.name, val: got, tgt: tgt, end: plain(got),
             txt: m.name + ' · ' + plain(got) + ' מתוך ' + plain(tgt) };
  });
  var h = barChart(rows, MSG_MONTHS_CHART);
  return h ? '<div class="card"><h2>' + esc(MSG_MONTHS_CHART) + '</h2>' + h + '</div>' : '';
}

/* ══════════════════════════════════════════════════════════════════════════
   הרינדור האחד
   ══════════════════════════════════════════════════════════════════════════ */
function kpRender() {
  var root = kpQ('#app');
  if (!root) { uiNoDialog('kpRender', 'app'); return; }
  var fab = kpQ('#fab');
  if (view.screen === 'month') root.innerHTML = monthScreenHTML();
  else if (view.screen === 'flow') root.innerHTML = flowScreenHTML();
  else if (view.screen === 'slide') root.innerHTML = slideScreenHTML();
  else if (view.screen === 'done') root.innerHTML = doneScreenHTML();
  else if (view.screen === 'settings') root.innerHTML = settingsScreenHTML();
  var onMonth = view.screen === 'month';
  if (fab) fab.classList.toggle('hidden', !onMonth);
  if (view.screen === 'slide') coinWire();
}

/* ══════════════════════════════════════════════════════════════════════════
   מפת הפעולות — הניתוב האחד
   ══════════════════════════════════════════════════════════════════════════
   ⛔ כל כפתור נושא `data-act`, ⚠️ והמטפל נמצא כאן: ⭐ מטפל שממתין
   לכתיבה מחזיר את ההבטחה, ⛔ והניתוב מנטרל את הכפתור עד שהסתיימה.
   ══════════════════════════════════════════════════════════════════════════ */
var DOM_ACTIONS = {
  /*  ⛔ הבחירה בין שני הרישומים היא דיאלוג עם שני כפתורים מתויגים —
   *  ⚠️ ולא «כן/לא»: ⭐ `ask` נותן «ביטול» לצד השני, ⛔ ומי שלוחץ אינו
   *  יודע שהוא בחר הכנסה. */
  'add-open': function () {
    openModal(MSG_WHAT_TO_ADD, '',
      '<button class="btn ghost" data-act="add-income">' + esc(MSG_ADD_INCOME) + '</button>' +
      '<button class="btn" data-act="add-tzedakah">' + esc(MSG_ADD_TZEDAKAH) + '</button>');
  },
  'add-income':   function () { closeModal(); flowStart('income'); },
  'add-tzedakah': function () { closeModal(); flowStart('tzedakah'); },
  'month-prev': function () {
    var p = prevMonthOf(view.monthKey);
    if (p) { view.monthKey = p.client_id; kpRender(); }
  },
  'month-next': function () {
    var n = nextMonthOf(view.monthKey);
    if (n) { view.monthKey = n.client_id; kpRender(); }
  },
  'month-goto': function (el) { view.monthKey = el.dataset.id; kpRender(); },
  'flow-next': function () {
    flowCollect();
    var bad = flowValid();
    if (bad) { toast(bad, 4000, 'bad'); return; }
    if (view.step === flowSteps().length - 1) { view.screen = 'slide'; kpRender(); return; }
    view.step++;
    kpRender();
  },
  'flow-back': function () {
    if (view.screen === 'slide') { view.screen = 'flow'; kpRender(); return; }
    if (view.step === 0) { view.screen = 'month'; view.flow = null; kpRender(); return; }
    view.step--;
    kpRender();
  },
  'flow-pick': function (el) { view.draft[el.dataset.k] = el.dataset.v; kpRender(); },
  'flow-ac': function (el) {
    var f = kpQ('#f-desc');
    if (!f) { uiNoDialog('flow-ac', 'f-desc'); return; }
    f.value = el.dataset.v;
  },
  /*  ⛔ שני מטפלי ההתראה של הבלוקים המשותפים — ⚠️ הכפתורים נבנים בתוך
   *  הבלוק החתום, ⭐ והניתוב אליהם חי במפה: ⛔ כפתור בלי מטפל הוא חצי
   *  חיווט, ⚠️ והמשתמש לוחץ ודבר אינו קורה. */
  /*  ⛔ שני מסלולי ההכרעה של דיאלוג האישור — ⚠️ הרקע ו-`Escape` עונים
   *  «לא», ⭐ והכפתורים הם המסלול שעונה «כן». */
  'ask-yes': function () { closeAsk(true); },
  'ask-no':  function () { closeAsk(false); },
  'ls-alert-close':      function () { var el = document.getElementById('ls-alert'); if (el) el.style.display = 'none'; },
  'pend-alert-ok':       function () { _pendAlertDismissed = Date.now(); pendRenderAlert(); },
  'entry-menu': function (el) { return entryDelete(el.dataset.id); },
  'entry-undo': function () { entryUndo(); },
  'order-edit': function (el) {
    var o = orderById(el.dataset.id);
    if (!o) { uiNoDialog('order-edit', el.dataset.id); return; }
    openModal(MSG_EDIT + ' · ' + o.name,
      '<div class="ksave"><div class="fld"><label for="o-amt">סכום</label>' +
      '<input id="o-amt" type="text" inputmode="decimal" value="' + esc(o.amount) + '">' +
      '</div></div>',
      '<button class="btn" data-act="order-save" data-id="' + esc(o.client_id) +
      '" data-ksave>שמור</button>');
  },
  'order-save': function (el) {
    var inp = kpQ('#o-amt');
    if (!inp) { uiNoDialog('order-save', 'o-amt'); return; }
    var o = orderById(el.dataset.id);
    if (!o) { uiNoDialog('order-save', el.dataset.id); return; }
    var v = readNum(inp, null);
    if (v === null || v <= EPS) { toast(MSG_NEED_AMOUNT, 4000, 'bad'); return; }
    return runSave(function () {
      orderNewVersion(o, { amount: v }, view.monthKey);
      closeModal();
      kpRender();
      return Promise.resolve();
    }, MSG_SAVED_LOCAL);
  },
  'sensory-toggle': function () {
    APP_SENSORY.on = !APP_SENSORY.on;
    cfgWrite('sensory', APP_SENSORY.on);
    kpRender();
  },
  'settings-open': function () { view.screen = 'settings'; kpRender(); },
  'settings-close': function () { view.screen = 'month'; kpRender(); },
  'done-close': function () { view.screen = 'month'; view.flow = null; kpRender(); },
  'sw-reload': function () { swApply(); }
};

/* ══════════════════════════════════════════════════════════════════════════
   המאזינים הגלובליים
   ══════════════════════════════════════════════════════════════════════════
   ⛔ מאזין אחד לכל אירוע, בהאצלה מ-`document` — ⚠️ המסכים נבנים מחדש
   בכל רינדור, ⭐ ומאזין שנקשר לאלמנט מת איתו.
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', function (e) {
  if (modalBackdrop(e)) return;
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = DOM_ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  actRun(el, fn);
});

document.addEventListener('keydown', function (e) {
  if (ksKey(e)) return;
  modalEsc(e);
});

/* ══════════════════════════════════════════════════════════════════════════
   העלייה
   ══════════════════════════════════════════════════════════════════════════ */
function kpBoot() {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  lsBoot();
  _kpLoadPushed();
  cfgBoot();
  mirrorBoot(PUSH_TABLES, DATA);
  var ms = monthsSorted();
  view.monthKey = ms.length ? ms[ms.length - 1].client_id : null;
  kpRender();
  pendBoot();
  tombBoot();
  bkBoot();
  hwBoot();
  rtyBoot();
  plBoot();
  swRegister();
  sbWatch();
  kpSyncPull().then(function () {
    var made = soEnsureInstances(view.monthKey), i;
    for (i = 0; i < made.length; i++) localPut('kp_so_instances', made[i]);
    if (made.length) pushSoon();
    kpRender();
  });
}
kpBoot();

})();
</script>

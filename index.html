/* ═══ ליבת החישוב של «הקופה» — בלוק פר-אפליקציה ═══════════════════════════
   ⛔ אף סיכום אינו נשמר — ⚠️ כל מספר כאן נגזר מהרישומים בזמן קריאה,
   ⭐ וזו הסיבה שהאפליקציה קיימת: בגיליון, טעות בטבת נגררה חצי שנה.
   ⛔ **ואין כאן קריאה למסד ואין `.rpc`** — ⚠️ חישוב בשרת שובר אופליין
      ⛔ ואינו נסרק.
   ⛔ **שני חישובים נפרדים על אותה צדקה** — ⚠️ החומש חלק מההכנסות בפועל,
      ⭐ והפלעדזש סכום שנקבע לשנה וחוזר בכל אחד מחודשיה.
   ⛔ **ושניהם מעבירים יתרה — זכות וחובה כאחת** — ⚠️ מה שנשאר בסוף חודש
      הוא הפתיחה של הבא: ⭐ רצפה שמעבירה עודף בלבד מוחקת חוב שאיש לא מחל.
   ⛔ **וההבדל היחיד הוא ראש השנה העברית** — ⚠️ הפלעדזש מתאפס שם, ⭐ שהוא
      החלטה שנתית חדשה; ⛔ והחומש אינו מתאפס, ⚠️ שבו אנו חייבים תמיד.
   ═══════════════════════════════════════════════════════════════════════ */
var K_CHUMASH_RATE = 0.2;
var K_CAT_SELF = 'אישי';

function kSum(a) { var s = 0, i; for (i = 0; i < a.length; i++) s += a[i]; return s; }
function kLive(rows) { return rows.filter(function (r) { return !r.deleted; }); }

function kIncome(rows) {
  return kSum(kLive(rows).filter(function (r) { return r.type === 'income'; })
    .map(function (r) { return +r.amount || 0; }));
}
function kTzedakah(rows) {
  return kSum(kLive(rows).filter(function (r) { return r.type === 'tzedakah'; })
    .map(function (r) { return +r.amount || 0; }));
}
function kChumash(income) { return income * K_CHUMASH_RATE; }

function kSelfPct(rows) {
  var tz = kTzedakah(rows);
  if (!tz) return 0;
  var self = kSum(kLive(rows).filter(function (r) {
    return r.type === 'tzedakah' && r.category === K_CAT_SELF;
  }).map(function (r) { return +r.amount || 0; }));
  return self / tz * 100;
}

/*  ⛔ השרשרת נגזרת מכל החודשים בסדר — ⚠️ שתי היתרות מצטברות, ⭐ ולכן
 *  חודש בודד אינו מספיק: ⛔ הוא אינו יודע מה קדם לו.
 *  ⛔ **והיתרה עוברת הלאה תמיד** — ⚠️ בשני החישובים: ⭐ ותנאי שעוצר
 *  אותה בחודש כלשהו הוא שני חישובים שנראים זהים ⛔ ואחד מהם נעצר. */
function kChain(months, opts) {
  var pledgeOf = opts.pledgeOf;
  var balance = opts.opening || 0;
  var pBalance = 0;
  var prevYear = null;
  var out = [], i, m;
  for (i = 0; i < months.length; i++) {
    m = months[i];
    var income = kIncome(m.rows);
    var tzedakah = kTzedakah(m.rows);
    var chumash = kChumash(income);
    var pledge = pledgeOf(m.year);
    /*  ⛔ החומש — ⚠️ החובה הכוללת היא חומש החודש פחות היתרה שנשארה:
     *  ⭐ יתרה חיובית היא זכות ומקטינה, ⛔ ושלילית היא חוב ומגדילה. */
    var prevBalance = balance;
    var chumashCarry = -prevBalance;
    var chumashDue = chumash + chumashCarry;
    var chumashLeft = chumashDue - tzedakah;
    balance = -chumashLeft;

    /*  ⛔ הפלעדזש — ⚠️ אותה צורה בדיוק, ⭐ ושני הבדלים: ⛔ היתרה מתאפסת
     *  בראש השנה, ⚠️ והסכום החודשי נקבע פעם בשנה. */
    var yearTurn = prevYear !== null && String(m.year) !== prevYear;
    var pledgeOpen = yearTurn ? 0 : pBalance;
    var pledgeCarry = -pledgeOpen;
    var pledgeDue = pledge + pledgeCarry;
    var pledgeLeft = pledgeDue - tzedakah;
    pBalance = -pledgeLeft;
    prevYear = String(m.year);

    out.push({ key: m.key, year: m.year, income: income, tzedakah: tzedakah,
               chumash: chumash, pledge: pledge, prevBalance: prevBalance,
               balance: balance, chumashCarry: chumashCarry, chumashDue: chumashDue,
               chumashLeft: chumashLeft, pledgeOpen: pledgeOpen,
               pledgeBalance: -pledgeLeft, pledgeCarry: pledgeCarry,
               pledgeDue: pledgeDue, pledgeLeft: pledgeLeft,
               selfPct: kSelfPct(m.rows) });
  }
  return out;
}
/* ═══════════════ סוף ליבת החישוב ═══════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════════
   מטא-הטבלאות — מקור אחד לשם, למפתח ולחותמת
   ══════════════════════════════════════════════════════════════════════════

/*  ⛔ שם החודש נושא את השנה — ⚠️ ותווית השנה באה מהמנוע המשותף:
 *  ⭐ צורה שנייה כאן הייתה מקור אמת שני לתצוגה. */
function monthTitle(m) {
  return m.name + ' ' + window.hebYearLabelFull(m.year);
}

/*  ⛔ האייקון של ההכנסה ושל הצדקה הוא הציור שהאפליקציה כבר מציגה —
 *  ⚠️ ואינו ציור שני: ⭐ שני ציורים לאותו מושג הם שני מקורות אמת. */
function assetIcon(id) {
  var el = document.getElementById(id);
  if (!el) { uiNoDialog('assetIcon', id); return ''; }
  return el.innerHTML;
}

function iconFor(kind) {
  /*  ⛔ סט קווי-מעוגל אחד, עובי 1.75 — ⚠️ ואייקון קבוע לכל מקור. */
  var p = {
    other:    'M12 4v16 M4 12h16',
    standing: 'M12 7v5l3 2 M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
    home:     'M4 11l8-7 8 7 M7 10v10h10V10',

         p.split(' M').map(function (s, i) { return '<path d="' + (i ? 'M' + s : s) + '"/>'; }).join('') +

}

/*  ⛔ הכנסה ⟵ ארנק · צדקה ⟵ קופה — ⚠️ בדיוק אותם ציורים שהאפליקציה
 *  מציגה במסך האישור: ⭐ אייקון שני לאותו מושג הוא מקור אמת שני.
 *  ⚠️ **ושורה של הוראת קבע נפתחת בעורך ההוראה** — ⛔ ולא בעורך התנועה:
 *  ⭐ אין לה שורה ב-`k_entries`, ⛔ והעורך היה מוצא ריק. */
function detailRowHTML(r) {
  var isInc = r.type === 'income';
  var so = r.source === 'standing';
  var tag = so ? 'הו״ק' : (isInc ? MSG_ADD_INCOME : (r.verified ? 'אומת' : ''));
  return (so ? '<li' + (soIsForecast(r) ? ' class="pend"' : '') +
               ' data-act="order-edit" data-id="' + esc(r.order_id || '')
             : '<li data-act="entry-menu" data-id="' + esc(r.client_id)) + '">' +
         '<span class="ico art">' + assetIcon(isInc ? 'asset-wallet' : 'asset-kupa') + '</span>' +
         '<span class="nm">' + esc(r.description || '') + '</span>' +
         '<span class="tag">' + esc(tag) + '</span>' +
         '<span class="amt">' + money(r.amount) + '</span></li>';
}

/*  ⛔ הסכום שעוד חייבים נכתב כמות שהוא ⛔ ובלי סימן — ⚠️ הוא המצב הרגיל,
 *  ⭐ וסימן שמתלווה לכל מספר מפסיק לומר דבר: ⛔ **והמינוס שמור ליתרת
 *  זכות בלבד** — ⚠️ והוא מה שמבדיל בין «נשאר לתת» ל«נתנו יותר».
 *  ⚠️ **ומינוס טיפוגרפי ⛔ ולא מקף** — ⭐ המקף נקרא בעברית כחלק מהמילה
 *  שלפניו · ⚠️ **והמספר עטוף בכיוון שמאל-ימין** — ⛔ הסימן שייך למספר,
 *  ⭐ ובלעדיו האלגוריתם הדו-כיווני מעיף אותו אל קצה השורה. */
function signed(n) {
  /*  ⛔ אפס שלילי מתאפס — ⚠️ `Math.round(-0.2)` הוא `-0`, ⭐ והוא אינו
   *  קטן מאפס: ⛔ והמעצב מדפיס «‎-0 ₪», ⚠️ שנקרא כחוב של כלום. */
  var v = Math.round(n) || 0;
  return '<span class="ltr">' + esc(v < 0 ? '−' + money(-v) : money(v)) + '</span>';
}

/*  ⛔ פיצול הצדקה באחוזים ⛔ ולא בסכומים — ⚠️ הסכומים כבר בשורה שמעליו,
 *  ⭐ והחלוקה היא מה שהשורה הזו אומרת: ⛔ **וחודש בלי צדקה מציג אפס בשניהם**
 *  ⛔ ולא אפס ומלוא המניין — ⚠️ אחוז מתוך אפס אינו חלוקה, ⭐ והמשלים שם
 *  מדווח על חלוקה שלא נעשתה.
 *  ⚠️ **והמשלים נגזר מהמעוגל** ⛔ ולא מעוגל בנפרד — ⭐ שני עיגולים
 *  נפרדים נותנים 99 או 101. */
function splitHTML(c) {
  var tz = c.tzedakah || 0;
  var self = tz > EPS ? Math.round(c.selfPct || 0) : 0;
  return '<span>' + esc(MSG_SUM_SELF + (tz > EPS ? self : 0) + '%') + '</span>' +
         '<span>' + esc(MSG_SUM_OTHERS + (tz > EPS ? 100 - self : 0) + '%') + '</span>';
}

/*  ⛔ הפס מודד מה שניתן החודש מול החובה הכוללת — ⚠️ וחובה שאינה חיובית
 *  היא פס מלא: ⭐ אין מה להשלים, ⛔ וחלוקה בה הייתה אינסוף. */
function compPct(given, due) {
  if (due <= EPS) return 100;
  return Math.min(100, Math.max(0, given / due * 100));
}

/*  ⛔ שני הרכיבים בצורה אחת בדיוק — ⚠️ **מה נכנס**: הכותרת · גוון הפס ·
 *  החובה הכוללת · החלק שמהחודש · החלק שמהיתרה · מה שניתן · והיתרה שנותרה;
 *  ⛔ **ומה מפיל**: רכיב שנבנה באתר הקריאה — ⭐ שתי צורות לאותו מושג הן
 *  שני מסכים בעיני הקורא.
 *  ⚠️ **והמסגרת עולה כשהיתרה בזכות** ⛔ ולא כשהחובה אפס: ⭐ אפס מתוך אפס
 *  אינו עודף, ⛔ והמסגרת שם הייתה מברכת על מה שלא נעשה. */
function compCardHTML(title, tone, due, ofMonth, ofCarry, given, after) {
  return '<div class="card comp' + (tone ? ' ' + tone : '') +
    (after > EPS ? ' plus' : '') + '">' +
    '<h2>' + esc(title) +
    '<span class="st">' + esc(MSG_LEFT_SUM) + signed(due - given) + '</span></h2>' +
    '<div class="comp-meter">' + bar(compPct(given, due).toFixed(1), tone) + '</div>' +
    '<div class="crow"><div class="big">' + signed(due) + '</div>' +
    '<div class="parts">' +
    '<span>' + esc(MSG_PART_MONTH) + signed(ofMonth) + '</span>' +
    '<span>' + esc(MSG_PART_CARRY) + signed(ofCarry) + '</span>' +
    '</div></div></div>';
}

function monthScreenHTML() {
  var m = monthByKey(view.monthKey);
  if (!m) return brandHTML() + '<div class="card"><div class="empty">' +
             '<div class="skel"></div><div class="skel"></div></div></div>' + footHTML();
  var c = chainOf(view.monthKey, true) || {};
  var rows = kSortEntries(monthRows(view.monthKey));

  /* 1 — הלוגו. */
  var h = brandHTML();

  /* 2 — שם החודש, טווח התאריכים הלועזי והחצים. */
  h += '<div class="mrow">' +
       '<button class="mnav" data-act="month-prev" aria-label="חודש קודם">›</button>' +
       '<span class="mid"><span class="mname">' + esc(m.name) + '</span>' +
       '<span class="myear">' + esc(window.hebYearLabelFull(m.year)) + '</span>' +
       '<span class="mgreg">' + esc(monthGreg(m.key)) + '</span></span>' +
       '<button class="mnav" data-act="month-next" aria-label="חודש הבא">‹</button>' +
       '</div>';

  /* 3 — שני הרכיבים, בצורה אחת. */
  h += compCardHTML('חומש', '', c.chumashDue, c.chumash, c.chumashCarry,
                    c.tzedakah, c.balance);
  h += compCardHTML('פלעדזש', 'peach', c.pledgeDue, c.pledge, c.pledgeCarry,
                    c.tzedakah, c.pledgeBalance);

  /* 4 — שורות הסיכום, מעל הפירוט ⛔ ולא מעל הרכיבים: ⚠️ הן נגזרות
     מהחודש הנוכחי בלבד, ⭐ ואין בהן יתרה ואין בהן צבירה.
     ⚠️ **והפירוט שמתחתן הוא פיצול של הצדקה** — ⛔ ולא סכום נוסף:
     ⭐ ולכן הוא קטן משתיהן, ⛔ ונקרא כשייך לשורה שמעליו. */
  h += '<div class="inc">' + esc(MSG_SUM_INCOME) +
       '<b>' + esc(money(c.income || 0)) + '</b></div>' +
       '<div class="inc">' + esc(MSG_SUM_TZEDAKAH) +
       '<b>' + esc(money(c.tzedakah || 0)) + '</b></div>' +
       '<div class="inc sub">' + splitHTML(c) + '</div>';

  /* 5 — הפירוט: התאריכים תחילה, והוראות הקבע תחתיהם. */
  var dated = rows.filter(function (r) { return r.source !== 'standing'; });
  var std = rows.filter(function (r) { return r.source === 'standing'; });
  if (!rows.length) {
    h += '<div class="card"><div class="empty">' + esc(MSG_EMPTY_PRE + m.name) + '</div></div>';
  } else {
    h += '<div class="card"><h2>פירוט</h2>' +
         (dated.length ? '<ul class="det">' + dated.map(detailRowHTML).join('') + '</ul>' : '') +
         /*  ⛔ כותרת המשנה מסמנת את מקומן ⛔ ואינה כותרת כרטיס — ⚠️ הוראות
          *  הקבע הן המשך אותה רשימה, ⭐ ולא רשימה שנייה. */
         (std.length ? '<div class="subhd">' + esc(MSG_ORDERS_TITLE) + '</div>' +
                       '<ul class="det">' + std.map(detailRowHTML).join('') + '</ul>' : '') +
         '</div>';
  }
  /*  ⛔ הביטול הוא כפתור על המסך ⛔ ולא טקסט בטוסט — ⚠️ טוסט הוא הודעה
   *  ואינו אתר לחיצה: ⭐ «בטל» שאין לו כפתור הוא הבטחה שאין לה מסלול. */
  if (UNDO.row)
    h += '<button class="btn ghost" data-act="entry-undo">' + esc(MSG_UNDO) + '</button>';
  return h + footHTML();
}

/*  ⛔ שלוש הלשוניות, ומרשם אחד — ⚠️ **מה נכנס**: מפתח המסך, התווית
 *  והאייקון; ⛔ **ומה מפיל**: מפתח שאין לו מסך — ⭐ הלחיצה עוברת
 *  והמסך אינו מתחלף. */
var TABS = [
  { k: 'month',    lab: 'בית',    ic: 'home' },
  { k: 'archive',  lab: 'ארכיון', ic: 'archive' },
  { k: 'settings', lab: MSG_SETTINGS_TITLE, ic: 'gear' }
];
function tabbarHTML() {
  return '<div class="in">' + TABS.map(function (t) {
    return '<button class="tab-btn' + (view.screen === t.k ? ' on' : '') +
           '" data-act="tab-go" data-id="' + esc(t.k) + '">' +
           '<span class="ti">' + iconFor(t.ic) + '</span>' + esc(t.lab) + '</button>';
  }).join('') + '</div>';
}

/*  ⛔ כותרת המסך זהה בשתי הלשוניות שאינן «בית» — ⚠️ והיא אינה ניווט:
 *  ⭐ אין בה חצים, ⛔ והחצים שייכים לחודש בלבד. */
function tabHeadHTML(lab) {
  return '<div class="mrow"><span class="mid"><span class="mname">' +
         esc(lab) + '</span></span></div>';
}

/*  ⛔ הארכיון מציג חודשים שהגיעו בלבד ⛔ ולא עתידיים — ⚠️ חודש שטרם הגיע
 *  אין בו מה לראות: ⭐ שני פסיו היו ריקים, ⛔ והם נקראים כחודש שלא עמדנו בו.
 *  ⛔ **והחודש הראשון הוא תשרי תשפ״ז** — ⚠️ הוא החודש שממנו האפליקציה
 *  מנהלת: ⭐ ומה שקדם לו נוהל בגיליון, ⛔ ואין לו כאן רשומות. */
var ARCH_FIRST = '5787-01';
function archMonths() {
  var now = nowMonthKey();
  return monthsSorted(false).filter(function (m) {
    return m.key >= ARCH_FIRST && (!now || m.key <= now);
  });
}
/*  ⛔ שני פסי המצב של חודש — ⚠️ בלי שום מספרים: ⭐ הפס מודד מה שניתן מול
 *  החובה הכוללת, ⛔ וכך רואים אם עמדנו ביעד באותו חודש.
 *  ⚠️ **והם עוברים ברכיב הסדרה המשותף** — ⛔ ולא נבנים כאן: ⭐ פס יחיד
 *  ופס בסדרה הם רכיב אחד. */
function monthBarsHTML(c, name) {
  var ch = compPct(c.tzedakah, c.chumashDue), pl = compPct(c.tzedakah, c.pledgeDue);
  return barChart([
    { lab: 'חומש',   val: ch, tgt: 100, end: '', txt: name + ' · חומש ' + Math.round(ch) + '%' },
    { lab: 'פלעדזש', val: pl, tgt: 100, end: '', txt: name + ' · פלעדזש ' + Math.round(pl) + '%' }
  ], name, true);
}
/*  ⛔ המסך מציג שנים, ⛔ ורק לחיצה עליהן פותחת את פירוט החודשים —
 *  ⚠️ רשימה של כל החודשים מאז ההתחלה מתארכת בלי סוף, ⭐ והשנה היא
 *  היחידה שהמשתמש חושב בה. */
function archiveScreenHTML() {
  var ms = archMonths(), h = brandHTML() + tabHeadHTML(TABS[1].lab);
  if (!ms.length) return h + '<div class="card"><div class="empty">' + esc(MSG_ARCH_EMPTY) +
                             '</div></div>' + footHTML();
  var years = [], seen = {}, i;
  for (i = 0; i < ms.length; i++) if (!seen[ms[i].year]) { seen[ms[i].year] = true; years.push(ms[i].year); }
  years.reverse();
  for (i = 0; i < years.length; i++) {
    var y = years[i], open = view.archYear === y;
    h += '<div class="card"><h2 class="fold" data-act="arch-year" data-id="' + esc(y) + '">' +
         esc(window.hebYearLabelFull(y)) + '<span class="st">' + esc(open ? '⌃' : '⌄') +
         '</span></h2>';
    if (open) {
      var mine = ms.filter(function (m) { return m.year === y; }).reverse();
      h += mine.map(function (m) {
        var c = chainOf(m.key, false) || {};
        return '<div class="amon"><button class="amn" data-act="arch-month" data-id="' +
               esc(m.key) + '">' + esc(m.name) + '</button>' +
               monthBarsHTML(c, m.name) + '</div>';
      }).join('');
    }
    h += '</div>';
  }
  return h + footHTML();
}

/*  ⛔ כפתור ההוספה יושב בתוך הכרטיס ⛔ ולא מתחתיו — ⚠️ כפתור שנצמד
 *  לכרטיס הבא אחריו נקרא כשייך לו, ⭐ ומי שמחפש «הוספת הוראה» מחפש
 *  בתוך הוראות הקבע. */
function ordersCardHTML() {
  var os = ordersLive();
  return '<div class="card"><h2>' + esc(MSG_ORDERS_TITLE) + '</h2>' +
    (os.length ? '<ul class="det">' + os.map(function (o) {
      return '<li data-act="order-edit" data-id="' + esc(o.client_id) + '">' +
             '<span class="ico">' + iconFor('standing') + '</span>' +
             '<span class="nm">' + esc(o.name) + '</span>' +
             '<span class="tag">' + esc('יום ' + o.day_of_month) + '</span>' +
             '<span class="amt">' + money(o.amount) + '</span></li>';
    }).join('') + '</ul>'
     : '<div class="empty">' + esc(MSG_NO_ORDERS) + '</div>') +
    '<button class="btn ghost card-add" data-act="order-add">' + esc(MSG_ORDER_NEW) + '</button>' +
    '</div>';
}

/*  ⛔ שני כרטיסי המקורות — ⚠️ אחד להכנסות ואחד לצדקה: ⭐ והם אינם
 *  בפריסה מלאה, ⛔ לחיצה על הכותרת פותחת את רשימתו של אחד מהם.
 *  ⚠️ **והשורות נגררות לשינוי סדר** — ⭐ הסדר הוא מה שהזרימה מציעה בו,
 *  ⛔ ומי שנותן תמיד באותו אופן רוצה אותו ראשון. */
function lookupCardHTML(kind, title, dflt) {
  var open = view.lookOpen === kind;
  var rows = open ? lookupRows(kind) : [];
  var labels = open && !rows.length ? dflt : null;
  return '<div class="card"><h2 class="fold" data-act="look-toggle" data-id="' + esc(kind) + '">' +
    esc(title) + '<span class="st">' + esc(open ? '⌃' : '⌄') + '</span></h2>' +
    (!open ? '' :
      '<ul class="det drag" data-kind="' + esc(kind) + '">' +
      (labels ? labels.map(function (x) {
        return '<li><span class="ico">' + iconFor('other') + '</span>' +
               '<span class="nm">' + esc(x) + '</span></li>';
      }).join('')
      : rows.map(function (r) {
        return '<li data-act="look-edit" data-id="' + esc(r.client_id) + '">' +
               '<span class="grip" aria-hidden="true">⠿</span>' +
               '<span class="nm">' + esc(r.label) + '</span></li>';
      }).join('')) + '</ul>' +
      '<button class="btn ghost card-add" data-act="look-add" data-id="' + esc(kind) + '">' +
      esc(MSG_WAY_NEW) + '</button>') +
    '</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   שני תהליכי הרישום — מסך אחר מסך, שדה אחד
   ══════════════════════════════════════════════════════════════════════════
   ⚠️ **מה נכנס**: הטיוטה והשלב שבו היא נמצאת; ⛔ **ומה מפיל**: שדה שנקרא
   ישירות מה-DOM אחרי מעבר מסך — ⭐ האלמנט כבר אינו שם.
   ══════════════════════════════════════════════════════════════════════════ */
var FLOW_TZ = ['amount', 'desc', 'source', 'category', 'date'];
var FLOW_INC = ['amount', 'desc', 'method', 'date'];

var SRC_DEFAULT = ['מזומן', 'ביט', 'אשראי מענדי', 'אשראי חני', 'העברה', 'אחר'];
var METHOD_DEFAULT = ['העברה ישירה', 'ביט ופייבוקס', 'מזומן', 'צ׳קים'];
var CAT_LIST = ['לאחרים', K_CAT_SELF];
/*  ⛔ אופן החיוב של הוראת קבע הוא אחד משניים ⛔ ואינו רשימת המקורות —
 *  ⚠️ הוראה מחויבת בכרטיס או בהעברה, ⭐ ואין דרך שלישית: ⛔ רשימת
 *  המקורות נערכת בהגדרות, והיא של התנועות ⛔ ולא של ההוראות. */
var ORDER_METHODS = ['אשראי', 'העברה'];

/*  ⛔ שורות המקור של סוג אחד, בסדר שנקבע — ⚠️ והמיון הוא `sort`:
 *  ⭐ הוא מה שהגרירה כותבת, ⛔ ואין סדר שני. */
function lookupRows(kind) {
  return kLive(MIRROR.k_lookups).filter(function (r) { return r.kind === kind; })
    .sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
}
function lookupList(kind, dflt) {
  var l = lookupRows(kind).map(function (r) { return r.label; });
  return l.length ? l : dflt;
}
/*  ⛔ ברירות המחדל מתממשות לשורות בפעולת המשתמש הראשונה ⛔ ולא בעלייה —
 *  ⚠️ עריכה וגרירה דורשות שורה עם מזהה, ⭐ ורשימת נפילה-חזרה אין לה אחד:
 *  ⛔ וכתיבה בזמן רינדור הייתה כותבת במכשיר שרק קורא. */
function lookupSeed(kind, dflt) {
  if (lookupRows(kind).length) return;
  for (var i = 0; i < dflt.length; i++)
    localPut('k_lookups', { client_id: newClientId(), kind: kind, label: dflt[i],
                            sort: i + 1, updated_at: Date.now(), deleted: false });
  pushSoon();
  cfgWrite(CFG_LOOKUPS_EPOCH, Date.now());
}
/*  ⛔ הסדר נכתב מחדש לכל השורות ⛔ ולא לזו שזזה — ⚠️ שתי שורות באותו
 *  `sort` הן סדר שאיש לא הכריע בו, ⭐ ומיזוג בין מכשירים מקבע אותו.
 *  ⚠️ **והקלט הוא הסדר הסופי שב-DOM** — ⛔ ולא צמד «מאיפה לאן»:
 *  ⭐ גרירה אחת עוברת על פני כמה שורות, ⛔ וצמד מתאר את צעדה האחרון בלבד.
 *  ⛔ **וסדר שאינו מכיל בדיוק את כל השורות נדחה** — ⚠️ מזהה שנשמט היה
 *  מוחק את סדרה של שורה שלמה. */
function lookupReorder(kind, ids) {
  var rows = lookupRows(kind), by = {}, out = [], i, changed = false;
  for (i = 0; i < rows.length; i++) by[String(rows[i].client_id)] = rows[i];
  for (i = 0; i < ids.length; i++) if (by[String(ids[i])]) out.push(by[String(ids[i])]);
  if (out.length !== rows.length) return false;
  for (i = 0; i < out.length; i++) if (+out[i].sort !== i + 1) changed = true;
  if (!changed) return false;
  for (i = 0; i < out.length; i++) {
    out[i].sort = i + 1;
    out[i].updated_at = Date.now();
    localPut('k_lookups', out[i]);
  }
  pushSoon();
  /*  ⛔ שינוי ברשימות מקדם את עידן הרשימות — ⚠️ הכתיבה עוברת בנקודת
   *  המעבר האחת לענן, ⭐ והיא מקדמת את אות הפולינג: ⛔ בלעדיה מכשיר אחר
   *  אינו לומד שהסדר השתנה עד המשיכה הבאה במקרה. */
  cfgWrite(CFG_LOOKUPS_EPOCH, Date.now());
  return true;
}

/*  ⛔ ההשלמה נגזרת מהפירוטים שכבר נרשמו — ⚠️ distinct לפי תדירות:
 *  ⭐ מה שנרשם הרבה עולה ראשון, ⛔ ואין רשימה שנייה לתחזק. */
function descSuggest(q, type) {
  var seen = {}, l = kLive(MIRROR.k_entries), i, d;
  for (i = 0; i < l.length; i++) {
    /*  ⛔ פירוטי ההכנסה אינם עולים בצדקה ולהפך — ⚠️ הם שני אוצרות
     *  מילים: ⭐ ורשימה מעורבת מציעה את מה שאינו שייך. */
    if (type && l[i].type !== type) continue;
    d = (l[i].description || '').trim();
    if (!d) continue;
    seen[d] = (seen[d] || 0) + 1;
  }
  return Object.keys(seen)
    .filter(function (d) { return !q || d.indexOf(q) === 0; })
    .sort(function (a, b) { return seen[b] - seen[a] || a.localeCompare(b); })
    .slice(0, 5);
}

function flowSteps() { return view.flow === 'income' ? FLOW_INC : FLOW_TZ; }

/*  ⛔ ארבעת השלבים המשותפים נושאים שם אחד בשני המסלולים — ⚠️ סכום ·
 *  פירוט · אופן · תאריך: ⭐ שני שמות לאותו שלב הם שני מסכים בעיני
 *  הקורא, ⛔ והקטגוריה היא השלב החמישי שקיים בצדקה בלבד. */
var STEP_META = {
  amount:   { lab: 'סכום',    ic: 'amount' },
  desc:     { lab: 'פירוט',   ic: 'desc' },
  source:   { lab: 'אופן',    ic: 'method' },
  method:   { lab: 'אופן',    ic: 'method' },
  category: { lab: 'קטגוריה', ic: 'category' },
  date:     { lab: 'תאריך',   ic: 'date' }
};

/*  ⛔ הזרימה חיה בדיאלוג ⛔ ואינה מסך — ⚠️ הדיאלוג מתחלף במקומו בכל שלב,
 *  ⭐ ומסך הבית נשאר ברקע: ⛔ מסך מלא לכל שלב מוחק את ההקשר שממנו הגיעו.
 *  ⚠️ **ומסך גרירת המטבע נשאר מסך מלא** — ⭐ הוא האישור עצמו ⛔ ולא שדה. */
function flowBodyHTML() {
  var steps = flowSteps(), key = steps[view.step], d = view.draft;
  var meta = STEP_META[key] || STEP_META.amount;
  var h = '<div class="ksave">' +
    '<div class="fhd"><span class="fic">' + iconFor(meta.ic) + '</span>' +
    '<h2>' + esc(meta.lab) + '</h2></div>';

  if (key === 'amount') {
    h += '<div class="fld"><label for="f-amount">סכום</label>' +
      '<input id="f-amount" type="text" inputmode="decimal" autocomplete="off" ' +
      'value="' + esc(d.amount === null ? '' : String(d.amount)) + '"></div>';
  } else if (key === 'desc') {
    h += '<div class="fld"><label for="f-desc">פירוט</label>' +
      '<input id="f-desc" type="text" autocomplete="off" value="' + esc(d.description) + '">' +
      '<div class="acbox" id="f-ac">' +
      descSuggest('', view.flow === 'income' ? 'income' : 'tzedakah').map(function (s) {
        return '<button type="button" data-act="flow-ac" data-v="' + esc(s) + '">' +
               esc(s) + '</button>';
      }).join('') + '</div></div>';
  } else if (key === 'source' || key === 'method') {
    var list = key === 'source' ? lookupList('source', SRC_DEFAULT)
                                : lookupList('method', METHOD_DEFAULT);
    h += '<div class="opts">' +
      list.map(function (x) {
        return '<button type="button" class="opt' + (d.method === x ? ' on' : '') +
               '" data-act="flow-pick" data-k="method" data-v="' + esc(x) + '">' +
               esc(x) + '</button>';
      }).join('') + '</div>';
  } else if (key === 'category') {
    h += '<div class="opts">' + CAT_LIST.map(function (x) {
      return '<button type="button" class="opt' + (d.category === x ? ' on' : '') +
             '" data-act="flow-pick" data-k="category" data-v="' + esc(x) + '">' +
             esc(x) + '</button>';
    }).join('') + '</div>';
  } else if (key === 'date') {
    h += '<div class="fld"><label for="f-date">תאריך</label>' +
      '<input id="f-date" type="date" value="' + esc(d.entry_date) + '">' +
      '<div class="sml" id="f-hdate">' + esc(hebLabel(d.entry_date)) + '</div></div>';
  }
  /*  ⛔ שני הכפתורים יושבים **בתוך** היקף ה-`ksave` ⛔ ולא בתחתית המיכל —
   *  ⚠️ `ksKey` מטפס מהשדה אל ההיקף ומחפש בתוכו: ⭐ כפתור שמחוצה לו
   *  נראה זהה ⛔ ואינו עונה למקש. */
  return h + '<div class="frow">' +
    '<button class="btn ghost" data-act="flow-back" data-kesc>' + esc(MSG_BACK) + '</button>' +
    '<button class="btn" data-act="flow-next" data-ksave>' +
    esc(view.step === flowSteps().length - 1 ? 'אישור' : 'המשך') + '</button></div></div>';
}

/*  ⛔ הדיאלוג נפתח באותו מיכל בכל שלב — ⚠️ `openModal` מחליף את תוכנו
 *  ⛔ ואינו סוגר אותו: ⭐ וזו ההתחלפות במקום שהמשתמש רואה.
 *  ⚠️ **והמיקוד נכנס לשדה הראשון** — ⭐ שדה שנבנה מחדש מאבד אותו. */
function flowOpen() {
  openModal('', flowBodyHTML(), '');
  var el = kQ('#modal-body input');
  if (el) el.focus();
}

/*  ⛔ הרשומה נושאת תאריך כמחרוזת ISO — ⚠️ וצרכן התצוגה מקבל `Date`:
 *  ⭐ ההמרה יושבת כאן פעם אחת, ⛔ והתווית עצמה נגזרת מהמנוע המשותף.
 *  ⛔ והעוגן בצהריים מקומיים — ⚠️ חצות נופל ליום הקודם במעבר לשעון חורף. */
function hebLabel(iso) {
  if (!iso) return '';
  return hebrewDate(dayNoon(iso));
}
function flowStart(kind) {
  view.flow = kind;
  view.step = 0;
  view.draft = { amount: null, description: '', method: '', category: '',
                 entry_date: dayToday() };
  flowOpen();
}

function flowCollect() {
  var steps = flowSteps(), key = steps[view.step], el;
  if (key === 'amount') {
    el = kQ('#f-amount');
    /*  ⛔ הקריאה עוברת ב-`readNum` — ⚠️ המרה ישירה מחזירה `NaN` על שדה
     *  ריק, ⭐ ו-`NaN` בהשוואה נכשל בשקט. */
    view.draft.amount = el ? readNum(el, null) : null;
  } else if (key === 'desc') {
    el = kQ('#f-desc'); view.draft.description = el ? el.value.trim() : '';
  } else if (key === 'date') {
    el = kQ('#f-date'); if (el && el.value) view.draft.entry_date = el.value;
  }
}

function flowValid() {
  var key = flowSteps()[view.step], d = view.draft;
  if (key === 'amount') {
    if (d.amount === null) return MSG_NEED_AMOUNT;
    /*  ⛔ בהכנסה מותר סכום שלילי — ⚠️ הוא קיזוז: ⭐ ובצדקה הוא חייב
     *  להיות גדול מאפס. */
    if (view.flow !== 'income' && d.amount <= EPS) return MSG_NEED_AMOUNT;
    if (view.flow === 'income' && Math.abs(d.amount) <= EPS) return MSG_NEED_AMOUNT;
    return '';
  }
  if (key === 'desc') return d.description ? '' : MSG_NEED_DESC;
  if (key === 'source' || key === 'method') return d.method ? '' : MSG_FILL_ALL;
  if (key === 'category') return d.category ? '' : MSG_FILL_ALL;
  return '';
}

/* ══════════════════════════════════════════════════════════════════════════
   מסך אישור המטבע
   ══════════════════════════════════════════════════════════════════════════
   ⛔ המטבע נגרר חופשי ומשוחרר מעל היעד — ⚠️ שחרור בצד מחזיר אותו למקום:
   ⭐ האישור הוא התנועה עצמה, ⛔ ואין כפתור שני שמאשר.
   ══════════════════════════════════════════════════════════════════════════ */
var COIN = { el: null, tgt: null, dx: 0, dy: 0, over: false };

function slideScreenHTML() {
  var isInc = view.flow === 'income';
  return '<div class="slide" id="slide">' +
    '<button class="back bk" data-act="flow-back" aria-label="חזרה">›</button>' +
    '<div class="ttl">' + esc(isInc ? MSG_SLIDE_WALLET : MSG_SLIDE_KUPA) + '</div>' +
    '<div class="sub">' + esc(MSG_SLIDE_SUB) + '</div>' +
    '<div class="target ' + (isInc ? 'wide' : 'narrow') + '" id="slide-target">' +
    assetIcon(isInc ? 'asset-wallet' : 'asset-kupa') + '</div>' +
    '<div class="coin" id="coin"><span class="ring"></span>' +
    money(Math.abs(view.draft.amount)) + '</div></div>';
}

/*  ⛔ המטבע מתחיל **מעל** היעד — ⚠️ הקופה והארנק יושבים מתחתיו:
 *  ⭐ המטבע נופל לתוכם, ⛔ והחלקה כלפי מעלה אינה תנועה שמישהו מצפה לה. */
function coinHome() {
  var b = COIN.tgt.getBoundingClientRect();
  return { x: window.innerWidth / 2 - 75, y: Math.max(0, b.top - 190) };
}
/*  ⛔ נקודת הכתיבה האחת של המיקום — ⚠️ משתני CSS, ⭐ והכלל של `.coin` קורא אותם. */
function coinAt(p) {
  COIN.el.style.setProperty('--x', p.x + 'px');
  COIN.el.style.setProperty('--y', p.y + 'px');
}
function coinWire() {
  var c = document.getElementById('coin'), t = document.getElementById('slide-target');
  if (!c || !t) { uiNoDialog('coinWire', 'coin'); return; }
  COIN.el = c; COIN.tgt = t;
  coinAt(coinHome());
  c.addEventListener('pointerdown', coinDown);
}
function coinDown(e) {
  var c = COIN.el, r = c.getBoundingClientRect();
  c.classList.remove('settle');
  COIN.dx = e.clientX - r.left; COIN.dy = e.clientY - r.top;
  c.setPointerCapture(e.pointerId);
  c.addEventListener('pointermove', coinMove);
  c.addEventListener('pointerup', coinUp);
}
function coinMove(e) {
  var c = COIN.el;
  coinAt({ x: e.clientX - COIN.dx, y: e.clientY - COIN.dy });
  var over = coinOverTarget();
  if (over !== COIN.over) { COIN.over = over; c.classList.toggle('over', over); }
}
function coinOverTarget() {
  var a = COIN.el.getBoundingClientRect(), b = COIN.tgt.getBoundingClientRect();
  var cx = a.left + a.width / 2, cy = a.top + a.height / 2;
  return cx > b.left && cx < b.right && cy > b.top - 40 && cy < b.bottom;
}
function coinUp(e) {
  var c = COIN.el;
  c.removeEventListener('pointermove', coinMove);
  c.removeEventListener('pointerup', coinUp);
  if (!coinOverTarget()) { coinReturn(); return; }
  coinSwallow();
}
function coinReturn() {
  var c = COIN.el, p = coinHome();
  c.classList.remove('over');
  c.classList.add('settle');
  coinAt(p);
}

/*  ⛔ הרגישות עוברת כאן בלבד — ⚠️ הצליל נוצר ב-`AudioContext`:
 *  ⭐ אין קובץ שמע, ⛔ ואין טעינה מהרשת.
 *  ⛔ **והצליל הוא שקשוק מטבעות** — ⚠️ שלושה נקישים קצרים בגבהים
 *  נבדלים, ⭐ כל אחד שני חלקיים לא-הרמוניים: ⛔ סינוס יחיד ארוך נשמע
 *  כצפצוף מכשיר ⛔ ולא כמתכת שנופלת. */
var COIN_TAPS = [[1850, 0], [2480, 0.07], [2130, 0.15]];
function sensoryFire() {
  if (!APP_SENSORY.on) return;
  try { if (navigator.vibrate) navigator.vibrate([18, 26, 14, 30, 22]); } catch (e) {}
  try {
    var A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    var ctx = new A(), i, j;
    for (i = 0; i < COIN_TAPS.length; i++) {
      /*  ⛔ שני חלקיים ביחס שאינו שלם — ⚠️ זה מה שנותן למתכת את צלילה:
       *  ⭐ יחס שלם נשמע כתו מוזיקלי, ⛔ ולא כנקישה. */
      for (j = 0; j < 2; j++) {
        var t0 = ctx.currentTime + COIN_TAPS[i][1];
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.value = COIN_TAPS[i][0] * (j ? 2.41 : 1);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(j ? 0.06 : 0.14, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.19);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + 0.2);
      }
    }
  } catch (e) { console.warn('[snd] הצליל לא נוצר', e); }
}

/*  ⛔ הפטל אינו כאן — ⚠️ **מה נכנס**: אסימון צבע שהפתית נושאת;
 *  ⛔ **ומה מפיל**: `--rasp` או `--rasp-ink` — ⭐ הם הסימן של שני המקומות,
 *  ⛔ וצבע שמופיע בכל מקום מפסיק להיות סימן. */
var CONF_COLORS = ['--purple-3', '--peach-2', '--purple-6', '--bg', '--purple-5'];
function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var box = document.createElement('div');
  box.className = 'conf';
  /*  ⛔ מיקום שנדגם באקראי נכתב למשתני CSS ⛔ ולא לתגית — ⚠️ הפתית נבנה
   *  כאלמנט, ⭐ ושלושת הערכים נקבעים עליו: ⛔ סגנון מוטבע כאן היה
   *  תשעים אתרים שאין להם שני מופעים זהים. */
  var i, e;
  for (i = 0; i < 120; i++) {
    e = document.createElement('i');
    /*  ⛔ הפתיתים נדגמים על כל המסך — ⚠️ ומרכזם מסביב לאמצעו: ⭐ שורש
     *  של אקראי מרכך את הקצוות, ⛔ ופיזור אחיד נראה כרעש. */
    e.style.setProperty('--cf-x', Math.round(50 + (Math.random() - 0.5) * 96) + '%');
    e.style.setProperty('--cf-y', Math.round(50 + (Math.random() - 0.5) * 92) + '%');
    e.style.setProperty('--cf-c', 'var(' + CONF_COLORS[i % CONF_COLORS.length] + ')');
    box.appendChild(e);
  }
  document.body.appendChild(box);
  setTimeout(function () { box.remove(); }, 1600);
}

function coinSwallow() {
  var c = COIN.el, b = COIN.tgt.getBoundingClientRect();
  c.classList.add('settle');
  coinAt({ x: b.left + b.width / 2 - 75, y: b.top });
  setTimeout(function () {
    c.classList.remove('settle', 'over');
    c.classList.add('swallow');
  }, 280);
  setTimeout(function () { sensoryFire(); confetti(); flowCommit(); }, 600);
}

/* ══════════════════════════════════════════════════════════════════════════
   הכתיבה — מקומית-תחילה, והדחיפה היא רענון
   ══════════════════════════════════════════════════════════════════════════ */
function localPut(table, row) {
  var l = MIRROR[table], i;
  for (i = 0; i < l.length; i++) if (idEq(l[i].client_id, row.client_id)) { l[i] = row; break; }
  if (i === l.length) l.push(row);
  mirrorSave(table);
  /*  ⛔ המטפל מקבל מפתח אחד — ⚠️ קריאה בשני ארגומנטים מסמנת את שם
   *  הטבלה ⛔ ולא את השורה: ⭐ והקורא מחפש `<טבלה>:<מפתח>`. */
  pendMark(kPendKey(table, row));
}

function flowCommit() {
  var d = view.draft, isInc = view.flow === 'income';
  var row = {
    client_id: newClientId(),
    type: isInc ? 'income' : 'tzedakah',
    amount: d.amount,
    description: d.description,
    entry_date: d.entry_date,
    method: d.method,
    category: isInc ? '' : d.category,
    source: 'manual',
    verified: false,
    so_instance_client_id: null,
    updated_at: Date.now(),
    deleted: false
  };
  localPut('k_entries', row);
  view.monthKey = monthKeyOf(row.entry_date);
  pushSoon();
  view.screen = 'done';
  view.doneInc = isInc;
  kRender();
}

/*  ⛔ הכיתוב יושב בתחתית המסך והקונפטי בחציו העליון — ⚠️ הם אינם
 *  מרוחים זה על זה: ⭐ פתית שנופל על אות מסתיר אותה בדיוק ברגע שבו
 *  היא נקראת. */
function doneScreenHTML() {
  var c = chainOf(view.monthKey, true) || {};
  var isInc = view.doneInc;
  return '<div class="donewrap"><div class="done">' +
    '<div class="line1">' + esc(isInc ? MSG_OPENER : MSG_TZ_BLESS) + '</div>' +
    '<div class="line2">' + esc('נרשם · ' + (isInc ? MSG_SUM_INCOME + ' ' : MSG_LEFT_SUM)) +
    (isInc ? esc(money(c.income || 0)) : signed(c.pledgeLeft || 0)) + '</div>' +
    '<button class="btn done-back" data-act="done-close">חזרה</button></div></div>' +
    footHTML('');
}

/* ══════════════════════════════════════════════════════════════════════════
   עריכה ומחיקה רכה
   ══════════════════════════════════════════════════════════════════════════
   ⛔ המחיקה רכה — ⚠️ ואחריה «בטל» לחמש שניות: ⭐ החלון הוא מה שמפריד בין
   טעות לפעולה, ⛔ ומחיקה פיזית אינה קיימת בשום מסלול.
   ══════════════════════════════════════════════════════════════════════════ */
var UNDO = { row: null, timer: null };

function entryById(id) {
  var l = kLive(MIRROR.k_entries), i;
  for (i = 0; i < l.length; i++) if (idEq(l[i].client_id, id)) return l[i];
  return null;
}

/*  ⛔ מפת האב-ובן — ⚠️ **מה נכנס**: טבלת האב ⟵ כל בן שתלוי בשורה שלה
 *  ובשם העמודה שקושרת ביניהם; ⛔ **ומה מפיל**: זוג שחי בסכימה ואינו כאן —
 *  ⚠️ הוא נשאר יתום אחרי מחיקת האב. ⭐ **ולמה המבנה קיים**: המחיקה עוברת
 *  בנקודה אחת, ⛔ והיא צריכה לדעת את מי לגרור.
 *  ⛔ **ואין כאן בן לשני אבות** — ⚠️ התקופה נגזרת ואינה טבלה, ⭐ ולכן
 *  לכל בן אב אחד: ⛔ ואין סדר הכרעה שצריך להצהיר. */
var K_CHILDREN = {
  k_standing_orders: [{ table: 'k_so_instances', fk: 'standing_order_client_id' }],
  k_so_instances:    [{ table: 'k_entries',      fk: 'so_instance_client_id' }]
};

/*  ⛔ הבן יורש את מחיקת האב ואת חותמתה — ⚠️ דגל המחיקה, חותמת המחיקה
 *  וחותמת העריכה נלקחים מרשומת האב: ⭐ מחיקת אב ובניו היא אירוע אחד,
 *  ⛔ ושתי חותמות לאותה מחיקה הן שתי הכרעות במנוע המיזוג. */
function kChildKill(parent, kid) {
  kid.deleted = !!parent.deleted;
  kid.deleted_at = parent.deleted_at;
  kid.deleted_by = parent.deleted_by;
  kid.updated_at = parent.updated_at;
  return kid;
}

/*  ⛔ כל מחיקה רכה עוברת כאן — ⚠️ הרשומה מסומנת, ⭐ וכל בן שתלוי בה יורש
 *  את אותה חותמת בדיוק: ⛔ מחיקה שנכתבת באתר הקריאה משאירה בן יתום,
 *  ⚠️ והוא נספר בסיכום של חודש שכבר אינו קיים. */
function kKill(table, row) {
  row.deleted = true;
  row.deleted_at = new Date().toISOString();
  row.deleted_by = devId();
  row.updated_at = Date.now();
  localPut(table, row);
  var kids = K_CHILDREN[table] || [], i, j, list, kid;
  for (i = 0; i < kids.length; i++) {
    list = kLive(MIRROR[kids[i].table] || []);
    for (j = 0; j < list.length; j++) {
      kid = list[j];
      if (!idEq(kid[kids[i].fk], row.client_id)) continue;
      localPut(kids[i].table, kChildKill(row, kid));
    }
  }
  return row;
}

function entryDelete(id) {
  var r = entryById(id);
  closeModal();
  if (!r) { uiNoDialog('entryDelete', id); return Promise.resolve(); }
  return ask(MSG_DELETE, MSG_DEL_PRE + r.description + ' ' + money(r.amount) + MSG_DEL_POST,
             MSG_DELETE).then(function (yes) {
    if (!yes) return;
    var copy = JSON.parse(JSON.stringify(r));
    kKill('k_entries', r);
    UNDO.row = copy;
    if (UNDO.timer) clearTimeout(UNDO.timer);
    UNDO.timer = setTimeout(function () { UNDO.row = null; pushSoon(); }, 5000);
    kRender();
    toast(MSG_DELETED + ' · ' + MSG_UNDO, 5000, 'good');
  });
}

function entryUndo() {
  if (!UNDO.row) return;
  var r = UNDO.row;
  r.deleted = false; r.deleted_at = null; r.deleted_by = null; r.updated_at = Date.now();
  localPut('k_entries', r);
  UNDO.row = null;
  if (UNDO.timer) clearTimeout(UNDO.timer);
  pushSoon();
  kRender();
}

/* ══════════════════════════════════════════════════════════════════════════
   הוראות קבע — עריכה פותחת גרסה
   ══════════════════════════════════════════════════════════════════════════
   ⛔ עריכת מופע היא עריכת ההוראה **מהחודש והלאה** — ⚠️ הישנה מקבלת
   «תוקף עד» החודש הקודם, ⭐ והחדשה מתחילה כאן: ⛔ מופעים קודמים אינם
   משתנים, שהם כבר נספרו.
   ══════════════════════════════════════════════════════════════════════════ */
function orderNewVersion(o, patch, fromMonth) {
  var m = monthByKey(fromMonth) || monthByKey(view.monthKey);
  if (!m) { uiNoDialog('orderNewVersion', fromMonth); return null; }
  var key = m.key;
  var prev = prevMonthOf(m.key);
  var old = kLive(MIRROR.k_standing_orders).filter(function (x) {
    return idEq(x.client_id, o.client_id);
  })[0];
  if (old) {
    old.valid_to_month = prev ? prev.key : key;
    old.active = false;
    old.updated_at = Date.now();
    localPut('k_standing_orders', old);
  }
  var next = {
    client_id: newClientId(), name: patch.name != null ? patch.name : o.name,
    amount: patch.amount != null ? patch.amount : o.amount,
    day_of_month: patch.day_of_month != null ? patch.day_of_month : o.day_of_month,
    method: patch.method != null ? patch.method : o.method,
    category: o.category, active: true,
    valid_from_month: key, valid_to_month: null,
    supersedes_id: o.client_id, updated_at: Date.now(), deleted: false
  };
  localPut('k_standing_orders', next);
  return next;
}

/*  ⛔ ארבעת השדות של הוראת קבע — ⚠️ סכום · פירוט · אופן · יום בחודש:
 *  ⭐ אותם ארבעה בהוספה ובעריכה, ⛔ ושני טפסים לאותה ישות הם שני
 *  מקומות לתקן, ⚠️ ואחד מהם יישכח.
 *  ⛔ **והתווית אומרת מה השדה מקבל** — ⚠️ הערך הוא `day_of_month`, מספר
 *  בין 1 ל-30: ⭐ «תאריך» תיאר תאריך מלא, ⛔ והכרטיס כבר אמר «יום N». */
/*  ⛔ חודשי הבחירה נגזרים מהשרשרת ומהחודש הנוכחי קדימה — ⚠️ ואין רשימת
 *  חודשים מוקלדת: ⭐ היא הייתה נגמרת, ⛔ ומאותו יום לא היה מה לבחור.
 *  ⚠️ **והטווח קדימה הוא שנה** — ⭐ הוראה נכנסת מהחודש שנבחר ואילך,
 *  ⛔ ומי שמתכנן רחוק מזה יזין אותה כשתגיע. */
var ORDER_AHEAD = 13;
function monthOptions(extra) {
  var seen = {}, out = [], ms = monthsSorted(true), i, k = nowMonthKey();
  for (i = 0; i < ms.length; i++) seen[ms[i].key] = true;
  for (i = 0; i < ORDER_AHEAD && k; i++) { seen[k] = true; var n = nextMonthOf(k); k = n ? n.key : ''; }
  if (extra) seen[extra] = true;
  for (i in seen) if (Object.prototype.hasOwnProperty.call(seen, i)) out.push(i);
  return out.sort();
}
function orderFormHTML(o) {
  var list = ORDER_METHODS;
  var from = (o && o.valid_from_month) || nowMonthKey();
  return '<div class="ksave">' +
    '<div class="fld"><label for="o-amt">סכום</label>' +
    '<input id="o-amt" type="text" inputmode="decimal" autocomplete="off" value="' +
    esc(o ? o.amount : '') + '"></div>' +
    '<div class="fld"><label for="o-name">פירוט</label>' +
    '<input id="o-name" type="text" autocomplete="off" value="' +
    esc(o ? o.name : '') + '"></div>' +
    '<div class="fld"><label for="o-method">אופן</label><select id="o-method">' +
    list.map(function (x) {
      return '<option value="' + esc(x) + '"' +
             (o && o.method === x ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('') + '</select></div>' +
    '<div class="fld"><label for="o-day">יום בחודש</label>' +
    '<input id="o-day" type="text" inputmode="numeric" autocomplete="off" value="' +
    esc(o ? o.day_of_month : '') + '"></div>' +
    /*  ⛔ ההוראה נכנסת מהחודש שנבחר ואילך ⛔ ולא רטרואקטיבית — ⚠️ מופעים
     *  של חודשים שקדמו לו כבר נספרו, ⭐ ושינוי בדיעבד היה מזיז «סכום
     *  שנשאר» של חודש סגור. */
    '<div class="fld"><label for="o-from">' + esc(MSG_ORDER_FROM) + '</label>' +
    '<select id="o-from">' + monthOptions(o && o.valid_from_month).map(function (k) {
      return '<option value="' + esc(k) + '"' + (k === from ? ' selected' : '') + '>' +
             esc(monthTitle(monthByKey(k))) + '</option>';
    }).join('') + '</select></div></div>';
}

/*  ⛔ הקריאה עוברת כאן פעם אחת — ⚠️ והיא מחזירה `null` כששדה אינו
 *  ב-DOM: ⭐ שומר שקורא ערך משדה שאינו קיים זורק, ⛔ והמסלול נגמר
 *  בלי שהמשתמש יודע למה. */
function orderRead() {
  var a = kQ('#o-amt'), nm = kQ('#o-name'), me = kQ('#o-method'), dy = kQ('#o-day');
  var fr = kQ('#o-from');
  if (!a || !nm || !me || !dy || !fr) { uiNoDialog('orderRead', 'o-amt'); return null; }
  return { amount: readNum(a, null), name: nm.value.trim(),
           method: me.value, day_of_month: readNum(dy, null),
           valid_from_month: fr.value };
}
function orderValid(p) {
  if (!p) return MSG_FILL_ALL;
  if (p.amount === null || p.amount <= EPS) return MSG_NEED_AMOUNT;
  if (!p.name) return MSG_NEED_DESC;
  if (p.day_of_month === null || p.day_of_month < 1 || p.day_of_month > 30) return MSG_NEED_DAY;
  if (!p.valid_from_month) return MSG_FILL_ALL;
  return '';
}

/* ══════════════════════════════════════════════════════════════════════════
   ההגדרות
   ══════════════════════════════════════════════════════════════════════════ */
/*  ⛔ השנים נגזרות מהחודשים שבשרשרת ומהשורות שכבר יש — ⚠️ ואין רשימת
 *  שנים מוקלדת: ⭐ הקודמת הייתה נגמרת, ⛔ ומאותו יום לא היה מה לבחור. */
function lookupById(id) {
  var l = kLive(MIRROR.k_lookups), i;
  for (i = 0; i < l.length; i++) if (idEq(l[i].client_id, id)) return l[i];
  return null;
}
/*  ⛔ שדה אחד בהוספה ובעריכה — ⚠️ שני טפסים לאותה ישות הם שני מקומות
 *  לתקן, ⭐ ואחד מהם יישכח. */
function lookupFormHTML(r) {
  return '<div class="ksave"><div class="fld"><label for="l-label">' +
    esc(MSG_WAY_LABEL) + '</label>' +
    '<input id="l-label" type="text" autocomplete="off" value="' +
    esc(r ? r.label : '') + '"></div></div>';
}
/*  ⛔ כפתור השמירה נבנה כאן פעם אחת — ⚠️ ההוספה והעריכה חולקות אותו:
 *  ⭐ שני ליטרלים לאותה פעולה הם שני מקומות שבהם `data-ksave` יכול
 *  להישמט, ⛔ ואז המקש אינו שומר במסך אחד מהשניים. */
function lookupFootHTML(r, kind) {
  return '<button class="btn" data-act="look-save" data-id="' + esc(r ? r.client_id : '') +
    '" data-k="' + esc(kind) + '" data-ksave>שמור</button>';
}

function pledgeYears() {
  var seen = {}, out = [], ms = monthsSorted(true), l = kLive(MIRROR.k_pledges), i;
  for (i = 0; i < ms.length; i++) seen[ms[i].year] = true;
  for (i = 0; i < l.length; i++) seen[String(l[i].hebrew_year)] = true;
  for (i in seen) if (Object.prototype.hasOwnProperty.call(seen, i)) out.push(i);
  return out.sort().reverse();
}
/*  ⛔ יעד הפלעדזש הוא סכום אחד לכל חודש בשנה — ⚠️ ולכל שנה בנפרד:
 *  ⭐ ושנה שאין לה שורה היא אפס, ⛔ ולא כשל. */
function pledgeCardHTML() {
  var ys = pledgeYears();
  if (!ys.length) return '';
  return '<div class="card"><h2>יעד פלעדזש שנתי</h2><ul class="det">' +
    ys.map(function (y) {
      return '<li data-act="pledge-edit" data-id="' + esc(y) + '">' +
             '<span class="ico">' + iconFor('amount') + '</span>' +
             '<span class="nm">' + esc(window.hebYearLabelFull(y)) + '</span>' +
             '<span class="amt">' + money(pledgeOfYear(y)) + '</span></li>';
    }).join('') + '</ul></div>';
}

function settingsScreenHTML() {
  return brandHTML() + tabHeadHTML(MSG_SETTINGS_TITLE) +
    pledgeCardHTML() +
    ordersCardHTML() +
    /*  ⛔ שני אוצרות מילים נפרדים לאותו שלב — ⚠️ «אופן» בשני המסלולים,
     *  ⭐ והמפתח שמאחוריו נבדל: ⛔ ואין לאחד אותם לרשימה אחת —
     *  ⚠️ רשימה מעורבת מציעה בהכנסה את מה ששייך לצדקה. */
    lookupCardHTML('method', MSG_WAY_INCOME, METHOD_DEFAULT) +
    lookupCardHTML('source', MSG_WAY_TZEDAKAH, SRC_DEFAULT) +
    footHTML();
}

/* ══════════════════════════════════════════════════════════════════════════
   הרינדור האחד
   ══════════════════════════════════════════════════════════════════════════ */
function kRender() {
  var root = kQ('#app');
  if (!root) { uiNoDialog('kRender', 'app'); return; }
  var fab = kQ('#fab'), tb = kQ('#tabbar');
  if (view.screen === 'month') root.innerHTML = monthScreenHTML();
  else if (view.screen === 'slide') root.innerHTML = slideScreenHTML();
  else if (view.screen === 'done') root.innerHTML = doneScreenHTML();
  else if (view.screen === 'archive') root.innerHTML = archiveScreenHTML();
  else if (view.screen === 'settings') root.innerHTML = settingsScreenHTML();
  var onMonth = view.screen === 'month';
  /*  ⛔ הסרגל עולה בשלוש הלשוניות ⛔ ואינו עולה בזרימה — ⚠️ מסך שהוא
   *  שדה אחד אינו מקום לנווט ממנו, ⭐ והניווט באמצעו מאבד את הטיוטה. */
  var onTab = TABS.some(function (t) { return t.k === view.screen; });
  if (fab) fab.classList.toggle('hidden', !onMonth);
  if (tb) {
    tb.classList.toggle('hidden', !onTab);
    tb.innerHTML = tabbarHTML();
  }
  if (view.screen === 'slide') coinWire();
}

/* ══════════════════════════════════════════════════════════════════════════
   מפת הפעולות — הניתוב האחד
   ══════════════════════════════════════════════════════════════════════════
   ⛔ כל כפתור נושא `data-act`, ⚠️ והמטפל נמצא כאן: ⭐ מטפל שממתין
   לכתיבה מחזיר את ההבטחה, ⛔ והניתוב מנטרל את הכפתור עד שהסתיימה.
   ══════════════════════════════════════════════════════════════════════════ */
var DOM_ACTIONS = {
  /*  ⛔ הבחירה בין שני הרישומים היא דיאלוג עם שני כפתורים מתויגים —
   *  ⚠️ ולא «כן/לא»: ⭐ `ask` נותן «ביטול» לצד השני, ⛔ ומי שלוחץ אינו
   *  יודע שהוא בחר הכנסה. */
  /*  ⛔ הבחירה בין שני הרישומים היא שני כפתורים מתויגים ⛔ ובלי כותרת —
   *  ⚠️ האייקון אומר מה נבחר: ⭐ ארנק להכנסה וקופה לצדקה, ⛔ בדיוק אותם
   *  ציורים שהפירוט ומסך האישור מציגים. */
  'add-open': function () {
    openModal('', '<div class="pick">' +
      '<button class="pk" data-act="add-income">' +
      '<span class="pi">' + assetIcon('asset-wallet') + '</span>' +
      esc(MSG_ADD_INCOME) + '</button>' +
      '<button class="pk" data-act="add-tzedakah">' +
      '<span class="pi">' + assetIcon('asset-kupa') + '</span>' +
      esc(MSG_ADD_TZEDAKAH) + '</button></div>', '');
  },
  /*  ⛔ הדיאלוג אינו נסגר בין הבחירה לשלב הראשון — ⚠️ הוא מתחלף במקומו:
   *  ⭐ ומסך הבית נשאר ברקע, ⛔ כמו בדיאלוג הראשון. */
  'add-income':   function () { flowStart('income'); },
  'add-tzedakah': function () { flowStart('tzedakah'); },
  'month-prev': function () {
    var p = prevMonthOf(view.monthKey);
    if (p) { view.monthKey = p.key; view.screen = 'month'; kRender(); }
  },
  'month-next': function () {
    var nx = nextMonthOf(view.monthKey);
    if (nx) { view.monthKey = nx.key; view.screen = 'month'; kRender(); }
  },
  /*  ⛔ «בית» חוזר לחודש של היום — ⚠️ חודש שנפתח מהארכיון אינו הבית,
   *  ⭐ ומי שחוזר אליו נשאר בחודש ישן: ⛔ ושאר הלשוניות אינן נוגעות בו,
   *  ⚠️ שאין להן חודש. */
  'tab-go': function (el) {
    view.screen = el.dataset.id;
    if (view.screen === 'month') view.monthKey = nowMonthKey() || null;
    kRender();
  },
  'arch-month': function (el) {
    var m = monthByKey(el.dataset.id);
    if (m) { view.monthKey = m.key; view.screen = 'month'; kRender(); }
  },
  'flow-next': function () {
    flowCollect();
    var bad = flowValid();
    if (bad) { toast(bad, 4000, 'bad'); return; }
    if (view.step === flowSteps().length - 1) {
      closeModal();
      view.screen = 'slide';
      kRender();
      return;
    }
    view.step++;
    flowOpen();
  },
  /*  ⛔ החזרה מהשלב הראשון פותחת את בורר הסוג — ⚠️ ולא סוגרת הכול:
   *  ⭐ הדיאלוג מתחלף בשני הכיוונים. */
  'flow-back': function () {
    if (view.screen === 'slide') { view.screen = 'month'; kRender(); flowOpen(); return; }
    if (view.step === 0) { view.flow = null; DOM_ACTIONS['add-open'](); return; }
    view.step--;
    flowOpen();
  },
  'flow-pick': function (el) { view.draft[el.dataset.k] = el.dataset.v; flowOpen(); },
  'flow-ac': function (el) {
    var f = kQ('#f-desc');
    if (!f) { uiNoDialog('flow-ac', 'f-desc'); return; }
    f.value = el.dataset.v;
  },
  /*  ⛔ שני מטפלי ההתראה של הבלוקים המשותפים — ⚠️ הכפתורים נבנים בתוך
   *  המודול המשותף, ⭐ והניתוב אליהם חי במפה: ⛔ כפתור בלי מטפל הוא חצי
   *  חיווט, ⚠️ והמשתמש לוחץ ודבר אינו קורה. */
  /*  ⛔ שני מסלולי ההכרעה של דיאלוג האישור — ⚠️ הרקע ו-`Escape` עונים
   *  «לא», ⭐ והכפתורים הם המסלול שעונה «כן». */
  'ask-yes': function () { closeAsk(true); },
  'ask-no':  function () { closeAsk(false); },
  /*  ⛔ כפתור הסגירה שבכותרת המודאל — ⚠️ הרקע ו-`Escape` סוגרים אותו
   *  אף הם, ⭐ והכפתור הוא המסלול הנראה: ⛔ משטח שאין בו כפתור
   *  סגירה מונע מהמשתמש לדחות. */
  'modal-close': function () { closeModal(); },
  'ls-alert-close':      function () { var el = document.getElementById('ls-alert'); if (el) el.remove(); },
  'pend-alert-ok':       function () { pendAlertDismiss(); },
  /*  ⛔ לחיצה על תנועה פותחת עורך ⛔ ולא מחיקה — ⚠️ המחיקה היא כפתור
   *  בתוכו: ⭐ מסלול שמחיקתו היא הלחיצה היחידה מוחק על טעות. */
  'entry-menu': function (el) {
    var r = entryById(el.dataset.id);
    if (!r) { uiNoDialog('entry-menu', el.dataset.id); return; }
    openModal(MSG_EDIT + ' · ' + r.description,
      '<div class="ksave">' +
      '<div class="fld"><label for="e-amt">סכום</label>' +
      '<input id="e-amt" type="text" inputmode="decimal" autocomplete="off" value="' +
      esc(r.amount) + '"></div>' +
      '<div class="fld"><label for="e-desc">פירוט</label>' +
      '<input id="e-desc" type="text" autocomplete="off" value="' +
      esc(r.description || '') + '"></div>' +
      '<div class="fld"><label for="e-date">תאריך</label>' +
      '<input id="e-date" type="date" value="' + esc(r.entry_date || '') + '"></div></div>',
      '<button class="btn ghost" data-act="entry-del" data-id="' + esc(r.client_id) +
      '">' + esc(MSG_DELETE) + '</button>' +
      '<button class="btn" data-act="entry-save" data-id="' + esc(r.client_id) +
      '" data-ksave>שמור</button>');
  },
  'entry-save': function (el) {
    var a = kQ('#e-amt'), ds = kQ('#e-desc'), dt = kQ('#e-date');
    if (!a || !ds || !dt) { uiNoDialog('entry-save', 'e-amt'); return; }
    var r = entryById(el.dataset.id);
    if (!r) { uiNoDialog('entry-save', el.dataset.id); return; }
    var v = readNum(a, null), txt = ds.value.trim(), day = dt.value;
    if (v === null || (r.type !== 'income' && v <= EPS) || Math.abs(v) <= EPS) {
      toast(MSG_NEED_AMOUNT, 4000, 'bad'); return;
    }
    if (!txt) { toast(MSG_NEED_DESC, 4000, 'bad'); return; }
    return runSave(function () {
      r.amount = v; r.description = txt;
      if (day) r.entry_date = day;
      r.updated_at = Date.now();
      localPut('k_entries', r);
      pushSoon();
      closeModal();
      kRender();
      return Promise.resolve();
    }, MSG_SAVED_LOCAL);
  },
  'entry-del': function (el) { return entryDelete(el.dataset.id); },
  'entry-undo': function () { entryUndo(); },
  'order-add': function () {
    openModal(MSG_ORDER_NEW, orderFormHTML(null),
      '<button class="btn" data-act="order-new" data-ksave>שמור</button>');
  },
  'order-new': function () {
    var p = orderRead(), bad = orderValid(p);
    if (bad) { toast(bad, 4000, 'bad'); return; }
    return runSave(function () {
      localPut('k_standing_orders', {
        client_id: newClientId(), name: p.name, amount: p.amount,
        day_of_month: p.day_of_month, method: p.method, category: CAT_LIST[0],
        active: true, valid_from_month: view.monthKey, valid_to_month: null,
        supersedes_id: null, updated_at: Date.now(), deleted: false
      });
      pushSoon();
      closeModal();
      kRender();
      return Promise.resolve();
    }, MSG_SAVED_LOCAL);
  },
  'order-edit': function (el) {
    var o = orderById(el.dataset.id);
    if (!o) { uiNoDialog('order-edit', el.dataset.id); return; }
    openModal(MSG_EDIT + ' · ' + o.name, orderFormHTML(o),
      '<button class="btn" data-act="order-save" data-id="' + esc(o.client_id) +
      '" data-ksave>שמור</button>');
  },
  'order-save': function (el) {
    var o = orderById(el.dataset.id);
    if (!o) { uiNoDialog('order-save', el.dataset.id); return; }
    var p = orderRead(), bad = orderValid(p);
    if (bad) { toast(bad, 4000, 'bad'); return; }
    return runSave(function () {
      orderNewVersion(o, p, view.monthKey);
      pushSoon();
      closeModal();
      kRender();
      return Promise.resolve();
    }, MSG_SAVED_LOCAL);
  },
  /*  ⛔ היעד נשמר לשנה ⛔ ולא לחודש — ⚠️ מפתח המיזוג הוא `hebrew_year`:
   *  ⭐ שורה לחודש הייתה טבלת תקופות, ⛔ והיא נשברת בכל תקופה שלא הוזנה. */
  'pledge-edit': function (el) {
    var y = String(el.dataset.id || '');
    if (!y) { uiNoDialog('pledge-edit', 'year'); return; }
    openModal(MSG_PLEDGE_EDIT + window.hebYearLabelFull(y),
      '<div class="ksave"><div class="fld"><label for="p-amt">סכום</label>' +
      '<input id="p-amt" type="text" inputmode="decimal" autocomplete="off" value="' +
      esc(pledgeOfYear(y)) + '"></div></div>',
      '<button class="btn" data-act="pledge-save" data-id="' + esc(y) +
      '" data-ksave>שמור</button>');
  },
  'pledge-save': function (el) {
    var inp = kQ('#p-amt'), y = String(el.dataset.id || '');
    if (!inp) { uiNoDialog('pledge-save', 'p-amt'); return; }
    var v = readNum(inp, null);
    if (v === null || v < 0) { toast(MSG_NEED_AMOUNT, 4000, 'bad'); return; }
    return runSave(function () {
      var l = kLive(MIRROR.k_pledges), i, row = null;
      for (i = 0; i < l.length; i++) if (String(l[i].hebrew_year) === y) { row = l[i]; break; }
      if (!row) row = { client_id: newClientId(), hebrew_year: y, deleted: false };
      row.pledge = v;
      row.updated_at = Date.now();
      localPut('k_pledges', row);
      pushSoon();
      closeModal();
      kRender();
      return Promise.resolve();
    }, MSG_SAVED_LOCAL);
  },
  /*  ⛔ הפתיחה זורעת את ברירות המחדל — ⚠️ הרשימה שנראתה עד כה היא
   *  נפילה-חזרה בלי מזהים, ⭐ ועריכה וגרירה דורשות שורה. */
  /*  ⛔ השנה נפתחת ונסגרת ⛔ ואחת בכל פעם — ⚠️ שתי שנים פתוחות הן
   *  רשימה ארוכה בדיוק כמו זו שהקיבוץ בא למנוע. */
  'arch-year': function (el) {
    view.archYear = view.archYear === el.dataset.id ? null : el.dataset.id;
    kRender();
  },
  'look-toggle': function (el) {
    var k = el.dataset.id;
    view.lookOpen = view.lookOpen === k ? null : k;
    if (view.lookOpen) lookupSeed(k, k === 'source' ? SRC_DEFAULT : METHOD_DEFAULT);
    kRender();
  },
  'look-add': function (el) {
    var k = el.dataset.id;
    openModal(MSG_WAY_NEW, lookupFormHTML(null), lookupFootHTML(null, k));
  },
  'look-edit': function (el) {
    var r = lookupById(el.dataset.id);
    if (!r) { uiNoDialog('look-edit', el.dataset.id); return; }
    openModal(MSG_EDIT + ' · ' + r.label, lookupFormHTML(r), lookupFootHTML(r, r.kind));
  },
  'look-save': function (el) {
    var inp = kQ('#l-label');
    if (!inp) { uiNoDialog('look-save', 'l-label'); return; }
    var txt = inp.value.trim(), id = el.dataset.id, kind = el.dataset.k;
    if (!txt) { toast(MSG_NEED_LABEL, 4000, 'bad'); return; }
    /*  ⛔ שני מקורות באותו שם הם מקור אחד — ⚠️ הכיווץ במודול המשותף,
     *  ⭐ והזהות היא התווית: ⛔ והשורה שנערכת אינה מתנגשת בעצמה. */
    var others = lookupRows(kind).filter(function (x) { return !idEq(x.client_id, id); })
      .map(function (x) { return x.label; });
    if (uniqHas(others, txt)) { toast(MSG_WAY_DUP, 4000, 'bad'); return; }
    return runSave(function () {
      var r = id ? lookupById(id) : null;
      if (r) { r.label = txt; }
      else r = { client_id: newClientId(), kind: kind, label: txt,
                 sort: lookupRows(kind).length + 1, deleted: false };
      r.updated_at = Date.now();
      localPut('k_lookups', r);
      pushSoon();
      cfgWrite(CFG_LOOKUPS_EPOCH, Date.now());
      closeModal();
      kRender();
      return Promise.resolve();
    }, MSG_SAVED_LOCAL);
  },
  'done-close': function () { view.screen = 'month'; view.flow = null; kRender(); },
  'sw-apply': function (el) { swApply(el); },
  'sw-dismiss': function () { swHideUpdate(); }
};

/* ══════════════════════════════════════════════════════════════════════════
   המאזינים הגלובליים
   ══════════════════════════════════════════════════════════════════════════
   ⛔ מאזין אחד לכל אירוע, בהאצלה מ-`document` — ⚠️ המסכים נבנים מחדש
   בכל רינדור, ⭐ ומאזין שנקשר לאלמנט מת איתו.
   ══════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', function (e) {
  if (modalBackdrop(e)) return;
  /*  ⛔ לחיצה על ידית הגרירה אינה פותחת את העורך — ⚠️ היא סופה של
   *  גרירה, ⭐ ולא בחירה בשורה. */
  if (e.target.closest('.grip')) return;
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = DOM_ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  actRun(el, fn);
});

document.addEventListener('keydown', function (e) {
  if (ksKey(e)) return;
  modalEsc(e);
});

/*  ⛔ הגרירה על אירועי מצביע ⛔ ולא על גרירת HTML5 — ⚠️ **במגע היא אינה
 *  קיימת כלל**: ⭐ נמדד בדפדפן — `dragstart` · `dragover` ו-`drop` לא
 *  נורו אף פעם באצבע, ⛔ ורק `pointer*` הגיעו; ⚠️ ואירועי מצביע חיים
 *  בעכבר ובאצבע כאחד.
 *  ⛔ **והגרירה מתחילה מהידית בלבד** — ⚠️ שורה שכולה נגררת חוטפת את
 *  גלילת המסך, ⭐ ו-`touch-action` שמבטל אותה על כל השורה נועל את הדף.
 *  ⚠️ **והם באצלה מ-`document` כמו האחרים** — ⭐ הרשימה נבנית מחדש בכל
 *  רינדור, ⛔ ומאזין פר-שורה היה מת איתה. */
var DRAG = { el: null, list: null, kind: null, moved: false };

document.addEventListener('pointerdown', function (e) {
  var g = e.target.closest && e.target.closest('.det.drag > li .grip');
  if (!g) return;
  var li = g.closest('li');
  DRAG.el = li; DRAG.list = li.parentNode;
  DRAG.kind = DRAG.list.dataset.kind; DRAG.moved = false;
  li.classList.add('dragging');
  /*  ⛔ המצביע נלכד על הידית — ⚠️ בלעדיו אצבע שיוצאת מגבול האלמנט
   *  מפסיקה לשדר, ⭐ והגרירה נתקעת באמצע. */
  try { g.setPointerCapture(e.pointerId); } catch (e1) {}
  e.preventDefault();
});
document.addEventListener('pointermove', function (e) {
  if (!DRAG.el) return;
  e.preventDefault();
  var over = document.elementFromPoint(e.clientX, e.clientY);
  var li = over && over.closest ? over.closest('.det.drag > li') : null;
  if (!li || li === DRAG.el || li.parentNode !== DRAG.list) return;
  DRAG.moved = true;
  /*  ⛔ ההזזה בעץ בזמן הגרירה — ⚠️ היא המשוב היחיד שהמשתמש מקבל:
   *  ⭐ והחצי התחתון של שורת היעד מכניס אחריה. */
  var r = li.getBoundingClientRect();
  DRAG.list.insertBefore(DRAG.el, e.clientY > r.top + r.height / 2 ? li.nextSibling : li);
});
document.addEventListener('pointerup', function () {
  if (!DRAG.el) return;
  var el = DRAG.el, list = DRAG.list, kind = DRAG.kind, moved = DRAG.moved;
  DRAG.el = null; DRAG.list = null; DRAG.kind = null; DRAG.moved = false;
  el.classList.remove('dragging');
  if (!moved) return;
  var ids = [].slice.call(list.children).map(function (x) { return x.dataset.id; });
  if (lookupReorder(kind, ids)) kRender();
});

/* ══════════════════════════════════════════════════════════════════════════
   העלייה
   ══════════════════════════════════════════════════════════════════════════ */
function kBoot() {
  sb = sbWatch(window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY));
  lsBoot();
  _kLoadPushed();
  cfgBoot();
  mirrorBoot();
  /*  ⛔ הפתיחה בחודש של היום — ⚠️ ולא בחודש האחרון שיש לו נתונים:
   *  ⭐ חודש ריק נפתח ריק, ⛔ ואינו נופל לחודש אחר. */
  view.monthKey = nowMonthKey() || null;
  kRender();
  pendBoot();
  tombBoot();
  /*  ⛔ בדיקת העידן — ⚠️ נקודת ההפעלה היחידה, פעם אחת לעלייה: ⭐ היא
   *  דוחפת תחילה, ⛔ ואינה זורקת דבר אם אחד משלושת התנאים אינו מתקיים. */
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  bkBoot();
  hwBoot();
  rtyBoot();
  plBoot();
  swRegister();
  kSyncPull().then(function () {
    var made = soEnsureThroughNow(), i;
    for (i = 0; i < made.length; i++) localPut('k_so_instances', made[i]);
    if (made.length) pushSoon();
    kRender();
  });
}
kBoot();

})();
</script>

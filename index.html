    var chumash = kChumash(income);

    /*  ⛔ הבא בתור נושא יתרה — ⚠️ ורק מה שאחריו אינו: ⭐ הוא נגזר
     *  מסדר השרשרת ⛔ ואינו נספר מהמפתח. */

    var future = after && nextSeen;
    if (after) nextSeen = true;

    /*  ⛔ החומש — ⚠️ החובה הכוללת היא חומש החודש פחות היתרה שנשארה:

    var pledgeLeft = pledgeDue - tzedakah;

/* ── עדות סנכרון חלופית: אימות ישיר מול הענן (סבב 14) ────────────────────

      האימות רץ אחריה (`lsBootDeferred`) — וההתרעה נדחית איתו, אחרת
      המשתמש מקבל אזהרה צהובה על מצב שנפתר שתי שניות אחר כך. */

var LS_DEFER_MS = 3000;   // המתנה אחרי העלייה לפני האימות — שהאפליקציה תספיק לעלות

function lsGlobalWitness() {
  try { return Number(LS_CFG.syncedThrough && LS_CFG.syncedThrough()) || 0; } catch (e) { return 0; }
}
/* עֵד הסנכרון של מפתח בודד: משלו אם הוגדר, אחרת הגלובלי. **מפתח שהגדיר

// גריעה ממפתח אחד כשהראיה היא מפת הענן ולא חותמת מקומית.
function lsPruneKeyVerified(spec, idx, want) {

    var s = '';
    try { s = JSON.stringify(rec) || ''; } catch (e2) { s = ''; }

// כמה בתים צריך לפנות כדי לרדת אל יעד הפינוי. 0 = אין צורך.

}

/* שלב ב בגרסה האסינכרונית: לכל מפתח בלי עֵד מקומי — משיכת העותק הענני

    lsLog('אימות מול הענן דולג', 'יש נתונים שטרם סונכרנו — לא מפנים דבר', 0);
    return Promise.resolve(0);

      if (!res || res.ok !== true || !Array.isArray(res.rows)) {
        lsLog('אימות נכשל — ' + (spec.label || spec.key), 'לא מפנים דבר (נכשל סגור)', 0);

/* ═══ גיבוי יומי ויומן פעולות — מודול משותף (סבב 30) ══════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════ */
var BK_TABLE = 'sh_backup';       // יומן הגיבויים — הכתיבה היא insert בלבד
var BK_LOG_TABLE = 'sh_sync_log';    // יומן הפעולות — insert בלבד
var BK_LOG_MAX = 50;              // תקרת התור המקומי של היומן
var BK_RETENTION_DAYS = 30;       // עותק יומי נשמר 30 יום; ישן מזה נגרע
var _bkRunning = false;           // נעילת ריצה (החליפה את הכתיבה-מראש)

function _bkVal(v) { return (typeof v === 'function') ? v() : v; }
function _bkCfg(name, dflt) {
  try {
    if (typeof BK_CFG === 'undefined' || BK_CFG[name] === undefined) return dflt;
    return _bkVal(BK_CFG[name]);
  } catch (e) { return dflt; }
}
function _bkClient() { try { return BK_CFG.client(); } catch (e) { return null; } }

// רשימת הסודות (`BK_CFG.secrets`) — מפתח או שדה שברשימה אינו נכתב לגיבוי
// לעולם; המנגנון נשאר דרוך גם כשהרשימה ריקה.
function _bkSecrets() {
  var s = _bkCfg('secrets', []);
  return Array.isArray(s) ? s : [];
}

function bkToday() { return new Date().toISOString().slice(0, 10); }

// חתימת תוכן לגיבוי הדיפרנציאלי — אורך + FNV-1a. אינה סוד ואינה אימות,
// רק "האם זה אותו ערך בדיוק".
function bkSig(s) {
  var str = String(s == null ? '' : s), h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return str.length + ':' + h.toString(16);
}

/* ── יומן הפעולות ──────────────────────────────────────────────────────── */
function _bkLogRow(action, key, count, details) {
  return {
    device_id: _bkCfg('device', null),
    user_name: _bkCfg('user', null),
    action: action,
    key: key || null,
    record_count: (count === undefined || count === null) ? null : count,
    details: details || null
  };
}
/*  ⛔ כשל כתיבה נרשם ואינו נבלע (סבב 79) — ⚠️ הכתיבה נכשלת כפי שנכשלה,
 *  אבל היא מפסיקה להיות שקטה: ⭐ `catch` ריק סביב כתיבה הוא בדיוק המצב
 *  שבו נתון נעלם ואיש אינו יודע. ⛔ והרישום אינו משנה את הזרימה — ⚠️ תיעוד
 *  אבחון שמפיל שמירה גרוע מהיעדרו. */
function _bkWriteFail(where, e) {
  try { console.warn('[write-fail] ' + where, (e && e.message) ? e.message : e); } catch (e0) { }
}
function _bkLogQueue(row) {
  try {
    var qk = _bkVal(BK_CFG.logQueueKey);
    var q = JSON.parse(lsGet(qk, '[]') || '[]');
    if (!Array.isArray(q)) q = [];
    q.push(row);
    if (q.length > BK_LOG_MAX) q = q.slice(-BK_LOG_MAX);
    lsSet(qk, JSON.stringify(q));
  } catch (e) { _bkWriteFail('_bkLogQueue', e); }
}
// רישום fire-and-forget. ⛔ לעולם אינו חוסם ואינו מפיל את המסלול שקרא לו
// (נרשם בסבב 6) — תיעוד אבחון שמפיל כניסה או שמירה גרוע מהיעדרו.
function logAction(action, key, count, details) {
  var row = null;
  try {
    row = _bkLogRow(action, key, count, details);
    var c = _bkClient();
    if (!c) { _bkLogQueue(row); return; }
    c.from(BK_LOG_TABLE).insert(row).then(
      function (r) { if (r && r.error) _bkLogQueue(row); },
      function () { _bkLogQueue(row); }
    );
  } catch (e) { if (row) _bkLogQueue(row); }
}
// שליחת מה שהצטבר באופליין. נקראת כשיש ראיה שהרשת עובדת.
async function logFlush() {
  var qk, q;
  try { qk = _bkVal(BK_CFG.logQueueKey); q = JSON.parse(lsGet(qk, '[]') || '[]'); } catch (e) { return 0; }
  if (!Array.isArray(q) || !q.length) return 0;
  var c = _bkClient();
  if (!c) return 0;
  lsSet(qk, '[]');
  var failed = [], sent = 0;
  for (var i = 0; i < q.length; i++) {
    try {
      var r = await c.from(BK_LOG_TABLE).insert(q[i]);
      if (r && r.error) failed.push(q[i]); else sent++;
    } catch (e2) { failed.push(q[i]); }
  }
  if (failed.length) {
    try {
      var q2 = JSON.parse(lsGet(qk, '[]') || '[]');
      if (!Array.isArray(q2)) q2 = [];
      lsSet(qk, JSON.stringify(q2.concat(failed).slice(-BK_LOG_MAX)));
    } catch (e3) { _bkWriteFail('logFlush', e3); }
  }
  return sent;
}

/*  ⛔⛔ שלוש שכבות הגיבוי (סבב 87ג) — ⭐ **עוגן** מלא אחת לשבוע, ⚠️ **דיפ**
 *  בכל שאר הימים (רק שורות שהחותמת שלהן חדשה מהעוגן), ⛔ **והפינוי הקיים**
 *  אוכף את התקרות. ⚠️ הנימוק המדוד: גיבוי מלא בכל לילה של טבלה בת עשרות
 *  אלפי שורות הוא מגה-בייטים ביום, ⭐ ועוגן שבועי ודיפים קטנים נותנים את
 *  אותה יכולת שחזור בשבריר. */
var BK_ANCHOR_MS = 7 * 24 * 60 * 60 * 1000;
var BK_ANCHOR_PREFIX = 'ANCHOR:';
var BK_DIFF_PREFIX = 'DIFF:';
/*  ⛔ חותמת המים של העוגן — ⚠️ נשמרת כמחרוזת, ⭐ ומושווית בשרת בטיפוס
 *  העמודה: ⛔ `bigint` ו-`timestamptz` שניהם עוברים ב-`gte` כמות שהם. */
function _bkMarkKey(bkey) { return 'bk_wm_' + bkey; }
function _bkSetMark(bkey, v) {
  if (v == null) return;
  lsSet(_bkMarkKey(bkey), String(v));
  lsSet('bk_anch_' + bkey, String(Date.now()));
}
/*  ⛔ המקסימום נגזר מהשורות ⛔ ואינו נשאל מהשרת — ⚠️ מספר מושווה מספרית
 *  ומחרוזת לקסיקוגרפית: ⭐ חותמת ISO ממוינת נכון כמחרוזת, ⛔ ו-`bigint`
 *  היה נשבר בהשוואת מחרוזות. */
function _bkMaxTs(rows, col) {
  var mx = null;
  for (var i = 0; i < rows.length; i++) {
    var v = rows[i] ? rows[i][col] : null;
    if (v == null) continue;
    if (mx === null) { mx = v; continue; }
    if (typeof v === 'number' ? v > mx : String(v) > String(mx)) mx = v;
  }
  return mx;
}
/*  ⛔ איזו שכבה רצה היום — ⚠️ עוגן כשאין חותמת מים, כשאין חותמת עוגן,
 *  או כשעברו שבעה ימים; ⭐ ובכל שאר הימים דיפ מעל חותמת המים. */
function _bkLayer(bkey, s) {
  var wm = lsGet(_bkMarkKey(bkey), '');
  var at = parseInt(lsGet('bk_anch_' + bkey, '0'), 10) || 0;
  if (!s || !s.ts || !wm || !at || (Date.now() - at) >= BK_ANCHOR_MS)
    return { diff: false, prefix: BK_ANCHOR_PREFIX, key: bkey, win: null };
  return { diff: true, prefix: BK_DIFF_PREFIX, key: bkey,
           win: { col: s.ts, from: wm } };
}
/*  ⛔⛔ הקריאה בעימוד, ⛔ ואימות מול מונה השרת — ⚠️ תשובה שנחתכה נראית
 *  בדיוק כמו תשובה שלמה, ⭐ והדרך היחידה לדעת היא לשאול את השרת כמה שורות
 *  יש: ⛔ אי-התאמה מחזירה `null` ⛔ ונכשלת בקול, ⚠️ ואינה שומרת חצי גיבוי. */
async function _bkReadRows(c, s, win) {
  var sel = s.cols || '*';
  var rows = await _rowsPaged(function () {
    var q = c.from(s.name).select(sel);
    if (s.eq) q = q.eq(s.eq[0], s.eq[1]);
    return q;
  }, s.order || null, win);
  if (!rows) return null;
  try {
    var cq = c.from(s.name).select(sel, { count: 'exact', head: true });
    if (s.eq) cq = cq.eq(s.eq[0], s.eq[1]);
    if (win && win.col) {
      if (win.from) cq = cq.gte(win.col, win.from);
      if (win.to) cq = cq.lte(win.col, win.to);
    }
    var cr = await withTimeout(cq);
    if (!cr || cr.error || typeof cr.count !== 'number') return null;
    if (cr.count !== rows.length) {
      console.error('[bk] הגיבוי נחתך — ' + s.name + ': נמדדו ' + rows.length +
                    ' שורות והשרת מדווח ' + cr.count);
      return null;
    }
  } catch (e) { return null; }
  return rows;
}
/* ── הגיבוי היומי ──────────────────────────────────────────────────────── */
// מחזירה true רק כשכל המקורות גובו (או דולגו כבלתי-משתנים) בהצלחה.
async function bkMaybeDaily() {
  if (_bkRunning) return false;
  var c = _bkClient();
  if (!c) return false;
  var flag = _bkCfg('flagKey', null);
  if (!flag) return false;
  var today = bkToday();
  if (lsGet(flag, '') === today) return false;
  var src = _bkCfg('sources', []) || [];
  if (!src.length) return false;
  _bkRunning = true;
  var ok = true, wrote = 0, same = 0, failed = [];
  try {
    var pre = _bkCfg('prefix', '') || '';
    var secrets = _bkSecrets(), dailyKeys = [];
    for (var i = 0; i < src.length; i++) {
      var s = src[i], val = null;
      // ⛔ מפתח שברשימת הסודות אינו נכתב לגיבוי לעולם (השלמת סבב 35) —
      //    admin_pass שרד בגיבויים אחרי שנמחק מהמקור, ונוקה ידנית.
      if (s.kind === 'kv' && secrets.indexOf(s.name) !== -1) continue;
      // ⭐ `key` פר-מקור (סבב 35) — מקור-טבלה שמפתחו היה מתנגש במקור
      //    ה-kv ההיסטורי באותו שם מקבל מפתח גיבוי משלו. הרשימה שנצברת
      //    כאן היא רשימת-ההיתר של הגריעה — בלי תלות בהצלחת המקור.
      var bkey = pre + (s.key || s.name);
      dailyKeys.push(bkey);
      /*  ⛔ שתי השכבות נכנסות לרשימת-ההיתר של הגריעה (סבב 87ג) — ⚠️ מפתח
       *  שאינו שם אינו מתפנה לעולם, ⭐ ו-`ANCHOR:`/`DIFF:` הם מפתחות
       *  חדשים: ⛔ בלעדיהם הם היו נצברים בלי גבול. */
      if (s.kind !== 'kv') {
        dailyKeys.push(BK_ANCHOR_PREFIX + bkey);
        dailyKeys.push(BK_DIFF_PREFIX + bkey);
      }
      /* ⭐ דגל-יום פר-מקור (סבב 62) — מקור שכבר גובה היום מדולג, גם
         כשהדגל הגלובלי לא נכתב. ⛔ בלעדיו מקור אחד שנכשל החזיק את כל
         השאר בלולאה: הדגל הגלובלי נכתב רק כשכולם הצליחו, ולכן כל עלייה
         גיבתה מחדש את מה שכבר גובה, שוב ושוב באותו יום.
         ⚠️ הדחיפה ל-`dailyKeys` קודמת לדילוג בכוונה: הרשימה היא
         רשימת-ההיתר של הגריעה, ומפתח שנופל ממנה אינו מתפנה לעולם. */
      var dayKey = 'bk_day_' + bkey;
      if (lsGet(dayKey, '') === today) { same++; continue; }
      if (s.kind === 'kv') {
        var res = await c.from(s.table).select('value').eq('key', s.name).maybeSingle();
        if (!res || res.error) { ok = false; failed.push(bkey); continue; }
        val = (res.data && res.data.value != null) ? String(res.data.value) : null;
      } else {
        /*  ⛔⛔ שכבת הגיבוי — עוגן שבועי מלא, ודיפרנציאלי בכל שאר הימים
         *  (סבב 87ג): ⚠️ הנימוק המדוד — הקריאה הייתה בקשה **אחת** בלי
         *  עימוד, ⛔ ו-Supabase מחזיר 1,000 שורות כברירת מחדל **בלי
         *  שגיאה**: ⭐ טבלה גדולה מהתקרה גובתה עד התקרה, ⛔ וכל השאר
         *  מעולם לא גובה — ⚠️ והכשל היה שקט לחלוטין. */
        var layer = _bkLayer(bkey, s);
        var rows = await _bkReadRows(c, s, layer.win);
        if (rows === null) { ok = false; failed.push(bkey); continue; }
        bkey = layer.prefix + bkey;
        // ⛔ שדה-סוד בשורות טבלה מסונן לפני הסריאליזציה (השלמת סבב 35) —
        //    שורה שמפתחה (`secretField`, ברירת מחדל `key`) ברשימת הסודות
        //    אינה מגיעה לגיבוי, גם כשהיא עדיין קיימת במקור.
        if (secrets.length) rows = rows.filter(function (r) {
          return secrets.indexOf(r && r[s.secretField || 'key']) === -1;
        });
        /*  ⛔ דיפרנציאלי ריק אינו נכתב ⛔ ואינו כישלון — ⚠️ יום שלא השתנה
         *  בו דבר הוא המצב הרגיל, ⭐ ועותק ריק בכל לילה מציף את הפינוי. */
        if (layer.diff && !rows.length) { same++; continue; }
        val = JSON.stringify(rows);
        if (!layer.diff && s.ts) _bkSetMark(layer.key, _bkMaxTs(rows, s.ts));
      }
      // מקור שאין לו ערך בענן — אין מה לגבות, וזה אינו כישלון.
      if (val == null) continue;
      var sig = bkSig(val), sigKey = 'bk_sig_' + bkey;
      if (lsGet(sigKey, '') === sig) { same++; continue; }
      var ins = await c.from(BK_TABLE).insert({ key: bkey, value: val });
      if (!ins || ins.error) { ok = false; failed.push(bkey); continue; }
      lsSet(sigKey, sig);
      lsSet(dayKey, today);
      wrote++;

    /* ⭐ הגריעה אינה מותנית עוד בהצלחת **כל** המקורות (סבב 62) — היא רצה
       על רשימת-ההיתר המלאה בכל פעם שנכתב עותק חדש. ⛔ הכריכה הישנה היא
       ששיתקה אותה: מקור אחד שנכשל מנע גריעה של כל השאר, וזה שורש מצבור
       ה-503 השורות שנוקה ב-26.8. ⚠️ והיא עדיין רצה **אחרי** הכתיבה, כדי
       שלא ייגרע עותק ישן לפני שהחדש נכתב (השלמת סבב 35). */
    if (wrote) { try { await _bkRetention(c, dailyKeys); } catch (e2) { } }
    if (ok) {
      lsSet(flag, today);
      logAction('backup', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same });
    } else {
      /* ⛔ בלי כתיבת הדגל הגלובלי — ההזדמנות הבאה באותו יום תנסה שוב
         (נרשם בסבב 6): גיבוי שנכשל ודילג על יממה שלמה הוא בדיוק
         מה שהדגל שנכתב-מראש גרם. ⚠️ ומה שכן השתנה (סבב 62): המקורות
         שהצליחו נושאים דגל-יום משלהם ואינם נגבים שוב, ולכן הניסיון החוזר
         מכוון למי שנכשל בלבד. ⛔ וכשל חלקי מדווח ואינו נבלע — `failed`
         נושא את שמות המקורות, אחרת «נכשל» היה מספר בלי מען. */
      logAction('backup_fail', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same, failed: failed });
      console.warn('[backup] מקורות שנכשלו: ' + (failed.join(', ') || '?') + ' — ייבחנו שוב בהזדמנות הבאה');
    }
  } catch (e) { ok = false; }
  _bkRunning = false;
  return ok;
}

/* ── מדיניות השמירה — גריעת עותקים יומיים ישנים מ-30 יום ──────────────── */
// ⛔ הגריעה מוגבלת ב-`in('key', keys)` לרשימת המפתחות היומיים של
//    האפליקציה הנוכחית בלבד (השלמת סבב 35) — רשימת-היתר, לא קידומת:
//    גיבויי `PRE_*` וגיבויים של אפליקציה אחרת אינם מועמדים כלל.
// ⚠️ נכשלת סגור: `error` (כולל היעדר הרשאת DELETE — סבב 29) מוחזר כאפס
//    בשקט, בלי להפיל את הגיבוי ובלי רישום-סרק יומי ליומן הראיות.
async function _bkRetention(c, keys) {
  if (!c || !Array.isArray(keys) || !keys.length) return 0;
  var cutoff = new Date(Date.now() - BK_RETENTION_DAYS * 86400000).toISOString();
  var del = await c.from(BK_TABLE)['delete']().in('key', keys).lt('created_at', cutoff).select('id');
  if (!del || del.error || !Array.isArray(del.data)) return 0;
  var n = del.data.length;
  if (n > 0) logAction('retention', null, n, { days: BK_RETENTION_DAYS, keys: keys.length });
  return n;
}


/* ── נקודת ההפעלה היחידה ─────────────────────────────────────────────── */
// ⛔ זו הקריאה היחידה שקוד האפליקציה עושה למודול (סבב 30, השלמה) — היא
//    יושבת בפונקציית העלייה, לצד `lsBoot()` ו-`pendBoot()`, ולעולם לא
//    במסלול דחיפה/סנכרון. ר' הנימוק המלא בכותרת הבלוק.
// ⚠️ שתי הקריאות אינן ב-`await` ואינן חוסמות: העלייה אינה ממתינה לרשת,
//    וכל כשל נבלע בשקט בתוך המודול.
function bkBoot() {
  try { bkMaybeDaily(); } catch (e) { }
  try { logFlush(); } catch (e) { }
}
/* ═══════════════ סוף מודול הגיבוי היומי ═══════════════════════════════ */

/* ═══ ממתין לסנכרון — מודול משותף (סבב 12) ═══════════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PEND_LATE_MS = 24 * 60 * 60 * 1000;   // סף ההתרעה
var PEND_MAX = 800;                       // תקרת המפה — הגנה מפני צמיחה בלי גבול
var _pendMap = null;
var _pendAlertDismissed = 0;

/* ---------------------------------------------- השהיית ציור (סבב 16) ----
   באונליין תקין האישור מגיע תוך פחות משתי שניות מהסימון, והתגית והסרגל היו
   מהבהבים לשבריר שנייה על כל שמירה. לכן סימון שנוצר **הרגע** בכתיבה חדשה
   מקבל "החזקת ציור" בזיכרון: אם האישור הגיע בתוך PEND_DRAW_DELAY_MS —
   ה-⏳ לא מופיע כלל; אם לא — הוא מופיע וממשיך להתנהג בדיוק כמו היום.
   ⚠️ ההשהיה היא על ה**ציור בלבד**: הסימון הלוגי נכתב ל-localStorage מיידית
   (מנגנוני הבטיחות — פינוי, דחיפה, מיגרציות — נשענים עליו), מסך ההגדרות
   (pendStatusHTML) והמונים הלוגיים (pendCount/pendHas/pendSince) אינם
   מושהים לעולם, וההחזקה חיה **בזיכרון בלבד** — סימון שנטען מהדיסק בעליית
   האפליקציה (המכשיר נסגר בתוך שתי השניות) מצויר מיד. */
var PEND_DRAW_DELAY_MS = 2000;
var _pendDrawHold = {};     // key -> הרגע שממנו מותר לצייר (זיכרון בלבד, לא נשמר)

function pendHoldDraw(key, now) {
  _pendDrawHold[key] = (now || Date.now()) + PEND_DRAW_DELAY_MS;
}
// חותמת לציור: 0 כל עוד הסימון מוחזק. סימון בלי החזקה (נטען מהדיסק) — מיידי.
function pendDrawSince(key) {
  var t = pendSince(key);
  if (!t) return 0;
  var h = _pendDrawHold[key];
  if (h && Date.now() < h) return 0;
  if (h) delete _pendDrawHold[key];
  return t;
}
// כמה סימונים מותר לצייר עכשיו. משמש רק להחלטת "האם להציג את הסרגל" —
// המספר המוצג עצמו הוא תמיד pendCount() המלא.
function pendDrawCount() {
  var m = pendAll(), keys = Object.keys(m), n = 0, now = Date.now();
  for (var i = 0; i < keys.length; i++) {
    var h = _pendDrawHold[keys[i]];
    if (!h || now >= h) n++;
  }
  return n;
}
// בתום ההחזקה: הסימון עדיין קיים (לא אושר — אופליין/רשת איטית) ⇒ מציירים
// אותו עכשיו, כולל רינדור הרשימות דרך PEND_CFG.redraw (פר-אפליקציה).
// אושר בינתיים (המסלול המהיר הרגיל) ⇒ אין מה לצייר ואין רינדור מיותר.
function pendDrawFlush() {
  var m = pendAll(), now = Date.now(), revealed = false;
  Object.keys(_pendDrawHold).forEach(function (k) {
    if (now >= _pendDrawHold[k]) {
      delete _pendDrawHold[k];
      if (m[k]) revealed = true;
    }
  });
  if (!revealed) return;
  pendRender();
  try { if (typeof PEND_CFG === 'object' && PEND_CFG.redraw) PEND_CFG.redraw(); } catch (e) { }
}
function pendScheduleFlush() {
  try { setTimeout(pendDrawFlush, PEND_DRAW_DELAY_MS + 50); } catch (e) { }
}

// `PEND_CFG.key` יכולה להיות מחרוזת או פונקציה. אפליקציה שמחזיקה שני
// מוסדות באותו דומיין — וסימוני האחד אינם תקפים לשני — מוסרת פונקציה.
function pendKeyName() {
  var k = (typeof PEND_CFG === 'object') ? PEND_CFG.key : null;
  if (typeof k === 'function') { try { k = k(); } catch (e) { k = null; } }
  return k || 'pending_sync';
}
// החלפת הקשר (מוסד/משתמש) — המפה נטענת מחדש מהמפתח החדש.
function pendReload() { _pendMap = null; _pendDrawHold = {}; pendAll(); pendRender(); }

function pendAll() {
  if (_pendMap) return _pendMap;
  var v = null;
  try { var raw = lsGet(pendKeyName(), null); v = raw == null ? null : JSON.parse(raw); }
  catch (e) { v = null; }
  _pendMap = (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  // ניקוי ערכים פגומים — חותמת שאינה מספר חיובי אינה ראיה לכלום
  Object.keys(_pendMap).forEach(function (k) {
    var t = Number(_pendMap[k]);
    if (!isFinite(t) || t <= 0) delete _pendMap[k];
  });
  return _pendMap;
}

// הכתיבה עוברת דרך lsSet. כישלון כאן אינו שקט: lsSet מרימה
// באנר ורושמת ליומן, ו-lsGuardToast יבלע כל "✅" בשתי השניות הבאות.
function pendSave() {
  var m = pendAll();
  var keys = Object.keys(m);
  if (keys.length > PEND_MAX) {
    // גריעה של הישנים ביותר. זו לא "מחיקת נתון שטרם הסתנכרן" — הרשומה עצמה
    // נשארת במקומה; רק הסימון שלה יורד. עדיין נרשם ליומן, כי סימון שנעלם
    // בלי אישור הוא בדיוק מה שהמודול בא למנוע.
    keys.sort(function (a, b) { return m[a] - m[b]; });
    var drop = keys.slice(0, keys.length - PEND_MAX);
    drop.forEach(function (k) { delete m[k]; });
    try { lsLog('pend-overflow', drop.length + ' סימונים נגרעו (תקרה ' + PEND_MAX + ')', 0); } catch (e) { }
  }
  return lsSet(pendKeyName(), JSON.stringify(m));
}

// סימון. חותמת קיימת **אינה נדרסת** — הגיל נמדד מהכתיבה הראשונה שלא אושרה,
// אחרת עריכה חוזרת של אותה רשומה הייתה מאפסת את שעון ההתרעה לנצח.
function pendMark(key) {
  if (!key) return 0;
  var m = pendAll();
  if (!m[key]) {
    // הסימון הלוגי נכתב מיידית (pendSave); רק הציור מוחזק (סבב 16).
    m[key] = Date.now();
    pendHoldDraw(key, m[key]); pendScheduleFlush();
    pendSave(); pendRender();
  }
  return m[key];
}
function pendMarkMany(keys) {
  if (!keys || !keys.length) return;
  var m = pendAll(), now = Date.now(), ch = false;
  for (var i = 0; i < keys.length; i++) {
    if (keys[i] && !m[keys[i]]) { m[keys[i]] = now; pendHoldDraw(keys[i], now); ch = true; }
  }
  if (ch) { pendScheduleFlush(); pendSave(); pendRender(); }
}

// אישור — יש ראיה שהענן קיבל.
function pendClear(key) {
  if (!key) return;
  var m = pendAll();
  if (m[key]) { delete m[key]; delete _pendDrawHold[key]; pendSave(); pendRender(); }
}
function pendClearMany(keys) {
  if (!keys || !keys.length) return;
  var m = pendAll(), ch = false;
  for (var i = 0; i < keys.length; i++) if (m[keys[i]]) { delete m[keys[i]]; delete _pendDrawHold[keys[i]]; ch = true; }
  if (ch) { pendSave(); pendRender(); }
}

// כשל סמכותי — הכתיבה **לא** נכנסה, ולכן הסימון יורד. ראה ההערה בראש המודול.
function pendFailed(key) { pendClear(key); }

// אישור דחיפת-מצב מלא: כל מה שסומן לפני `t0` נכלל בצילום שנדחף בהצלחה.
// `prefix` מגביל לקטגוריה אחת — דחיפה של מפתח אחד אינה מאשרת את השאר.
function pendConfirmPush(prefix, t0) {
  var m = pendAll(), ch = false;
  t0 = Number(t0) || 0;
  if (!t0) return;
  Object.keys(m).forEach(function (k) {
    if (prefix && k.indexOf(prefix) !== 0) return;
    if (m[k] < t0) { delete m[k]; delete _pendDrawHold[k]; ch = true; }
  });
  if (ch) { pendSave(); pendRender(); }
}

function pendHas(key) { return !!pendAll()[key]; }
function pendSince(key) { return pendAll()[key] || 0; }
function pendCount() { return Object.keys(pendAll()).length; }
function pendOldest() {
  var m = pendAll(), keys = Object.keys(m), t = 0;
  for (var i = 0; i < keys.length; i++) if (!t || m[keys[i]] < t) t = m[keys[i]];
  return t;
}
function pendLateCount() {
  var m = pendAll(), keys = Object.keys(m), n = 0, cut = Date.now() - PEND_LATE_MS;
  for (var i = 0; i < keys.length; i++) if (m[keys[i]] < cut) n++;
  return n;
}

function pendFmtAge(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  var mi = Math.floor(ms / 60000);
  if (mi < 1) return 'פחות מדקה';
  if (mi < 60) return mi + ' דק׳';
  var h = Math.floor(mi / 60);
  if (h < 24) return h + ' שע׳';
  return Math.floor(h / 24) + ' ימים';
}

/* --------------------------------------------------------------- תצוגה */
function pendEnsureStyle() {
  if (document.getElementById('pend-style')) return;
  var s = document.createElement('style');
  s.id = 'pend-style';
  s.textContent =
    '.pend-tag{display:inline-block;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);' +
    'border-radius:999px;padding:0 7px;font-size:.68rem;font-weight:700;line-height:var(--lh-4);' +
    'white-space:nowrap;vertical-align:middle;margin:0 4px}' +
    '.pend-tag.late{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}' +
    '#pend-bar{position:fixed;z-index:2147482000;left:0;right:0;bottom:0;padding:8px 12px;' +
    'text-align:center;direction:rtl;font:600 13px/1.5 inherit;color:var(--warn);background:var(--warn-soft);' +
    'box-shadow:0 -2px 10px var(--sh-1)}' +
    '#pend-bar.late{background:var(--bad-soft);color:var(--bad)}' +
    '#pend-alert{position:fixed;z-index:2147483000;left:0;right:0;top:0;padding:10px 14px;' +
    'direction:rtl;font:700 13px/1.6 inherit;color:var(--on-alert);background:var(--alert);' +
    'box-shadow:0 2px 10px var(--sh-2);display:flex;gap:10px;align-items:center;justify-content:center}' +
    '#pend-alert button{background:var(--fill-dark);color:var(--on-dark);border:1px solid var(--on-dark);' +
    'border-radius:6px;padding:2px 10px;font:inherit;cursor:pointer}';
  (document.head || document.documentElement).appendChild(s);
}

// התגית שנכנסת לשורת הרשומה. מחזירה מחרוזת ריקה כשאין מה להציג, כדי
// שאפשר יהיה לשרשר אותה ללא תנאי בכל תבנית.
function pendTag(key) {
  var t = pendDrawSince(key);   // השהיית ציור (סבב 16) — לא pendSince
  if (!t) return '';
  pendEnsureStyle();
  var age = Date.now() - t, late = age > PEND_LATE_MS;
  var title = 'ממתין לסנכרון מאז ' + new Date(t).toLocaleString('he-IL') +
              ' (' + pendFmtAge(age) + ') — שמור במכשיר, טרם אושר בענן';
  return '<span class="pend-tag' + (late ? ' late' : '') + '" title="' + esc(title) + '">' +
         (late ? '⚠️' : '⏳') + ' ממתין</span>';
}

function pendCounterText() {
  var n = pendCount(), off = (typeof navigator !== 'undefined' && navigator && navigator.onLine === false);
  // כל הסימונים עדיין מוחזקים (נוצרו הרגע) ⇒ הסרגל לא קופץ לשבריר שנייה.
  // כשהוא כן מוצג — n הוא האמת הלוגית המלאה, לא רק מה שמותר לצייר.
  if (!n || !pendDrawCount()) return off ? '⚠️ אין רשת' : '';
  var late = pendLateCount();
  var s = (late ? '⚠️ ' : (off ? '⚠️ אין רשת · ' : '⏳ ')) + n + ' פעולות ממתינות לסנכרון';
  var old = pendOldest();
  if (old) s += ' · הישנה ביותר לפני ' + pendFmtAge(Date.now() - old);
  return s;
}

function pendRender() {
  if (typeof document === 'undefined' || !document.body) return;
  pendEnsureStyle();
  var txt = pendCounterText(), bar = document.getElementById('pend-bar');
  if (!txt) { if (bar) bar.style.display = 'none'; }
  else {
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'pend-bar';
      document.body.appendChild(bar);
    }
    var extra = '';
    try { if (typeof PEND_CFG === 'object' && PEND_CFG.extra) extra = PEND_CFG.extra() || ''; } catch (e) { }
    bar.textContent = txt + (extra ? ' · ' + extra : '');
    bar.className = pendLateCount() ? 'late' : '';
    bar.style.display = '';
  }
  pendRenderAlert();
}

// ההתרעה נפרדת מהמונה בכוונה: מונה הוא מידע, וסרגל תחתון נבלע ברעש המסך.
// משהו שממתין מעל יממה כבר אינו "מסתנכרן ברקע" — זו תקלה שדורשת פעולה.
function pendRenderAlert() {
  var late = pendLateCount(), el = document.getElementById('pend-alert');
  if (!late || (_pendAlertDismissed && (Date.now() - _pendAlertDismissed) < 6 * 60 * 60 * 1000)) {
    if (el) el.remove();
    return;
  }
  var msg = '⚠️ ' + late + ' פעולות ממתינות לסנכרון מעל 24 שעות — בדוק חיבור לאינטרנט. הנתונים שמורים במכשיר בלבד.';
  if (el) { var sp = el.firstChild; if (sp) sp.textContent = msg; return; }
  el = document.createElement('div');
  el.id = 'pend-alert';
  var span = document.createElement('span');
  span.textContent = msg;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'הבנתי';
  btn.dataset.act = 'pend-alert-ok';
  el.appendChild(span);
  el.appendChild(btn);
  document.body.appendChild(el);
}

// פאנל להגדרות — מה בדיוק ממתין, ומאיזה גיל.

// רענון תקופתי — הגיל מוצג בתגיות ובמונה, וסף ה-24 שעות חייב להיחצות
// גם כשהמשתמש לא נגע בכלום.
var _pendTick = null;
function pendBoot() {
  pendAll();
  pendRender();
  if (!_pendTick) _pendTick = setInterval(pendRender, 60000);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('online', pendRender);
    window.addEventListener('offline', pendRender);
  }
}
/* ═══════════════ סוף מודול "ממתין לסנכרון" ═════════════════════════════ */

/* ═══ ניסיון חוזר בסנכרון — מודול משותף (סבב 44) ══════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var RTY_BASE_MS = 15000;   // המרווח הראשון אחרי כישלון
var RTY_MAX_MS  = 60000;   // תקרת הנסיגה — מעבר לה אין טעם להאט עוד
var _rtyTimer = null, _rtyDelay = RTY_BASE_MS, _rtyBusy = false, _rtyWired = false;

function _rtyPending() {
  try { return !!(typeof RTY_CFG !== 'undefined' && RTY_CFG && RTY_CFG.pending && RTY_CFG.pending()); }
  catch (e) { return false; }
}
function _rtyOnline() {
  try { return typeof navigator === 'undefined' || navigator.onLine !== false; } catch (e) { return true; }
}
function _rtyVisible() {
  try { return typeof document === 'undefined' || document.visibilityState !== 'hidden'; } catch (e) { return true; }
}
/*  ⛔ קוד מיושן עוצר את הניסיון החוזר — ⚠️ סכימה שהשתנתה אינה כשל
 *  חולף, ⭐ והלולאה שניסתה שוב ושוב היא ה«איטיות» שדווחה מהשטח. */
function rtyReady() { return !_staleSchema && _rtyPending() && _rtyOnline() && _rtyVisible(); }
/*  ⛔ הידית אומרת «יש ניסיון חוזר באוויר, או שאנחנו בתוך נסיגה» — ⚠️ פולינג
 *  שדוחף נשען עליה כדי לא להציף, ⭐ והמצב הוא לאבחון ולשערים. */
function rtyGate()  { return _rtyBusy || _rtyDelay > RTY_BASE_MS; }
function rtyState() { return { armed: !!_rtyTimer, delay: _rtyDelay, busy: _rtyBusy }; }

function rtyStop() { if (_rtyTimer) { clearTimeout(_rtyTimer); _rtyTimer = null; } }

function rtyArm() {
  if (_rtyTimer) return false;
  if (!_rtyPending()) return false;
  _rtyTimer = setTimeout(_rtyFire, _rtyDelay);
  return true;
}

function _rtyFire() {
  _rtyTimer = null;
  if (!_rtyPending()) { _rtyDelay = RTY_BASE_MS; return; }
  if (!_rtyOnline() || !_rtyVisible()) { rtyArm(); return; }
  rtyKick();
}

function rtyKick() {
  if (_rtyBusy) return Promise.resolve(false);
  if (!_rtyPending()) { rtyStop(); _rtyDelay = RTY_BASE_MS; return Promise.resolve(false); }
  if (!_rtyOnline() || !_rtyVisible()) { rtyArm(); return Promise.resolve(false); }
  _rtyBusy = true;
  rtyStop();
  var p;
  try { p = Promise.resolve(RTY_CFG.flush()); } catch (e) { p = Promise.reject(e); }
  var grow = function () { _rtyDelay = Math.min(_rtyDelay * 2, RTY_MAX_MS); };
  return p.then(function () { if (_rtyPending()) grow(); else _rtyDelay = RTY_BASE_MS; }, grow)
          .then(function () { _rtyBusy = false; rtyArm(); return true; });
}

function rtyNote() { _rtyDelay = RTY_BASE_MS; rtyArm(); }

function rtyBoot() {
  if (!_rtyWired) {
    _rtyWired = true;
    try {
      window.addEventListener('online', function () { _rtyDelay = RTY_BASE_MS; rtyKick(); });
      document.addEventListener('visibilitychange', function () {
        if (_rtyVisible()) { _rtyDelay = RTY_BASE_MS; rtyKick(); }
      });
    } catch (e) { console.warn('[rty] wiring', e); }
  }
  rtyArm();
}
/* ═══════════════ סוף מודול הניסיון החוזר ════════════════════════════════ */

/* ═══ מנגנון המשיכה — מודול משותף (סבב 51) ════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PL_FALLBACK_MS = 60000;   // אין שורת חותמת בענן ⇒ משיכה מלאה אחת לדקה
var _plTimer = null, _plBusy = false, _plFullAt = 0, _plWired = false;

/* חותמת מהענן: מספר, מחרוזת JSON של מספר, או כל דבר אחר ⇒ 0. */
function plNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return Math.floor(v) || 0;
  try { var p = JSON.parse(v); if (typeof p === 'number') return Math.floor(p) || 0; } catch (e) { }
  return parseInt(v, 10) || 0;
}

function _plSeen() { try { return plNum(PL_CFG.seen()); } catch (e) { return 0; } }

/* ⭐ נקראת אחרי כל כתיבה מוצלחת לענן. היא מקדמת קודם את «מה שכבר נראה»
   מקומית — כדי שהתקתוק הבא לא ימשוך מלא בגלל השינוי של המכשיר הזה
   עצמו — ורק אז כותבת את החותמת לענן. ⛔ כשל בכתיבת החותמת אינו מפיל
   את הכתיבה שקדמה לה (סבב 51) — הנתון כבר בענן, והמכשירים האחרים
   יראו אותו בשינוי הבא או בנפילה-חזרה. */
function plTouch(ts) {
  var t = plNum(ts) || Date.now();
  try { PL_CFG.note(t); } catch (e) { }
  try {
    return Promise.resolve(PL_CFG.stamp(t)).then(function () { return t; }, function () { return t; });
  } catch (e) { return Promise.resolve(t); }
}

function _plFull() {
  var done = function (v) { _plBusy = false; return v; };
  /*  ⛔ שחרור האופק **לפני** המשיכה ⛔ ולא אחריה — ⚠️ הניקוי הוא שמתיר
   *  לכתיבה שבסופה להחזיר את הישן, ⭐ וניקוי שאחריה ממתין למשיכה הבאה. */
  try { lsHorizonRelease(); } catch (e0) { }
  try {
    return Promise.resolve(PL_CFG.pull()).then(
      function () { _plFullAt = Date.now(); return done(true); },
      function () { return done(false); });
  } catch (e) { return Promise.resolve(done(false)); }
}

function plTick() {
  if (_plBusy) return Promise.resolve(false);
  var live; try { live = !!PL_CFG.active(); } catch (e) { live = false; }
  if (!live) return Promise.resolve(false);
  _plBusy = true;
  var done = function (v) { _plBusy = false; return v; };
  var p;
  try { p = Promise.resolve(PL_CFG.remote()); } catch (e) { p = Promise.reject(e); }
  return p.then(function (r) {
    if (!r || !r.ok) return done(false);
    try { PL_CFG.ok(); } catch (e) { }
    if (r.ts === null || r.ts === undefined) {
      if (Date.now() - _plFullAt >= PL_FALLBACK_MS) return _plFull();
      return done(false);
    }
    var ts = plNum(r.ts);
    if (ts > _plSeen()) { try { PL_CFG.note(ts); } catch (e) { } return _plFull(); }
    return done(false);
  }, function () { return done(false); });
}


function plBoot() {
  if (!_plWired) {
    _plWired = true;
    try { window.addEventListener('online', function () { plTick(); }); }
    catch (e) { console.warn('[pl] wiring', e); }
  }
  if (_plTimer) return false;
  var ms = 0;
  try { ms = parseInt(PL_CFG.every, 10) || 0; } catch (e) { ms = 0; }
  if (!ms) ms = 3000;
  _plTimer = setInterval(function () { plTick(); }, ms);
  plTick();
  return true;
}
/* ═══════════════ סוף מנגנון המשיכה ══════════════════════════════════════ */

/* ═══ שכבת הדחיפה — מודול משותף (סבב 102) ═════════════════════════════════
   ⛔ שלוש שכבות נפרדות — **מנה · טבלה · טבלאות** — ⚠️ וכל אחת פונקציה
      משלה: ⭐ שכבות שמעורבבות בפונקציה אחת אינן ניתנות לחתימה ואינן
      ניתנות למדידה, ⛔ ולכן אותו תפקיד נכתב בצורות נבדלות בלי שאיש מדד.
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ המנה היא `PUSH_CFG.chunk` — ⚠️ הדחיפה הראשונה במכשיר נוגעת בכל
      הרשומות, ⭐ ובקשה לשורה היא אלפי בקשות רשת: ⛔ **ומנה שנכשלה נדחפת
      שוב שורה-שורה** — ⚠️ כתיבת מנה היא הכל-או-כלום, ⭐ ושורה פגומה אחת
      חוסמת את כל התקינות שאיתה.
   ⛔ ו«אין ראיה» אינו «אין מה לדחוף» — ⚠️ `dirty` שמחזירה `null` מדלגת על
      הטבלה **בלי לסמן את עֵד הפינוי**, ⭐ ומערך ריק מסמן אותו: ⛔ סימון על
      טבלה שלא נמשכה היה מתיר לפנות מהדיסק רשומה שמעולם לא עלתה. */
var _pushTimer = null;

/*  ⛔ שכבה 1 — **מנה אחת ותו לא** — ⚠️ היא אינה יודעת מה מלוכלך ואינה
 *  נוגעת בסימון ה-⏳: ⭐ כל מה שהיא עושה הוא כתיבה אחת, ⛔ וכשל שלה הוא
 *  זריקה — ⚠️ תשובה שנושאת `error` אינה זורקת מעצמה, ⭐ והבודקת היחידה
 *  שלה היא כאן. */
function pushRow(t, rows) {
  return Promise.resolve(PUSH_CFG.send(t, rows)).then(function (res) {
    if (res && res.error) throw res.error;
    return rows.length;
  });
}

/*  ⛔ שכבה 2 — **טבלה אחת**: המנות, סימוני ה-⏳, ועֵד הדחיפה — ⚠️ «אין ראיה»
 *  אינו הצלחה: ⭐ לא נדחף דבר ⛔ ואין לזקוף זאת כדחיפה שעברה · ⚠️ וכשל רשת
 *  אינו ראיה לכלום ולכן הסימון נשאר וננסה שוב, ⭐ וכשל סמכותי (ולידציה ·
 *  מפתח זר · הרשאה · סכימה) יחזור על עצמו לנצח: ⛔ הסימון יורד כדי לא
 *  להבטיח שליחה חוזרת שלא תקרה, ⚠️ והסיבה נרשמת ואינה נבלעת. */
function pushTable(t, ctx) {
  return Promise.resolve(PUSH_CFG.dirty(t, ctx)).then(function (rows) {
    if (!rows) return { ok: false, still: [], n: 0 };
    if (!rows.length) { PUSH_CFG.mark(t); return { ok: true, still: [], n: 0 }; }
    var still = [], n = 0, bad = 0, i = 0;
    function won(row) {
      var k = PUSH_CFG.key(t, row);
      n++;
      if (k != null) pendClear(k);
    }
    function lost(row, e) {
      var k = PUSH_CFG.key(t, row);
      console.warn('[push] ' + t, e && (e.message || e));
      if (isNetErr(e)) { if (k != null) still.push(k); }
      else { bad++; if (k != null) pendFailed(k); }
    }
    /*  ⛔ הנפילה-חזרה פר-שורה — ⚠️ המנה כולה נדחתה ואיננו יודעים מי בה
     *  פגומה, ⭐ ולכן כל שורה נשלחת לבדה: ⛔ כך הפגומה מבודדת ⚠️ ואינה
     *  חוסמת את התקינות שנשלחו איתה. */
    function solo(part, j) {
      if (j >= part.length) return Promise.resolve();
      var row = part[j];
      return pushRow(t, [row]).then(function () { won(row); },
                                    function (e) { lost(row, e); })
        .then(function () { return solo(part, j + 1); });
    }
    function batch() {
      if (i >= rows.length) return Promise.resolve();
      var part = rows.slice(i, i + PUSH_CFG.chunk);
      i += part.length;
      return pushRow(t, part).then(function () { part.forEach(won); },
                                   function () { return solo(part, 0); })
        .then(batch);
    }
    return batch().then(function () {
      /*  ⭐ «באמת נכתב משהו לענן» נמדד כאן — ⛔ בלי קידום החותמת הדחיפה
       *  נשארת בלתי-נראית לכל מכשיר אחר לנצח: ⚠️ הם מושכים רק כשהיא
       *  מתקדמת. */
      if (n) plTouch();
      /*  ⭐ עֵד הפינוי פר-מפתח — ⛔ רק כשלא נשארה שורה בכשל רשת: ⚠️ «עברנו
       *  על כל המלוכלכות והענן קיבל את כולן» הוא בדיוק התנאי שמתיר לפנות
       *  מהדיסק רשומה ישנה של אותה טבלה. */
      if (!still.length) PUSH_CFG.mark(t);
      return { ok: !still.length && !bad, still: still, n: n };
    });
  });
}

/*  ⛔ שכבה 3 — **הטבלאות**, בסדר שמוצהר ב-`PUSH_CFG.tables` — ⚠️ הסדר הוא
 *  מה ששומר על המפתח הזר: ⭐ האב נכתב לפני הבן, ⛔ ואין תלות סדר בין
 *  שורות של אותה טבלה · ⚠️ וכשל בטבלה אחת אינו עוצר את הבאות אחריה. */
function pushDirty(ctx) {
  var acc = [], ok = true, n = 0, i = 0;
  function step() {
    if (i >= PUSH_CFG.tables.length) return Promise.resolve({ ok: ok, still: acc, n: n });
    return pushTable(PUSH_CFG.tables[i++], ctx).then(function (r) {
      acc = acc.concat(r.still);
      n += r.n;
      if (!r.ok) ok = false;
      return step();
    });
  }
  return step();
}

/*  ⛔ המתזמן — ⚠️ משפך הכתיבה המקומית היחיד, ⭐ ולכן זו נקודת הדריכה של
 *  מודול הניסיון החוזר · ⛔ **וההשהיה מתחילה מחדש בכל כתיבה** — ⚠️ שתי
 *  שמירות רצופות הן מחזור סנכרון אחד ⛔ ולא שניים, ⭐ והרשומה כבר מסומנת
 *  ⏳ לפני ההשהיה. */
function schedulePush() {
  rtyNote();
  if (_pushTimer) clearTimeout(_pushTimer);
  /*  ⛔ ההקשר נלכד **בקביעת המועד** ⛔ ולא בהתעוררות — ⚠️ ההשהיה היא המתנה
   *  לכל דבר, ⭐ והמשתמש או המוסד יכולים להתחלף בתוכה: ⛔ מחזור שמתעורר
   *  בהקשר אחר דוחף שורות ⏳ שנצברו בקודם, ⚠️ וזוקף את הצלחתן לחדש. */
  var _ep = ctxEpoch();
  _pushTimer = setTimeout(function () {
    _pushTimer = null;
    if (ctxStale(_ep)) return;
    PUSH_CFG.run();
  }, PUSH_CFG.delay);
}
/* ═══════════════ סוף מודול שכבת הדחיפה ══════════════════════════════════ */

/* ═══ חלון חם ושחזור מקומי — מודול משותף (סבב 35) ════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════ */
var HW_BOOT_DEFER_MS = 3000;      // כמו הפינוי הנדחה של סבב 14 — רשת אחרי עלייה
var _hwCloudSeen = {};            // ראיה עננית בזיכרון בלבד: מפתח → {מזהה → חותמת}
var _hwSweepBusy = false;
var _hwSwept = 0;                 // כמה רשומות פונו בעלייה הזו — לתיעוד בלבד

function _hwVal(v) { return (typeof v === 'function') ? v() : v; }
function hwEnabled() {
  try { return !!(typeof HW_CFG !== 'undefined' && HW_CFG && HW_CFG.enabled); }
  catch (e) { return false; }
}
function _hwSpecs() {
  try { return (typeof HW_CFG !== 'undefined' && HW_CFG && HW_CFG.specs) || []; }
  catch (e) { return []; }
}
function _hwSpecFor(key) {
  var specs = _hwSpecs();
  for (var i = 0; i < specs.length; i++) {
    try { if (_hwVal(specs[i].key) === key) return specs[i]; } catch (e) { }
  }
  return null;
}
function _hwLive(spec, rec) {
  try { return spec.isLive ? !!spec.isLive(rec) : !(rec && rec.deleted); }
  catch (e) { return true; }
}

// רישום הראיה העננית — כל משיכה מוצלחת מוסיפה ומעדכנת חותמות פר-מזהה.
function hwNoteCloud(key, rows) {
  if (!hwEnabled() || !Array.isArray(rows)) return;
  var spec = _hwSpecFor(key);
  if (!spec) return;
  var idx = _hwCloudSeen[key] || (_hwCloudSeen[key] = {});
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], id, t;
    try { id = spec.idOf(r); t = Number(spec.ts(r)) || 0; } catch (e) { continue; }
    if (id == null) continue;
    id = String(id);
    if (!(idx[id] >= t)) idx[id] = t;
  }
}

// שער הדיסק. ⛔ כל ספק משאיר את הרשומה (סבב 35) — רשומה בלי ראיה עננית
// עדכנית לה-עצמה נכתבת לדיסק כרגיל; רק ודאות מפנה.
function hwDiskFilter(key, rows) {
  if (!hwEnabled() || !Array.isArray(rows)) return rows;
  var spec = _hwSpecFor(key);
  if (!spec) return rows;
  var idx = _hwCloudSeen[key];
  if (!idx) return rows;
  var kept = [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], drop = false;
    try {
      if (!spec.inWindow(r)) {
        var pend = true;
        try { pend = !!spec.isPending(r); } catch (e1) { pend = true; }
        if (!pend) {
          var id = spec.idOf(r);
          if (id != null) {
            var ct = idx[String(id)];
            var lt = Number(spec.ts(r)) || 0;
            if (ct !== undefined && ct >= lt) drop = true;
          }
        }
      }
    } catch (e) { drop = false; }
    if (!drop) kept.push(r);
  }
  return kept;
}

// הפינוי עצמו — מושך את העותק הענני של כל מפרט, ואז כותב לדיסק את הנשאר.
async function hwSweep() {
  if (!hwEnabled() || _hwSweepBusy) return { swept: 0 };
  try {
    if (typeof LS_CFG !== 'undefined' && LS_CFG &&
        typeof LS_CFG.pending === 'function' && LS_CFG.pending()) {
      try { lsLog('hw-skip', 'תור יוצא לא ריק'); } catch (e0) { }
      return { swept: 0 };
    }
  } catch (e) { return { swept: 0 }; }
  _hwSweepBusy = true;
  var swept = 0;
  try {
    var specs = _hwSpecs();
    for (var i = 0; i < specs.length; i++) {
      var s = specs[i], key;
      try { key = _hwVal(s.key); } catch (e1) { continue; }
      var res = null;
      try { res = await s.fetch(); } catch (e2) { res = null; }
      if (!res || res.ok !== true || !Array.isArray(res.rows)) continue;
      hwNoteCloud(key, res.rows);
      var cur = null;
      try { cur = s.rows(); } catch (e3) { cur = null; }
      if (!Array.isArray(cur)) continue;
      var kept = hwDiskFilter(key, cur);
      if (kept.length === cur.length) continue;
      var okW = false;
      try { okW = !!s.apply(kept); } catch (e4) { okW = false; }
      if (okW) {
        var n = cur.length - kept.length;
        swept += n;
        try { lsLog('hw-sweep', (s.label || key) + ' −' + n); } catch (e5) { }
      }
    }
  } catch (e6) { }
  _hwSwept = swept;
  _hwSweepBusy = false;
  return { swept: swept };
}

// מסך העבר — קריאה בלבד. מחזיר מהענן את הרשומות החיות שמחוץ לחלון,
// מהחדשה לישנה, בלי לגעת בדיסק ובלי לגעת בזיכרון האפליקציה.
async function hwPastLoad(key, filter) {
  var spec = _hwSpecFor(key);
  if (!spec) return { ok: false, rows: [] };
  var res = null;
  try { res = await spec.fetch(); } catch (e) { res = null; }
  if (!res || res.ok !== true || !Array.isArray(res.rows)) return { ok: false, rows: [] };
  hwNoteCloud(key, res.rows);
  var out = [];
  for (var i = 0; i < res.rows.length; i++) {
    var r = res.rows[i];
    var inW = true;
    try { inW = !!spec.inWindow(r); } catch (e1) { }
    if (inW || !_hwLive(spec, r)) continue;
    if (filter) { try { if (!filter(r)) continue; } catch (e2) { continue; } }
    out.push(r);
  }
  out.sort(function (a, b) {
    var ta = 0, tb = 0;
    try { ta = Number(spec.ts(a)) || 0; tb = Number(spec.ts(b)) || 0; } catch (e3) { }
    return tb - ta;
  });
  return { ok: true, rows: out };
}

/* ── נקודת ההפעלה ──────────────────────────────────────────────────────── */
// ⛔ נקודת ההפעלה היחידה היא `hwBoot()` מפונקציית העלייה (סבב 35, כלל
//    ברזל 12) — הפינוי מושהה מפני שהוא דורש רשת, בדיוק כמו הפינוי הנדחה
//    של סבב 14. כשהמודול רדום (`HW_CFG.enabled` כבוי) היציאה מיידית,
//    וכפתור השחזור נשאר פעיל בנפרד.
function hwBoot() {
  if (!hwEnabled()) return;
  try { setTimeout(function () { hwSweep(); }, HW_BOOT_DEFER_MS); } catch (e) { }
}
/* ═══════════════ סוף מודול החלון החם ══════════════════════════════════ */

/* ═══ שכבת המראה — מודול משותף (סבב 114) ══════════════════════════════════
   ⛔ העותק המקומי של הענן חי במבנה **אחד** — ⚠️ `MIRROR`, ממופתח בשם
      הטבלה: ⭐ שם לוגי שני לאותה מראה הוא מיפוי שחי במקום נפרד, ⛔ ומיפוי
      שחי במקום נפרד מתיישן בשקט.
   ⛔ **ומפתח האחסון נגזר** ⛔ ואינו מוקלד — ⚠️ מפתח שהוקלד בהצהרת הפינוי
      ואינו מה שנכתב בפועל אינו מתפנה לעולם, ⭐ והפינוי מדווח «אין מה
      לפנות» על מפתח שגדל בלי גבול.
   ⛔ **שער החלון החם יושב ב-`mirrorSave`** — ⚠️ והכתיבה הגולמית היחידה
      היא `mirrorWrite`, למסלול שכבר סינן: ⭐ סינון שני מודד את התוצאה של
      עצמו, ⛔ וכתיבה שעוקפת את השער מחזירה לדיסק את מה שהרגע פונה ממנו.
   ⛔ שינוי כאן — שלוש האפליקציות **ושלושת עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשניים.
   ⚠️ מה שאינו נאכף כאן: **תוכן** השורות ומי שאינו טבלה — ⭐ הניקוי הוא
      `MIRROR_CFG.clean`, ⛔ והמפתחות השטוחים מוכרזים בשער.
   ══════════════════════════════════════════════════════════════════════ */

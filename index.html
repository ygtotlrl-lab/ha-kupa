<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9C7FD0">
<title>הקופה</title>
<script>
/*  ⛔ תג `base` דינמי, לפני כל תג עם כתובת יחסית — ⚠️ כשה-service worker
 *  מגיש את הקליפה בנתיב עמוק, כתובת יחסית נפתרת רמה אחת עמוק מדי:
 *  ⭐ המניפסט, העובד והאייקונים היו מחזירים 404, והעובד נרשם בהיקף שגוי.
 *  ⛔ אין להזיז אותו למטה. */
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/ha-kupa\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ========================================================= אסימוני העיצוב */
:root{
  /*  ⛔ מרחק הטוסט מתחתית המסך — ⚠️ הערך היחיד שנבדל בשכבת הטוסט:
   *  ⭐ כאן אין סרגל תחתון, ⛔ ורק הכפתור הצף מעליו. */
  --toast-bottom:80px;
  /*  ⛔ צבע הזהות — ⚠️ אסימון אחד בשם אחד בכולן, ⭐ והגוון בלבד נבדל:
   *  ⛔ רכיב שמייצג את האפליקציה נגזר ממנו ⛔ ולא מדיו הטקסט.
   *  ⛔ **והדיו שעליו צמד הפוך** — ⚠️ ומתחלף איתו יחד. */
  --brand:#7C5CB0; --on-brand:#FFFFFF; --on-rasp:#FFFFFF;

  --bg:#F6F2FA; --card:#FFFFFF; --card-2:#FBF9FD;
  --text:#352B3F; --text2:#7E6F90; --text3:#9F94AC;
  --border:#E6DEF0;
  --brand-ink:#5E3F8F; --brand-soft:#EFEAF6;
  --ok:#2E6F4A; --ok-soft:#E8F3EC;
  --warn:#C46A4E; --warn-soft:#FDE6DC;
  --bad:#B3261E; --bad-soft:#FBE9E7;
  --radius:var(--r-6); --radius-sm:var(--r-4);
  --shadow:0 1px 2px var(--sh-1);
  --shadow-lg:0 8px 22px rgba(53,43,63,.16);

  /*  ⛔ אסימוני המוצר — ⚠️ הם קיימים כאן בלבד: ⭐ שבע דרגות הסגול הן
   *  **תפקיד** — חומש · צדקה · ניווט, ⛔ ושלוש דרגות האפרסק הן פלעזדש ·
   *  הכנסה · מטבע. ⛔ **והפטל בשני מקומות בלבד** — ⚠️ הכפתור הצף
   *  ו«אין עוד מלבדו!»: ⭐ צבע שמופיע בכל מקום מפסיק להיות סימן. */
  --purple-1:#EFEAF6; --purple-2:#B49EE0; --purple-3:#9C7FD0; --purple-4:#8A6BC0;
  --purple-5:#7C5CB0; --purple-6:#5E3F8F; --purple-7:#3A2540;
  --peach-1:#FDE6DC; --peach-2:#F2A184; --peach-3:#A54D32;
  --rasp:#B8446B; --rasp-ink:#B8446B;
  --line-soft:#EFEAF6;
  --ring-soft:rgba(255,255,255,.3);
}
@media (prefers-color-scheme:dark){
  :root{
    --on-brand:#FFFFFF; --on-rasp:#2A1B3D;

    --bg:#1B1420; --card:#251C2C; --card-2:#2E2336;
    --text:#EFE8F5; --text2:#C4B6D2; --text3:#9C8FAC;
    --border:#3A2D45;
    --brand:#7C5CB0; --brand-ink:#C3AAE8; --brand-soft:#332845;
    --ok:#6FD79B; --ok-soft:#16281E;
    --warn:#F0A184; --warn-soft:#33211A;
    --bad:#F1938C; --bad-soft:#331A18;
    --shadow:0 1px 2px var(--sh-2);
    --shadow-lg:0 8px 22px rgba(0,0,0,.5);

    --purple-1:#332845; --purple-2:#8C74B8; --purple-3:#A98BDD; --purple-4:#B79BE6;
    --purple-5:#C3AAE8; --purple-6:#D6C5F0; --purple-7:#EFE8F5;
    --peach-1:#3A2620; --peach-2:#F2A184; --peach-3:#F0A184;
    --rasp:#E896B0; --rasp-ink:#E896B0;
    --line-soft:#3A2D45;
    --ring-soft:rgba(255,255,255,.3);
  }
}

/* ==================================================================== בסיס */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:var(--fs-4); line-height:var(--lh-4); -webkit-text-size-adjust:100%;
  overflow-wrap:anywhere;
}
body.locked{overflow:hidden}
h1,h2,h3{margin:0; font-weight:500; line-height:var(--lh-2)}
button{font:inherit; color:inherit}
input,select,textarea{font:inherit; color:inherit}
.hidden{display:none !important}

/* ================================================== הפתיח והחתימה של מסך */
/*  ⛔ שתי השורות בראש ובתחתית **כל** מסך — ⚠️ הן אינן קישוט, ⭐ והן מה
 *  שהמשתמש ביקש לראות בכל פתיחה. */
.closer{color:var(--purple-5);font-size:var(--fs-1);text-align:center;font-weight:400;
  padding:var(--sp-7) var(--sp-6) var(--sp-6)}
.opener{color:var(--rasp-ink);font-size:var(--fs-2);letter-spacing:var(--ls-1);text-align:center;
  font-weight:500;padding:var(--sp-6) var(--sp-6) var(--sp-5)}

/* =================================================================== קליפה */
main{padding:0 var(--sp-6); padding-bottom:calc(84px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto}

/* ================================================================= כרטיסים */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-6);box-shadow:var(--shadow);margin-bottom:var(--sp-5)}
.card > h2{font-size:var(--fs-5);color:var(--text);display:flex;align-items:center;gap:var(--sp-4);
  margin-bottom:var(--sp-5);font-weight:500}
.card > h2 .st{margin-inline-start:auto;font-weight:400;font-size:var(--fs-3)}
.card > h2 .st.ok{color:var(--ok)}
.card > h2 .st.left{color:var(--purple-5)}
.card > h2 .st.peach{color:var(--peach-3)}
.empty{color:var(--text3);text-align:center;padding:var(--sp-7) var(--sp-5);font-size:var(--fs-3)}

/* ============================================ שורת החודש והמעבר בין חודשים */
.mrow{display:flex;align-items:center;justify-content:center;gap:var(--sp-5);
  padding:var(--sp-5) 0}
.mrow .mname{font-size:var(--fs-5);font-weight:500;color:var(--text)}
.mnav{background:none;border:0;cursor:pointer;color:var(--purple-5);padding:var(--sp-4);
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}

/*  ⛔ פס החוב מהחודש הקודם — ⚠️ הוא אומר מה נשאר, ⭐ ואינו מבהיל:
 *  ⛔ אין בו אדום ואין בו סימן שגיאה. */
.carry{display:flex;align-items:center;gap:var(--sp-4);background:var(--peach-1);
  color:var(--peach-3);font-size:var(--fs-3);font-weight:500;border-radius:var(--radius-sm);
  padding:var(--sp-5) var(--sp-5);margin-bottom:var(--sp-5);width:100%;border:0;
  cursor:pointer;text-align:start;min-height:44px}
.carry .arw{margin-inline-start:auto;font-size:var(--fs-3)}

/* ================================================================== מספרים */
.big{font-size:var(--fs-6);font-weight:500;line-height:var(--lh-1);color:var(--text)}
.sml{font-size:var(--fs-3);color:var(--text2);margin-top:var(--sp-4);line-height:var(--lh-3)}
.sml.strong{font-weight:500;color:var(--text)}
.inc{font-size:var(--fs-5);font-weight:500;color:var(--text);padding:var(--sp-5) 0}

/* ================================================================== הפירוט */
.det{list-style:none;margin:0;padding:0}
.det li{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-5) 0;
  border-bottom:.5px solid var(--line-soft);min-height:44px}
.det li:last-child{border-bottom:0}
.det .ico{width:26px;height:26px;border-radius:var(--r-3);display:flex;align-items:center;
  justify-content:center;flex:none;background:var(--purple-1);color:var(--purple-6)}
.det .ico svg{width:14px;height:14px}
.det .ico.peach{background:var(--peach-1);color:var(--peach-3)}
.det .nm{flex:1;font-size:var(--fs-3);min-width:0}
.det .tag{font-size:var(--fs-1);color:var(--text3);flex:none}
.det .amt{font-size:var(--fs-3);min-width:36px;text-align:start;flex:none;font-weight:500}
.det li.pend .amt{color:var(--text3)}
.det li.pend .nm{color:var(--text2)}

/* =========================================================== הכפתור הצף */
.fab{position:fixed;inset-block-end:var(--sp-6);inset-inline-start:var(--sp-6);z-index:var(--z-4);
  width:56px;height:56px;border-radius:var(--r-7);border:0;cursor:pointer;
  background:var(--rasp);color:var(--on-rasp);font-size:var(--fs-6);line-height:var(--lh-1);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)}

/* ============================================================ מסך הזרימה */
.flow{padding:var(--sp-6) 0}
.flow h2{font-size:var(--fs-5);font-weight:500;margin-bottom:var(--sp-5)}
.fld{margin-bottom:var(--sp-6)}
.fld label{display:block;font-size:var(--fs-3);color:var(--text2);margin-bottom:var(--sp-4)}
.fld input,.fld select{width:100%;background:var(--card);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:var(--sp-5) var(--sp-5);font-size:var(--fs-5);min-height:44px}
.opts{display:grid;gap:var(--sp-4)}
.opt{display:flex;align-items:center;gap:var(--sp-4);background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--sp-5);
  font-size:var(--fs-4);cursor:pointer;min-height:44px;text-align:start;width:100%}
.opt.on{border-color:var(--purple-3);background:var(--brand-soft);color:var(--brand-ink)}
.btn{display:block;width:100%;border:0;border-radius:var(--radius-sm);cursor:pointer;
  background:var(--brand);color:var(--on-brand);font-size:var(--fs-5);font-weight:500;
  padding:var(--sp-5);min-height:44px}
.btn.ghost{background:var(--card);color:var(--text2);border:1px solid var(--border)}
.btn[disabled]{opacity:var(--op-3);cursor:default}
.back{background:none;border:0;cursor:pointer;color:var(--purple-5);font-size:var(--fs-4);
  min-width:44px;min-height:44px}
.acbox{display:grid;gap:var(--sp-2);margin-top:var(--sp-4)}
.acbox button{background:var(--card-2);border:1px solid var(--border);cursor:pointer;
  border-radius:var(--radius-sm);padding:var(--sp-4) var(--sp-5);font-size:var(--fs-3);
  text-align:start;min-height:44px}

/* ======================================================= מסך אישור המטבע */
.slide{position:fixed;inset:0;z-index:var(--z-6);background:var(--bg);
  display:flex;flex-direction:column;align-items:center}
.slide .ttl{font-size:var(--fs-5);font-weight:500;color:var(--text);margin-top:var(--sp-7)}
.slide .sub{font-size:var(--fs-3);color:var(--text2);margin-top:var(--sp-4)}
.slide .bk{position:absolute;inset-block-start:var(--sp-6);inset-inline-start:var(--sp-6)}
.target{margin-top:var(--sp-7)}
/*  ⛔ שני הרוחבים הם שני הציורים ⛔ ולא סולם — ⚠️ הארנק רחב מהקופה,
 *  ⭐ והמספר הוא מידת הציור עצמו: ⛔ ורוחב מוטבע היה מחלקה שלא נכתבה. */
.target.wide{width:270px}
.target.narrow{width:230px}
.coin{position:absolute;width:150px;height:150px;border-radius:var(--r-7);
  background:var(--peach-2);display:flex;align-items:center;justify-content:center;
  color:var(--on-dark);font-size:var(--fs-6);font-weight:500;touch-action:none;cursor:grab;
  box-shadow:var(--shadow-lg)}
.coin .ring{position:absolute;inset:9px;border-radius:var(--r-7);
  border:1px solid var(--ring-soft)}
.coin.over{transform:scale(1.05)}
.done{text-align:center;padding:var(--sp-7) var(--sp-6)}
.done .line1{font-size:var(--fs-6);font-weight:500;color:var(--purple-5)}
.done .line2{font-size:var(--fs-4);color:var(--text2);margin-top:var(--sp-5)}
.conf{position:fixed;inset:0;z-index:var(--z-7);pointer-events:none}
.conf i{position:absolute;width:8px;height:8px;border-radius:var(--r-1)}

/* ================================================================== שלד */
.skel{background:var(--purple-1);border-radius:var(--radius-sm);height:14px;
  margin-bottom:var(--sp-4)}

/* ================================================== באנר העדכון והמודאל */
#updater{position:fixed;inset-inline:0;inset-block-end:0;z-index:var(--z-6);
  display:none;justify-content:center;padding:var(--sp-5) var(--sp-6)}
#updater.show{display:flex}
#updater .in{
  background:var(--brand);color:var(--on-brand);border-radius:var(--r-5);
  padding:var(--sp-5) var(--sp-6);display:flex;align-items:center;gap:var(--sp-5);
  box-shadow:var(--shadow-lg);font-size:var(--fs-3);font-weight:500;
  max-width:520px;width:100%}
#updater button{background:var(--on-brand);color:var(--brand);border:0;cursor:pointer;
  border-radius:var(--radius-sm);padding:var(--sp-4) var(--sp-6);font-weight:500;
  min-height:44px}
/*  ⛔ שני המיכלים חולקים כלל אחד — ⚠️ המודול המשותף מדליק `open` בשניהם:
 *  ⭐ מחלקה אחרת בגיליון היא דיאלוג שאינו נפתח, ⛔ ובלי שדבר מודיע. */
.veil{position:fixed;inset:0;z-index:var(--z-4);background:var(--veil);
  display:none;align-items:center;justify-content:center;padding:var(--sp-6)}
.veil.open{display:flex}
.veil .box{background:var(--card);border-radius:var(--radius);width:100%;
  max-width:420px;box-shadow:var(--shadow-lg);overflow:hidden}
.veil .hd{padding:var(--sp-6);font-size:var(--fs-5);font-weight:500;
  border-bottom:1px solid var(--border)}
.veil .bd{padding:var(--sp-6);font-size:var(--fs-4);color:var(--text2)}
.veil .ft{padding:var(--sp-6);display:flex;gap:var(--sp-4);justify-content:flex-end;
  border-top:1px solid var(--border)}


/* ═══ שכבת הטוסט — מודול משותף (סבב 87ב) ════════════════════════════════════
   זהה בית-לבית בכל האפליקציות. ⛔ שני סיווגי המצב נשענים על אסימוני
   המצב — ⚠️ צמד הפוך שמתחלף יחד, ⭐ והנייטרלי כתוב במפורש: אין לו מצב.
   ⛔ מיכל אחד ובתוכו `div` לכל הודעה — ⚠️ הנימוק המדוד: בשלוש מהן היה
      אלמנט **קבוע** אחד, ⛔ והודעה שנייה דרסה את הראשונה: ⭐ «נשמר»
      ו«שגיאת רשת» ברצף השאירו על המסך אחת בלבד.
   ⛔ ו-`--toast-bottom` הוא הערך היחיד שנבדל — ⚠️ לשתיים מהן יש סרגל
      תחתון קבוע, ⭐ ולטוסט שיושב מתחתיו אין מי שיראה אותו. */
#toasts{position:fixed;inset-inline:0;bottom:calc(var(--toast-bottom) + env(safe-area-inset-bottom));z-index:var(--z-5);display:grid;gap:var(--sp-4);justify-items:center;pointer-events:none;padding:0 var(--sp-6)}
.toast{background:var(--chip);color:var(--on-chip);border-radius:var(--r-6);padding:var(--sp-5) var(--sp-7);font-size:var(--fs-3);font-weight:600;line-height:var(--lh-3);box-shadow:0 6px 20px var(--sh-2);max-width:92vw;text-align:center;animation:toastUp var(--dur-3) ease-out}
.toast.bad{background:var(--bad);color:var(--bad-soft)}
.toast.good{background:var(--ok);color:var(--ok-soft)}
@keyframes toastUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ═══ סוף CSS שכבת הטוסט ════════════════════════════════════════════════ */

/* ═══ CSS גרף העמודות — מודול משותף (סבב 137) ═══════════════════════════════
   ⛔ הצגה חזותית של סדרה נבנית מרוחב יחסי ⛔ ולא מספריית גרפים — ⚠️ ספרייה
      כזו היא מאות קילובייטים בכל עלייה, ⭐ והנתון עצמו הוא שתי מנות לשורה.
   ⛔ הצבעים מהאסימונים ⛔ ואין כאן ליטרל — ⚠️ `--brand` למה שנגבה,
      ⭐ ו-`--card-2` למסלול שמאחוריו: ⛔ ליטרל מוטבע כאן היה נשאר בהיר
      במצב כהה, ⚠️ ומבטל את הזהות הפר-אפליקציה.
   ⛔ ופס היעד הוא **אותו** אסימון בשקיפות — ⚠️ אסימון שני היה תפקיד שני
      לצבע קיים, ⭐ והשורה על תפקיד אחד לאסימון אוסרת אותו. */
.bchart{display:grid;gap:var(--sp-4);padding:var(--sp-2) 0}
.brow{display:grid;grid-template-columns:4.6rem 1fr 4.4rem;align-items:center;gap:var(--sp-4);font-size:var(--fs-3)}
.blab{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbars{display:grid;gap:var(--sp-2)}
.btrack{display:block;height:8px;border-radius:var(--r-6);background:var(--card-2);overflow:hidden}
.btrack i{display:block;height:100%;border-radius:var(--r-6);background:var(--brand)}
.btrack.tgt{height:4px}
.btrack.tgt i{opacity:var(--op-2)}
.bval{color:var(--text2);text-align:end;white-space:nowrap}
/* ═══ סוף CSS גרף העמודות ════════════════════════════════════════════════ */

/* ===================================================================== פסים */
/*  ⛔ הגוון פר-אפליקציה נכתב **אחרי** הבלוק החתום — ⚠️ שני הכללים באותה
 *  סגוליות, ⭐ והמאוחר גובר: ⛔ גוון שנכתב לפניו אינו חל כלל. */
.btrack{background:var(--purple-1)}
.btrack i{transition:width var(--dur-4) var(--ease)}
.btrack.peach{background:var(--peach-1)}
.btrack.peach i{background:var(--peach-2)}

@media (prefers-reduced-motion:reduce){
  .btrack i{transition:none}
  .conf{display:none}
}

/* ═══ סולמות הערך החזותי — מודול משותף (סבב 141) ═════════════════════════
   ⛔ שמונה סולמות, ⛔ ואותן דרגות בכל האפליקציות — ⚠️ כל ערך חזותי
      נגזר מהם ⛔ ואינו נבחר לכל אתר בנפרד: ⭐ ערך שנבחר באתר הוא סולם שלא
      הוגדר, ⛔ ושני אתרים שנבדלים בפיקסל אחד הם שני ערכים שאיש לא הכריע
      ביניהם.
   ⛔ **ומספר הדרגות נגזר מהערכים שהיו בפועל** ⛔ ואינו נבחר — ⚠️ אשכול

/* ═══ משיכה מסוננת בשרת — מודול משותף (סבב 87) ════════════════════════════
   ⛔ מסך מושך **רק את החלון שהוא מציג** — ⚠️ הנימוק המדוד: מסך ההשגחה מציג
      חודש עברי אחד ⛔ ומשך **18,085 סימונים** בכל כניסה אליו, ⭐ ואת כולם
      סינן בדפדפן. ⛔ סינון שרץ אחרי ההורדה אינו חוסך דבר — ⚠️ הרשת כבר
      שילמה, ⭐ והמסך ממתין לה.
   ⛔ שלושה מסלולים מושכים **מלא**, ⛔ ואין לצמצם אותם — ⚠️ הסנכרון והמיזוג,
      שמנוע ההכרעה שלו חייב את כל הרשומות ⛔ אחרת «אין אצלי» נקרא «נמחקה» ·
      הגיבוי היומי, ⛔ שמגבה טבלה ולא חלון · והחלון החם, ⚠️ שהוא מנגנון
      פינוי נפרד. ⭐ ולכן `win` הוא פרמטר **אופציונלי** — ⛔ מי שאינו מעביר
      אותו מקבל בדיוק את ההתנהגות הקודמת.
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.

      ⭐ וכל עמוד חייב אחד טרי משלו.
   ⛔ שליפה בעמודים ולא בבקשה אחת — ⚠️ גוף תשובה שגדל עם הנתונים נחתך,
      ⛔ ו-PostgREST יודע להגביל את מספר השורות (`db-max-rows`): ⭐ ביום
      שיוגדר, התשובה תיחתך **בשקט**. ⛔ ותשובה חלקית שנראית שלמה גרועה
      מ«אין ראיה» — ⚠️ ולכן עמוד שנכשל מחזיר `null` ⛔ ולא את מה שהספיק.
   ⛔ ותקרת בטיחות ללולאה שתלויה בגודל התשובה — ⚠️ מסד שמחזיר עמוד מלא

  var out = [], from = 0;

    var q = mkQuery();
    if (win && win.col) {
      if (win.from) q = q.gte(win.col, win.from);
      if (win.to) q = q.lte(win.col, win.to);
    }
    if (order) q = q.order(order, { ascending: true });
    var res = await withTimeout(q.range(from, from + YS_ROWS_PAGE - 1));
    if (!res || res.error || !Array.isArray(res.data)) return null;
    out = out.concat(res.data);
    if (res.data.length < YS_ROWS_PAGE) return out;
    from += YS_ROWS_PAGE;
    if (from > YS_ROWS_CAP) return out;

}
/* ═══════════════ סוף מודול משיכה מסוננת בשרת ═══════════════════════════ */

/* ═══ שער מצב הרשת — מודול משותף (סבב 84) ═════════════════════════════════
   ⛔ מודול נפרד ⛔ ולא חלק מעוזרי הרשת — ⚠️ הוא חי בחלק מהאפליקציות ואינו
      קיים בכולן, ⭐ ובלוק אחד לשתי רמות קיום הוא בלוק שאינו זהה.
   ⛔ **ובמי שאין בה הוא מוצהר חסר ומנומק** — ⚠️ שם ארבעה אתרים שומרים על מצב
      הרשת בהודעה **ייעודית** לכתיבת משתמש, ⛔ והודעה כללית במקומה הייתה
      מוחקת בדיוק את מה שהמשתמש צריך לדעת.
   ⛔ שינוי כאן — שלוש האפליקציות **ושלושת עותקי השער**, באותו סבב.
   ═══════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════════
   עמידות אחסון מקומי — מודול משותף (סבב 11).
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════════ */

var LS_QUOTA_BYTES = 5 * 1024 * 1024;   // מכסת origin טיפוסית

var LS_SWEEP_TO    = 0.45;              // יעד הפינוי היזום
var LS_LOG_MAX     = 12;                // אורך יומן הפינוי הנשמר

// נוסח אחיד בכל האפליקציות. סמלים: ✅ הצלחה / ⚠️ אזהרה / ❌ שגיאה, בתחילה.
var MSG_LS_FULL   = '❌ האחסון במכשיר מלא — לא ניתן לשמור. התחברו לרשת כדי שהנתונים יסונכרנו והמקום יתפנה.';
var MSG_LS_BLOCK  = '❌ האחסון במכשיר חסום — לא ניתן לשמור במכשיר.';
var MSG_LS_WARN   = '⚠️ האחסון המקומי מתמלא — התחברו לרשת, והמקום יתפנה מעצמו';
var MSG_LS_CRIT   = '⚠️ האחסון המקומי כמעט מלא — התחברו לרשת כדי שהמקום יתפנה';
var MSG_LS_RESTORED = '✅ האחסון התפנה — הנתונים הישנים חוזרים בסנכרון הזה';
var MSG_LS_PRUNED = '⚠️ נתונים ישנים פונו מהמכשיר מחוסר מקום — הם שמורים בענן ויחזרו כשתהיה רשת';

// כל האפליקציות שחולקות את ה-origin. הקידומת היא מה שמזהה מי תופס מה.
var LS_APPS = [
  { id: 'hanhala', name: 'הנהלה רוחנית', pre: ['ys_'] },
  { id: 'schar',   name: 'שכר לימוד',    pre: ['sl_'] },
  { id: 'yoman',   name: 'יומן עבודה',   pre: ['tb_'] },
  { id: 'gius',    name: 'גיוס',         pre: ['g_', 'gius'] }

function lsFmtBytes(n) {

// UTF-16: שני בתים לתו, גם למפתח וגם לערך. הערכה, לא מדידה מדויקת — אבל
// עקבית, וזה מה שנדרש כדי להשוות מול הסף.

// מדידת **כל** המפתחות בדומיין, לא רק של האפליקציה הנוכחית — זה כל העניין:
// המכסה משותפת, ולכן אפליקציה שמסתכלת רק על עצמה לא רואה את מה שחונק אותה.

  var out = { total: 0, quota: LS_QUOTA_BYTES, free: 0, pct: 0, apps: [], keys: [], ok: true };
  var byApp = {}, i;
  for (i = 0; i < LS_APPS.length; i++) byApp[LS_APPS[i].id] = { id: LS_APPS[i].id, name: LS_APPS[i].name, bytes: 0, count: 0 };
  byApp.other = { id: 'other', name: 'אחר', bytes: 0, count: 0 };
  try {
    for (i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);

  Object.keys(byApp).forEach(function (id) { if (byApp[id].count) out.apps.push(byApp[id]); });

/* ── יומן הפינוי ────────────────────────────────────────────────────────
   הפינוי שקט כלפי המשתמש, אבל **לא בלתי נראה** — בלי יומן אי אפשר לדעת
   מתי ומה פונה. נשמר קצר בכוונה (12 רשומות) כדי שהיומן עצמו לא יהפוך

/* ── באנר כישלון קבוע ───────────────────────────────────────────────────
   טוסט נעלם אחרי שלוש שניות; כישלון שמירה חייב להישאר על המסך עד שהמשתמש
   סוגר אותו, אחרת הוא בדיוק "הכישלון השקט" שאנחנו מונעים. */

      'color:var(--on-alert);direction:rtl;text-align:center;font:700 14px/1.6 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;' +
      'padding:12px 46px;box-shadow:0 2px 14px var(--sh-3)';

/* ── כתיבה מוגנת ────────────────────────────────────────────────────────
   **כל כתיבה ל-localStorage באפליקציה עוברת דרך כאן.** אין קריאה ישירה
   ל-`localStorage.setItem` מחוץ למודול הזה (למעט `lsSetRaw` שבתוכו).
   מחזירה true/false — ומסלול קריטי שמתעלם מהערך המוחזר הוא באג. */

/* "אף כישלון שקט" — מונה כישלונות גלובלי.
   מסלול קריטי (רישום נוכחות, שמירת תשלום, הוספת רשומה, רישום תנועה) עוטף את

   ורק אז מציג "נשמר". כך גם כתיבה שנכשלה עמוק בתוך שרשרת async מונעת את טוסט

var _lsFailCount = 0;
function lsFails() { return _lsFailCount; }
function lsOkSince(n) { return _lsFailCount === n; }

/* ── שער "אין טוסט הצלחה אחרי כישלון שמירה" ─────────────────────────────
   נקודת אכיפה **אחת** במקום עשרות בדיקות פזורות שאפשר לשכוח באחת: `toast()`
   של כל אפליקציה פותחת ב-`if (!lsGuardToast(msg)) return;`, וכל הודעה
   שמתחילה ב-✅ נבלעת אם כתיבה מקומית נכשלה בשתי וחצי השניות האחרונות —
   כלומר בתוך אותה פעולת משתמש. הבאנר האדום כבר על המסך, והוא ההודעה
   הנכונה. **אין להסיר את השורה הזו מ-`toast`** — בלעדיה חוזר בדיוק המצב
   שהסבב הזה בא למנוע: כתיבה שנכשלה ומשתמש שמקבל "נשמר בהצלחה". */

      var need = lsEntryBytes(key, v) + 64 * 1024;

        // יציג "נשמר", שהרי הנתון באמת נשמר.
        try { localStorage.setItem(key, v); _lsFailCount--; _lsLastFailAt = 0; lsLog('כתיבה חוזרת הצליחה', key, 0); return true; }

// הבאנר אידמפוטנטי ולכן מוצג בכל כישלון; הטוסט מווסת כדי שסדרת כתיבות

/* ── אופק הפינוי ────────────────────────────────────────────────────────

/*  ⛔ אופק הפינוי נוקה מהסנכרון — ⚠️ **מה נכנס**: ירידה מתחת לסף האזהרה,

 *  הישן: ⛔ סימן שרק המשתמש יכול לנקות נשאר לנצח ביום שבו הכפתור יורד. */

/* ── פינוי יזום ─────────────────────────────────────────────────────────

/* ── עדות סנכרון חלופית: אימות ישיר מול הענן (סבב 14) ────────────────────

   הענני של אותו מפתח, ורשומה נמחקת רק אם היא נמצאת שם לפי `spec.idOf`
   **וגם** חותמת הענן אינה ישנה מהחותמת המקומית — כלומר הענן מחזיק את
   הגרסה הזו או חדשה ממנה.

      כלל אינו קיים בענן ⇒ לא מפנים דבר. היעדר ראיה אינו ראיה.

      ו-`lsSetArray` מסננת **בכל כתיבה** כל רשומה שחותמתה ≤ hz. דילוג

   ⚠️ **אסינכרוני.** `lsBoot` סינכרונית ורצה לפני שהמסך עולה, ולכן מסלול
      האימות רץ אחריה (`lsBootDeferred`) — וההתרעה נדחית איתו, אחרת
      המשתמש מקבל אזהרה צהובה על מצב שנפתר שתי שניות אחר כך. */

var LS_DEFER_MS = 3000;   // המתנה אחרי העלייה לפני האימות — שהאפליקציה תספיק לעלות

function lsGlobalWitness() {
  try { return Number(LS_CFG.syncedThrough && LS_CFG.syncedThrough()) || 0; } catch (e) { return 0; }
}
/* עֵד הסנכרון של מפתח בודד: משלו אם הוגדר, אחרת הגלובלי. **מפתח שהגדיר

// גריעה ממפתח אחד כשהראיה היא מפת הענן ולא חותמת מקומית.

  try { arr = JSON.parse(raw); } catch (e) { return 0; }
  if (!Array.isArray(arr) || arr.length < 2) return 0;

  if (!cand.length) return 0;
  cand.sort(function (a, b) { return a.t - b.t; });   // הישן ביותר קודם

  var target = want > 0 ? want : Math.max(0, before - Math.floor(before * 0.5));
  var drop = {}, hz = 0, est = 0, kept = arr.length, stopped = '';
  for (i = 0; i < cand.length && est < target && kept > 1; i++) {

    if (!id) { stopped = 'רשומה בלי מזהה'; break; }
    if (!(id in idx)) { stopped = 'רשומה שאינה בענן'; break; }
    if (idx[id] < cand[i].t) { stopped = 'הענן מחזיק גרסה ישנה יותר'; break; }
    var s = '';
    try { s = JSON.stringify(rec) || ''; } catch (e2) { s = ''; }

  var json = JSON.stringify(next);

/* שלב ב בגרסה האסינכרונית: לכל מפתח בלי עֵד מקומי — משיכת העותק הענני

/* ── המסלול הנדחה ───────────────────────────────────────────────────────

  function finish(freed) {
    freed = Number(freed) || 0;

    if (freed > 0) lsLog('פינוי נדחה הסתיים', lsFmtBytes(freed) + ' · נותרו ' + Math.round(u.pct * 100) + '%', freed);

/* ── בדיקת העלייה ───────────────────────────────────────────────────────
   נקראת פעם אחת בכל עליית אפליקציה, לפני שהמשתמש מספיק לכתוב משהו.
   **סינכרונית בכוונה** — היא חייבת לרוץ לפני הטעינה. כשיש מפתחות שניתן

function _bkSecrets() {
  var s = _bkCfg('secrets', []);
  return Array.isArray(s) ? s : [];
}

function bkToday() { return new Date().toISOString().slice(0, 10); }

// חתימת תוכן לגיבוי הדיפרנציאלי — אורך + FNV-1a. אינה סוד ואינה אימות,
// רק "האם זה אותו ערך בדיוק".
function bkSig(s) {
  var str = String(s == null ? '' : s), h = 0x811c9dc5;
  for (var i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return str.length + ':' + h.toString(16);
}

/* ── יומן הפעולות ──────────────────────────────────────────────────────── */
function _bkLogRow(action, key, count, details) {
  return {
    device_id: _bkCfg('device', null),
    user_name: _bkCfg('user', null),
    action: action,
    key: key || null,
    record_count: (count === undefined || count === null) ? null : count,
    details: details || null
  };
}
/*  ⛔ כשל כתיבה נרשם ואינו נבלע (סבב 79) — ⚠️ הכתיבה נכשלת כפי שנכשלה,
 *  אבל היא מפסיקה להיות שקטה: ⭐ `catch` ריק סביב כתיבה הוא בדיוק המצב
 *  שבו נתון נעלם ואיש אינו יודע. ⛔ והרישום אינו משנה את הזרימה — ⚠️ תיעוד
 *  אבחון שמפיל שמירה גרוע מהיעדרו. */
function _bkWriteFail(where, e) {
  try { console.warn('[write-fail] ' + where, (e && e.message) ? e.message : e); } catch (e0) { }
}
function _bkLogQueue(row) {
  try {
    var qk = _bkVal(BK_CFG.logQueueKey);
    var q = JSON.parse(lsGet(qk, '[]') || '[]');
    if (!Array.isArray(q)) q = [];
    q.push(row);
    if (q.length > BK_LOG_MAX) q = q.slice(-BK_LOG_MAX);
    lsSet(qk, JSON.stringify(q));
  } catch (e) { _bkWriteFail('_bkLogQueue', e); }
}
// רישום fire-and-forget. ⛔ לעולם אינו חוסם ואינו מפיל את המסלול שקרא לו
// (נרשם בסבב 6) — תיעוד אבחון שמפיל כניסה או שמירה גרוע מהיעדרו.
function logAction(action, key, count, details) {
  var row = null;
  try {
    row = _bkLogRow(action, key, count, details);
    var c = _bkClient();
    if (!c) { _bkLogQueue(row); return; }
    c.from(BK_LOG_TABLE).insert(row).then(
      function (r) { if (r && r.error) _bkLogQueue(row); },
      function () { _bkLogQueue(row); }
    );
  } catch (e) { if (row) _bkLogQueue(row); }
}
// שליחת מה שהצטבר באופליין. נקראת כשיש ראיה שהרשת עובדת.
async function logFlush() {
  var qk, q;
  try { qk = _bkVal(BK_CFG.logQueueKey); q = JSON.parse(lsGet(qk, '[]') || '[]'); } catch (e) { return 0; }
  if (!Array.isArray(q) || !q.length) return 0;
  var c = _bkClient();
  if (!c) return 0;
  lsSet(qk, '[]');
  var failed = [], sent = 0;
  for (var i = 0; i < q.length; i++) {
    try {
      var r = await c.from(BK_LOG_TABLE).insert(q[i]);
      if (r && r.error) failed.push(q[i]); else sent++;
    } catch (e2) { failed.push(q[i]); }
  }
  if (failed.length) {
    try {
      var q2 = JSON.parse(lsGet(qk, '[]') || '[]');
      if (!Array.isArray(q2)) q2 = [];
      lsSet(qk, JSON.stringify(q2.concat(failed).slice(-BK_LOG_MAX)));
    } catch (e3) { _bkWriteFail('logFlush', e3); }
  }
  return sent;
}

/*  ⛔⛔ שלוש שכבות הגיבוי (סבב 87ג) — ⭐ **עוגן** מלא אחת לשבוע, ⚠️ **דיפ**
 *  בכל שאר הימים (רק שורות שהחותמת שלהן חדשה מהעוגן), ⛔ **והפינוי הקיים**
 *  אוכף את התקרות. ⚠️ הנימוק המדוד: גיבוי מלא בכל לילה של טבלה בת עשרות
 *  אלפי שורות הוא מגה-בייטים ביום, ⭐ ועוגן שבועי ודיפים קטנים נותנים את
 *  אותה יכולת שחזור בשבריר. */
var BK_ANCHOR_MS = 7 * 24 * 60 * 60 * 1000;
var BK_ANCHOR_PREFIX = 'ANCHOR:';
var BK_DIFF_PREFIX = 'DIFF:';
/*  ⛔ חותמת המים של העוגן — ⚠️ נשמרת כמחרוזת, ⭐ ומושווית בשרת בטיפוס
 *  העמודה: ⛔ `bigint` ו-`timestamptz` שניהם עוברים ב-`gte` כמות שהם. */
function _bkMarkKey(bkey) { return 'bk_wm_' + bkey; }
function _bkSetMark(bkey, v) {
  if (v == null) return;
  lsSet(_bkMarkKey(bkey), String(v));
  lsSet('bk_anch_' + bkey, String(Date.now()));
}
/*  ⛔ המקסימום נגזר מהשורות ⛔ ואינו נשאל מהשרת — ⚠️ מספר מושווה מספרית
 *  ומחרוזת לקסיקוגרפית: ⭐ חותמת ISO ממוינת נכון כמחרוזת, ⛔ ו-`bigint`
 *  היה נשבר בהשוואת מחרוזות. */
function _bkMaxTs(rows, col) {
  var mx = null;
  for (var i = 0; i < rows.length; i++) {
    var v = rows[i] ? rows[i][col] : null;
    if (v == null) continue;
    if (mx === null) { mx = v; continue; }
    if (typeof v === 'number' ? v > mx : String(v) > String(mx)) mx = v;
  }
  return mx;
}
/*  ⛔ איזו שכבה רצה היום — ⚠️ עוגן כשאין חותמת מים, כשאין חותמת עוגן,
 *  או כשעברו שבעה ימים; ⭐ ובכל שאר הימים דיפ מעל חותמת המים. */
function _bkLayer(bkey, s) {
  var wm = lsGet(_bkMarkKey(bkey), '');
  var at = parseInt(lsGet('bk_anch_' + bkey, '0'), 10) || 0;
  if (!s || !s.ts || !wm || !at || (Date.now() - at) >= BK_ANCHOR_MS)
    return { diff: false, prefix: BK_ANCHOR_PREFIX, key: bkey, win: null };
  return { diff: true, prefix: BK_DIFF_PREFIX, key: bkey,
           win: { col: s.ts, from: wm } };
}
/*  ⛔⛔ הקריאה בעימוד, ⛔ ואימות מול מונה השרת — ⚠️ תשובה שנחתכה נראית
 *  בדיוק כמו תשובה שלמה, ⭐ והדרך היחידה לדעת היא לשאול את השרת כמה שורות
 *  יש: ⛔ אי-התאמה מחזירה `null` ⛔ ונכשלת בקול, ⚠️ ואינה שומרת חצי גיבוי. */
async function _bkReadRows(c, s, win) {
  var sel = s.cols || '*';
  var rows = await _ysRowsPaged(function () {
    var q = c.from(s.name).select(sel);
    if (s.eq) q = q.eq(s.eq[0], s.eq[1]);
    return q;
  }, s.order || null, win);
  if (!rows) return null;
  try {
    var cq = c.from(s.name).select(sel, { count: 'exact', head: true });
    if (s.eq) cq = cq.eq(s.eq[0], s.eq[1]);
    if (win && win.col) {
      if (win.from) cq = cq.gte(win.col, win.from);
      if (win.to) cq = cq.lte(win.col, win.to);
    }
    var cr = await withTimeout(cq);
    if (!cr || cr.error || typeof cr.count !== 'number') return null;
    if (cr.count !== rows.length) {
      console.error('[bk] הגיבוי נחתך — ' + s.name + ': נמדדו ' + rows.length +
                    ' שורות והשרת מדווח ' + cr.count);
      return null;
    }
  } catch (e) { return null; }
  return rows;
}
/* ── הגיבוי היומי ──────────────────────────────────────────────────────── */
// מחזירה true רק כשכל המקורות גובו (או דולגו כבלתי-משתנים) בהצלחה.
async function bkMaybeDaily() {
  if (_bkRunning) return false;
  var c = _bkClient();
  if (!c) return false;
  var flag = _bkCfg('flagKey', null);
  if (!flag) return false;
  var today = bkToday();
  if (lsGet(flag, '') === today) return false;
  var src = _bkCfg('sources', []) || [];
  if (!src.length) return false;
  _bkRunning = true;
  var ok = true, wrote = 0, same = 0, failed = [];
  try {
    var pre = _bkCfg('prefix', '') || '';
    var secrets = _bkSecrets(), dailyKeys = [];
    for (var i = 0; i < src.length; i++) {
      var s = src[i], val = null;
      // ⛔ מפתח שברשימת הסודות אינו נכתב לגיבוי לעולם (השלמת סבב 35) —
      //    admin_pass שרד בגיבויים אחרי שנמחק מהמקור, ונוקה ידנית.
      if (s.kind === 'kv' && secrets.indexOf(s.name) !== -1) continue;
      // ⭐ `key` פר-מקור (סבב 35) — מקור-טבלה שמפתחו היה מתנגש במקור
      //    ה-kv ההיסטורי באותו שם מקבל מפתח גיבוי משלו. הרשימה שנצברת
      //    כאן היא רשימת-ההיתר של הגריעה — בלי תלות בהצלחת המקור.
      var bkey = pre + (s.key || s.name);
      dailyKeys.push(bkey);
      /*  ⛔ שתי השכבות נכנסות לרשימת-ההיתר של הגריעה (סבב 87ג) — ⚠️ מפתח
       *  שאינו שם אינו מתפנה לעולם, ⭐ ו-`ANCHOR:`/`DIFF:` הם מפתחות
       *  חדשים: ⛔ בלעדיהם הם היו נצברים בלי גבול. */
      if (s.kind !== 'kv') {
        dailyKeys.push(BK_ANCHOR_PREFIX + bkey);
        dailyKeys.push(BK_DIFF_PREFIX + bkey);
      }
      /* ⭐ דגל-יום פר-מקור (סבב 62) — מקור שכבר גובה היום מדולג, גם
         כשהדגל הגלובלי לא נכתב. ⛔ בלעדיו מקור אחד שנכשל החזיק את כל
         השאר בלולאה: הדגל הגלובלי נכתב רק כשכולם הצליחו, ולכן כל עלייה
         גיבתה מחדש את מה שכבר גובה, שוב ושוב באותו יום.
         ⚠️ הדחיפה ל-`dailyKeys` קודמת לדילוג בכוונה: הרשימה היא
         רשימת-ההיתר של הגריעה, ומפתח שנופל ממנה אינו מתפנה לעולם. */
      var dayKey = 'bk_day_' + bkey;
      if (lsGet(dayKey, '') === today) { same++; continue; }
      if (s.kind === 'kv') {
        var res = await c.from(s.table).select('value').eq('key', s.name).maybeSingle();
        if (!res || res.error) { ok = false; failed.push(bkey); continue; }
        val = (res.data && res.data.value != null) ? String(res.data.value) : null;
      } else {
        /*  ⛔⛔ שכבת הגיבוי — עוגן שבועי מלא, ודיפרנציאלי בכל שאר הימים
         *  (סבב 87ג): ⚠️ הנימוק המדוד — הקריאה הייתה בקשה **אחת** בלי
         *  עימוד, ⛔ ו-Supabase מחזיר 1,000 שורות כברירת מחדל **בלי
         *  שגיאה**: ⭐ טבלה גדולה מהתקרה גובתה עד התקרה, ⛔ וכל השאר
         *  מעולם לא גובה — ⚠️ והכשל היה שקט לחלוטין. */
        var layer = _bkLayer(bkey, s);
        var rows = await _bkReadRows(c, s, layer.win);
        if (rows === null) { ok = false; failed.push(bkey); continue; }
        bkey = layer.prefix + bkey;
        // ⛔ שדה-סוד בשורות טבלה מסונן לפני הסריאליזציה (השלמת סבב 35) —
        //    שורה שמפתחה (`secretField`, ברירת מחדל `key`) ברשימת הסודות
        //    אינה מגיעה לגיבוי, גם כשהיא עדיין קיימת במקור.
        if (secrets.length) rows = rows.filter(function (r) {
          return secrets.indexOf(r && r[s.secretField || 'key']) === -1;
        });
        /*  ⛔ דיפרנציאלי ריק אינו נכתב ⛔ ואינו כישלון — ⚠️ יום שלא השתנה
         *  בו דבר הוא המצב הרגיל, ⭐ ועותק ריק בכל לילה מציף את הפינוי. */
        if (layer.diff && !rows.length) { same++; continue; }
        val = JSON.stringify(rows);
        if (!layer.diff && s.ts) _bkSetMark(layer.key, _bkMaxTs(rows, s.ts));
      }
      // מקור שאין לו ערך בענן — אין מה לגבות, וזה אינו כישלון.
      if (val == null) continue;
      var sig = bkSig(val), sigKey = 'bk_sig_' + bkey;
      if (lsGet(sigKey, '') === sig) { same++; continue; }
      var ins = await c.from(BK_TABLE).insert({ key: bkey, value: val });
      if (!ins || ins.error) { ok = false; failed.push(bkey); continue; }
      lsSet(sigKey, sig);
      lsSet(dayKey, today);
      wrote++;
    }
    /* ⭐ הגריעה אינה מותנית עוד בהצלחת **כל** המקורות (סבב 62) — היא רצה
       על רשימת-ההיתר המלאה בכל פעם שנכתב עותק חדש. ⛔ הכריכה הישנה היא
       ששיתקה אותה: מקור אחד שנכשל מנע גריעה של כל השאר, וזה שורש מצבור
       ה-503 השורות שנוקה ב-26.8. ⚠️ והיא עדיין רצה **אחרי** הכתיבה, כדי
       שלא ייגרע עותק ישן לפני שהחדש נכתב (השלמת סבב 35). */
    if (wrote) { try { await _bkRetention(c, dailyKeys); } catch (e2) { } }
    if (ok) {
      lsSet(flag, today);
      logAction('backup', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same });
    } else {
      /* ⛔ בלי כתיבת הדגל הגלובלי — ההזדמנות הבאה באותו יום תנסה שוב
         (נרשם בסבב 6): גיבוי שנכשל ודילג על יממה שלמה הוא בדיוק
         מה שהדגל שנכתב-מראש גרם. ⚠️ ומה שכן השתנה (סבב 62): המקורות
         שהצליחו נושאים דגל-יום משלהם ואינם נגבים שוב, ולכן הניסיון החוזר
         מכוון למי שנכשל בלבד. ⛔ וכשל חלקי מדווח ואינו נבלע — `failed`
         נושא את שמות המקורות, אחרת «נכשל» היה מספר בלי מען. */
      logAction('backup_fail', null, wrote, { date: today, scope: pre || null, wrote: wrote, unchanged: same, failed: failed });
      console.warn('[backup] מקורות שנכשלו: ' + (failed.join(', ') || '?') + ' — ייבחנו שוב בהזדמנות הבאה');
    }
  } catch (e) { ok = false; }
  _bkRunning = false;
  return ok;
}

/* ── מדיניות השמירה — גריעת עותקים יומיים ישנים מ-30 יום ──────────────── */
// ⛔ הגריעה מוגבלת ב-`in('key', keys)` לרשימת המפתחות היומיים של
//    האפליקציה הנוכחית בלבד (השלמת סבב 35) — רשימת-היתר, לא קידומת:
//    גיבויי `PRE_*` וגיבויים של אפליקציה אחרת אינם מועמדים כלל.
// ⚠️ נכשלת סגור: `error` (כולל היעדר הרשאת DELETE — סבב 29) מוחזר כאפס
//    בשקט, בלי להפיל את הגיבוי ובלי רישום-סרק יומי ליומן הראיות.
async function _bkRetention(c, keys) {
  if (!c || !Array.isArray(keys) || !keys.length) return 0;
  var cutoff = new Date(Date.now() - BK_RETENTION_DAYS * 86400000).toISOString();
  var del = await c.from(BK_TABLE)['delete']().in('key', keys).lt('created_at', cutoff).select('id');
  if (!del || del.error || !Array.isArray(del.data)) return 0;
  var n = del.data.length;
  if (n > 0) logAction('retention', null, n, { days: BK_RETENTION_DAYS, keys: keys.length });
  return n;
}


/* ── נקודת ההפעלה היחידה ─────────────────────────────────────────────── */
// ⛔ זו הקריאה היחידה שקוד האפליקציה עושה למודול (סבב 30, השלמה) — היא
//    יושבת בפונקציית העלייה, לצד `lsBoot()` ו-`pendBoot()`, ולעולם לא
//    במסלול דחיפה/סנכרון. ר' הנימוק המלא בכותרת הבלוק.
// ⚠️ שתי הקריאות אינן ב-`await` ואינן חוסמות: העלייה אינה ממתינה לרשת,
//    וכל כשל נבלע בשקט בתוך המודול.
function bkBoot() {
  try { bkMaybeDaily(); } catch (e) { }
  try { logFlush(); } catch (e) { }
}
window.bkBoot = bkBoot;
/* ═══════════════ סוף מודול הגיבוי היומי ═══════════════════════════════ */

/* ═══ ממתין לסנכרון — מודול משותף (סבב 12) ═══════════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PEND_LATE_MS = 24 * 60 * 60 * 1000;   // סף ההתרעה
var PEND_MAX = 800;                       // תקרת המפה — הגנה מפני צמיחה בלי גבול
var _pendMap = null;
var _pendAlertDismissed = 0;

/* ---------------------------------------------- השהיית ציור (סבב 16) ----
   באונליין תקין האישור מגיע תוך פחות משתי שניות מהסימון, והתגית והסרגל היו
   מהבהבים לשבריר שנייה על כל שמירה. לכן סימון שנוצר **הרגע** בכתיבה חדשה
   מקבל "החזקת ציור" בזיכרון: אם האישור הגיע בתוך PEND_DRAW_DELAY_MS —
   ה-⏳ לא מופיע כלל; אם לא — הוא מופיע וממשיך להתנהג בדיוק כמו היום.
   ⚠️ ההשהיה היא על ה**ציור בלבד**: הסימון הלוגי נכתב ל-localStorage מיידית
   (מנגנוני הבטיחות — פינוי, דחיפה, מיגרציות — נשענים עליו), מסך ההגדרות
   (pendStatusHTML) והמונים הלוגיים (pendCount/pendHas/pendSince) אינם
   מושהים לעולם, וההחזקה חיה **בזיכרון בלבד** — סימון שנטען מהדיסק בעליית
   האפליקציה (המכשיר נסגר בתוך שתי השניות) מצויר מיד. */
var PEND_DRAW_DELAY_MS = 2000;
var _pendDrawHold = {};     // key -> הרגע שממנו מותר לצייר (זיכרון בלבד, לא נשמר)

function pendHoldDraw(key, now) {
  _pendDrawHold[key] = (now || Date.now()) + PEND_DRAW_DELAY_MS;
}

/* ═══ מזהי רשומות — מודול משותף (סבב 37א) ═════════════════════════════════

/* ═══════════════ סוף מודול הניסיון החוזר ════════════════════════════════ */

/* ═══ שומר ההקשר — מודול משותף (סבב 109) ══════════════════════════════════
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ מחזור «קרא ← מזג ← דחוף» נפתח בהקשר אחד ⛔ ואינו רשאי לכתוב באחר —
      ⚠️ בין ה-`await` הראשון לאחרון ההקשר יכול להתחלף, ⭐ ומאותו רגע
      הגלובלים מצביעים על החדש והזיכרון עדיין מחזיק את הישן: ⛔ כל כתיבה
      שאחריו כותבת את נתוני ההקשר הקודם תחת החדש, ⚠️ וכל רישום הצלחה נזקף
      לחשבון הלא נכון — ⭐ ועֵד פינוי כזה מתיר למחוק מהדיסק רשומה שמעולם
      לא עלתה.
   ⛔ **המונה ⛔ ולא שם ההקשר** — ⚠️ החלפה הלוך-ושוב מחזירה את אותו שם,
      ⭐ והזיכרון בינתיים כבר הוחלף: ⛔ שוויון שמות אינו שוויון הקשר.
   ⛔ **ומה נלכד מוצהר פר-אפליקציה** ⛔ ואינו כאן — ⚠️ באפליקציה רב-מוסדית
      זה המוסד, ⭐ ובשאר המשתמש המחובר: ⛔ המנגנון אחד ⚠️ והנלכד נבדל.
   ═══════════════════════════════════════════════════════════════════════ */
var _ctxEpoch = 0;
function ctxEpoch() { return _ctxEpoch; }
/*  ⛔ נקודת הקידום היחידה — ⚠️ כל מסלול שמחליף הקשר קורא לה **לפני**
 *  הטעינה החדשה: ⭐ קידום שאחרי הטעינה משאיר את המחזור שרץ עכשיו סבור
 *  שהוא עדיין בהקשר שלו, ⛔ והכתיבה שלו נזקפת לחשבון החדש. */
function ctxSwitch() { _ctxEpoch++; return _ctxEpoch; }
/*  ⛔ «האם ההקשר התחלף מאז שהתחלתי» — ⚠️ הקורא לוכד את הערך בכניסה
 *  ⛔ ומוסר אותו כאן, ⭐ ואינו קורא את הגלובלי פעמיים. */
function ctxStale(ep) { return ep !== _ctxEpoch; }
/* ═══════════════ סוף שומר ההקשר ═════════════════════════════════════════ */

/* ═══ מנגנון המשיכה — מודול משותף (סבב 51) ════════════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ═══════════════════════════════════════════════════════════════════════ */
var PL_FALLBACK_MS = 60000;   // אין שורת חותמת בענן ⇒ משיכה מלאה אחת לדקה
var _plTimer = null, _plBusy = false, _plFullAt = 0, _plWired = false;

/* חותמת מהענן: מספר, מחרוזת JSON של מספר, או כל דבר אחר ⇒ 0. */
function plNum(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return Math.floor(v) || 0;
  try { var p = JSON.parse(v); if (typeof p === 'number') return Math.floor(p) || 0; } catch (e) { }
  return parseInt(v, 10) || 0;
}

function plBusy() { return _plBusy; }
function _plSeen() { try { return plNum(PL_CFG.seen()); } catch (e) { return 0; } }
function plState() { return { busy: _plBusy, armed: !!_plTimer, fullAt: _plFullAt, seen: _plSeen() }; }

/* ⭐ נקראת אחרי כל כתיבה מוצלחת לענן. היא מקדמת קודם את «מה שכבר נראה»
   מקומית — כדי שהתקתוק הבא לא ימשוך מלא בגלל השינוי של המכשיר הזה
   עצמו — ורק אז כותבת את החותמת לענן. ⛔ כשל בכתיבת החותמת אינו מפיל
   את הכתיבה שקדמה לה (סבב 51) — הנתון כבר בענן, והמכשירים האחרים
   יראו אותו בשינוי הבא או בנפילה-חזרה. */
function plTouch(ts) {
  var t = plNum(ts) || Date.now();
  try { PL_CFG.note(t); } catch (e) { }
  try {
    return Promise.resolve(PL_CFG.stamp(t)).then(function () { return t; }, function () { return t; });
  } catch (e) { return Promise.resolve(t); }
}

function _plFull() {
  var done = function (v) { _plBusy = false; return v; };
  /*  ⛔ שחרור האופק **לפני** המשיכה ⛔ ולא אחריה — ⚠️ הניקוי הוא שמתיר
   *  לכתיבה שבסופה להחזיר את הישן, ⭐ וניקוי שאחריה ממתין למשיכה הבאה. */
  try { lsHorizonRelease(); } catch (e0) { }
  try {
    return Promise.resolve(PL_CFG.pull()).then(
      function () { _plFullAt = Date.now(); return done(true); },
      function () { return done(false); });
  } catch (e) { return Promise.resolve(done(false)); }
}

function plTick() {
  if (_plBusy) return Promise.resolve(false);
  var live; try { live = !!PL_CFG.active(); } catch (e) { live = false; }
  if (!live) return Promise.resolve(false);
  _plBusy = true;
  var done = function (v) { _plBusy = false; return v; };
  var p;
  try { p = Promise.resolve(PL_CFG.remote()); } catch (e) { p = Promise.reject(e); }
  return p.then(function (r) {
    if (!r || !r.ok) return done(false);
    try { PL_CFG.ok(); } catch (e) { }
    if (r.ts === null || r.ts === undefined) {
      if (Date.now() - _plFullAt >= PL_FALLBACK_MS) return _plFull();
      return done(false);
    }
    var ts = plNum(r.ts);
    if (ts > _plSeen()) { try { PL_CFG.note(ts); } catch (e) { } return _plFull(); }
    return done(false);
  }, function () { return done(false); });

function plStop() { if (_plTimer) { clearInterval(_plTimer); _plTimer = null; } }

function plBoot() {
  if (!_plWired) {
    _plWired = true;
    try { window.addEventListener('online', function () { plTick(); }); }
    catch (e) { console.warn('[pl] wiring', e); }
  }
  if (_plTimer) return false;
  var ms = 0;
  try { ms = parseInt(PL_CFG.every, 10) || 0; } catch (e) { ms = 0; }
  if (!ms) ms = 3000;
  _plTimer = setInterval(function () { plTick(); }, ms);
  plTick();
  return true;
}
/* ═══════════════ סוף מנגנון המשיכה ══════════════════════════════════════ */

/* ═══ שכבת הדחיפה — מודול משותף (סבב 102) ═════════════════════════════════
   ⛔ שלוש שכבות נפרדות — **מנה · טבלה · טבלאות** — ⚠️ וכל אחת פונקציה
      משלה: ⭐ שכבות שמעורבבות בפונקציה אחת אינן ניתנות לחתימה ואינן
      ניתנות למדידה, ⛔ ולכן אותו תפקיד נכתב בצורות נבדלות בלי שאיש מדד.
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: ⚠️ אחרת
      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ המנה היא `PUSH_CFG.chunk` — ⚠️ הדחיפה הראשונה במכשיר נוגעת בכל
      הרשומות, ⭐ ובקשה לשורה היא אלפי בקשות רשת: ⛔ **ומנה שנכשלה נדחפת
      שוב שורה-שורה** — ⚠️ כתיבת מנה היא הכל-או-כלום, ⭐ ושורה פגומה אחת
      חוסמת את כל התקינות שאיתה.
   ⛔ ו«אין ראיה» אינו «אין מה לדחוף» — ⚠️ `dirty` שמחזירה `null` מדלגת על
      הטבלה **בלי לסמן את עֵד הפינוי**, ⭐ ומערך ריק מסמן אותו: ⛔ סימון על
      טבלה שלא נמשכה היה מתיר לפנות מהדיסק רשומה שמעולם לא עלתה. */
var _pushTimer = null;

/*  ⛔ שכבה 1 — **מנה אחת ותו לא** — ⚠️ היא אינה יודעת מה מלוכלך ואינה
 *  נוגעת בסימון ה-⏳: ⭐ כל מה שהיא עושה הוא כתיבה אחת, ⛔ וכשל שלה הוא
 *  זריקה — ⚠️ תשובה שנושאת `error` אינה זורקת מעצמה, ⭐ והבודקת היחידה
 *  שלה היא כאן. */
function pushRow(t, rows) {
  return Promise.resolve(PUSH_CFG.send(t, rows)).then(function (res) {
    if (res && res.error) throw res.error;
    return rows.length;
  });
}

/*  ⛔ שכבה 2 — **טבלה אחת**: המנות, סימוני ה-⏳, ועֵד הדחיפה — ⚠️ «אין ראיה»
 *  אינו הצלחה: ⭐ לא נדחף דבר ⛔ ואין לזקוף זאת כדחיפה שעברה · ⚠️ וכשל רשת
 *  אינו ראיה לכלום ולכן הסימון נשאר וננסה שוב, ⭐ וכשל סמכותי (ולידציה ·
 *  מפתח זר · הרשאה · סכימה) יחזור על עצמו לנצח: ⛔ הסימון יורד כדי לא
 *  להבטיח שליחה חוזרת שלא תקרה, ⚠️ והסיבה נרשמת ואינה נבלעת. */
function pushTable(t, ctx) {
  return Promise.resolve(PUSH_CFG.dirty(t, ctx)).then(function (rows) {
    if (!rows) return { ok: false, still: [], n: 0 };
    if (!rows.length) { PUSH_CFG.mark(t); return { ok: true, still: [], n: 0 }; }
    var still = [], n = 0, bad = 0, i = 0;
    function won(row) {
      var k = PUSH_CFG.key(t, row);
      n++;
      if (k != null) pendClear(k);
    }
    function lost(row, e) {
      var k = PUSH_CFG.key(t, row);
      console.warn('[push] ' + t, e && (e.message || e));
      if (isNetErr(e)) { if (k != null) still.push(k); }
      else { bad++; if (k != null) pendFailed(k); }
    }
    /*  ⛔ הנפילה-חזרה פר-שורה — ⚠️ המנה כולה נדחתה ואיננו יודעים מי בה
     *  פגומה, ⭐ ולכן כל שורה נשלחת לבדה: ⛔ כך הפגומה מבודדת ⚠️ ואינה
     *  חוסמת את התקינות שנשלחו איתה. */
    function solo(part, j) {
      if (j >= part.length) return Promise.resolve();
      var row = part[j];
      return pushRow(t, [row]).then(function () { won(row); },
                                    function (e) { lost(row, e); })
        .then(function () { return solo(part, j + 1); });
    }
    function batch() {
      if (i >= rows.length) return Promise.resolve();
      var part = rows.slice(i, i + PUSH_CFG.chunk);
      i += part.length;
      return pushRow(t, part).then(function () { part.forEach(won); },
                                   function () { return solo(part, 0); })
        .then(batch);
    }
    return batch().then(function () {
      /*  ⭐ «באמת נכתב משהו לענן» נמדד כאן — ⛔ בלי קידום החותמת הדחיפה
       *  נשארת בלתי-נראית לכל מכשיר אחר לנצח: ⚠️ הם מושכים רק כשהיא
       *  מתקדמת. */
      if (n) plTouch();
      /*  ⭐ עֵד הפינוי פר-מפתח — ⛔ רק כשלא נשארה שורה בכשל רשת: ⚠️ «עברנו
       *  על כל המלוכלכות והענן קיבל את כולן» הוא בדיוק התנאי שמתיר לפנות
       *  מהדיסק רשומה ישנה של אותה טבלה. */
      if (!still.length) PUSH_CFG.mark(t);
      return { ok: !still.length && !bad, still: still, n: n };
    });
  });
}

/*  ⛔ שכבה 3 — **הטבלאות**, בסדר שמוצהר ב-`PUSH_CFG.tables` — ⚠️ הסדר הוא
 *  מה ששומר על המפתח הזר: ⭐ האב נכתב לפני הבן, ⛔ ואין תלות סדר בין
 *  שורות של אותה טבלה · ⚠️ וכשל בטבלה אחת אינו עוצר את הבאות אחריה. */
function pushDirty(ctx) {
  var acc = [], ok = true, n = 0, i = 0;
  function step() {
    if (i >= PUSH_CFG.tables.length) return Promise.resolve({ ok: ok, still: acc, n: n });
    return pushTable(PUSH_CFG.tables[i++], ctx).then(function (r) {
      acc = acc.concat(r.still);
      n += r.n;
      if (!r.ok) ok = false;
      return step();
    });
  }
  return step();
}

/*  ⛔ המתזמן — ⚠️ משפך הכתיבה המקומית היחיד, ⭐ ולכן זו נקודת הדריכה של
 *  מודול הניסיון החוזר · ⛔ **וההשהיה מתחילה מחדש בכל כתיבה** — ⚠️ שתי
 *  שמירות רצופות הן מחזור סנכרון אחד ⛔ ולא שניים, ⭐ והרשומה כבר מסומנת
 *  ⏳ לפני ההשהיה. */
function schedulePush() {
  rtyNote();
  if (_pushTimer) clearTimeout(_pushTimer);
  /*  ⛔ ההקשר נלכד **בקביעת המועד** ⛔ ולא בהתעוררות — ⚠️ ההשהיה היא המתנה
   *  לכל דבר, ⭐ והמשתמש או המוסד יכולים להתחלף בתוכה: ⛔ מחזור שמתעורר
   *  בהקשר אחר דוחף שורות ⏳ שנצברו בקודם, ⚠️ וזוקף את הצלחתן לחדש. */
  var _ep = ctxEpoch();
  _pushTimer = setTimeout(function () {
    _pushTimer = null;
    if (ctxStale(_ep)) return;
    PUSH_CFG.run();
  }, PUSH_CFG.delay);
}
/* ═══════════════ סוף מודול שכבת הדחיפה ══════════════════════════════════ */

/* ═══ חלון חם ושחזור מקומי — מודול משותף (סבב 35) ════════════════════════
   ⛔ שינוי כאן (סבב 65) — כל האפליקציות **וכל עותקי השער**, באותו
      סבב: אחרת החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ══════════════════════════════════════════════════════════════════════ */
var HW_BOOT_DEFER_MS = 3000;      // כמו הפינוי הנדחה של סבב 14 — רשת אחרי עלייה
var _hwCloudSeen = {};            // ראיה עננית בזיכרון בלבד: מפתח → {מזהה → חותמת}
var _hwSweepBusy = false;
var _hwSwept = 0;                 // כמה רשומות פונו בעלייה הזו — לתיעוד בלבד

function _hwVal(v) { return (typeof v === 'function') ? v() : v; }
function hwEnabled() {
  try { return !!(typeof HW_CFG !== 'undefined' && HW_CFG && HW_CFG.enabled); }
  catch (e) { return false; }
}
function _hwSpecs() {
  try { return (typeof HW_CFG !== 'undefined' && HW_CFG && HW_CFG.specs) || []; }
  catch (e) { return []; }
}
function _hwSpecFor(key) {
  var specs = _hwSpecs();
  for (var i = 0; i < specs.length; i++) {
    try { if (_hwVal(specs[i].key) === key) return specs[i]; } catch (e) { }
  }
  return null;
}
function _hwLive(spec, rec) {
  try { return spec.isLive ? !!spec.isLive(rec) : !(rec && rec.deleted); }
  catch (e) { return true; }
}

// רישום הראיה העננית — כל משיכה מוצלחת מוסיפה ומעדכנת חותמות פר-מזהה.
function hwNoteCloud(key, rows) {
  if (!hwEnabled() || !Array.isArray(rows)) return;
  var spec = _hwSpecFor(key);
  if (!spec) return;
  var idx = _hwCloudSeen[key] || (_hwCloudSeen[key] = {});
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], id, t;
    try { id = spec.idOf(r); t = Number(spec.ts(r)) || 0; } catch (e) { continue; }
    if (id == null) continue;
    id = String(id);
    if (!(idx[id] >= t)) idx[id] = t;
  }
}

// שער הדיסק. ⛔ כל ספק משאיר את הרשומה (סבב 35) — רשומה בלי ראיה עננית
// עדכנית לה-עצמה נכתבת לדיסק כרגיל; רק ודאות מפנה.
function hwDiskFilter(key, rows) {
  if (!hwEnabled() || !Array.isArray(rows)) return rows;
  var spec = _hwSpecFor(key);
  if (!spec) return rows;
  var idx = _hwCloudSeen[key];
  if (!idx) return rows;
  var kept = [];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], drop = false;
    try {
      if (!spec.inWindow(r)) {
        var pend = true;
        try { pend = !!spec.isPending(r); } catch (e1) { pend = true; }
        if (!pend) {
          var id = spec.idOf(r);
          if (id != null) {
            var ct = idx[String(id)];
            var lt = Number(spec.ts(r)) || 0;
            if (ct !== undefined && ct >= lt) drop = true;
          }
        }
      }
    } catch (e) { drop = false; }
    if (!drop) kept.push(r);
  }
  return kept;
}

// הפינוי עצמו — מושך את העותק הענני של כל מפרט, ואז כותב לדיסק את הנשאר.
async function hwSweep() {
  if (!hwEnabled() || _hwSweepBusy) return { swept: 0 };
  try {
    if (typeof LS_CFG !== 'undefined' && LS_CFG &&
        typeof LS_CFG.pending === 'function' && LS_CFG.pending()) {
      try { lsLog('hw-skip', 'תור יוצא לא ריק'); } catch (e0) { }
      return { swept: 0 };
    }
  } catch (e) { return { swept: 0 }; }
  _hwSweepBusy = true;
  var swept = 0;
  try {
    var specs = _hwSpecs();
    for (var i = 0; i < specs.length; i++) {
      var s = specs[i], key;
      try { key = _hwVal(s.key); } catch (e1) { continue; }
      var res = null;
      try { res = await s.fetch(); } catch (e2) { res = null; }
      if (!res || res.ok !== true || !Array.isArray(res.rows)) continue;
      hwNoteCloud(key, res.rows);

      try { cur = s.rows(); } catch (e3) { cur = null; }

      try { okW = !!s.apply(kept); } catch (e4) { okW = false; }
      if (okW) {
        var n = cur.length - kept.length;
        swept += n;
        try { lsLog('hw-sweep', (s.label || key) + ' −' + n); } catch (e5) { }
      }
    }
  } catch (e6) { }
  _hwSwept = swept;
  _hwSweepBusy = false;
  return { swept: swept };
}

// מסך העבר — קריאה בלבד. מחזיר מהענן את הרשומות החיות שמחוץ לחלון,
// מהחדשה לישנה, בלי לגעת בדיסק ובלי לגעת בזיכרון האפליקציה.
async function hwPastLoad(key, filter) {
  var spec = _hwSpecFor(key);
  if (!spec) return { ok: false, rows: [] };

// ⛔ **⏳ שובר שוויון ⛔ ואינו גובר על חותמת חדשה יותר** — ⚠️ מכשיר א׳ ערך

// 2. **רק עם חותמת מספרית.** tombstone בלי חותמת — אי אפשר לדעת מתי נמחק,
//    ולכן הוא **נשאר**: חותמת חסרה נקראת 0, וגריעה לפיה הייתה מוחקת דווקא

// והעותק הענני לעולם לא היה מצטמצם. ⚠️ הגריעה **אינה** רצה בפולינג

  if (!m) { uiNoDialog('closeModal', 'modal'); return; }

/* ═══ קריאת ערך מספרי — מודול משותף (סבב 104) ═════════════════════════════
   ⛔ שינוי כאן — כל האפליקציות **וכל עותקי השער**, באותו סבב: אחרת

   ⛔ **והקלט הוא האלמנט** ⛔ ולא ערכו — ⚠️ אלמנט חסר הוא מסלול תקף, ⭐ והוא

/* ═══ כיווץ רשימת ערכים — מודול משותף (סבב 101) ═══════════════════════════
   ⛔ שני פריטים באותו ערך הם פריט אחד — ⚠️ **והכיווץ הוא בכתיבה ובמיזוג

      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה.
   ⛔ ושתיהן מכריעות לפי **אותה זהות** — ⚠️ שני מימושים לאותה טענה נבדלים
      בשקט, ⭐ ואז המסך מראה פעמיים את מה שהמיזוג מכווץ לאחד.
   ⛔ והראשון שורד — ⚠️ הסדר של הצד שניצח הוא סדר המסך, ⭐ ומי שדורש

/* ═══ Enter שומר בשדה עריכה — מודול משותף (סבב 125) ═════════════════════
   ⛔ שדה שנשמר בכפתור נשמר גם ב-`Enter` — ⚠️ **וההיקף הוא הטופס** (`.ksave`)

/* ═══ ערך מפתח-ערך — מודול משותף (סבב 126) ══════════════════════════════
   ⛔ «אין ערך» ו«ערך פגום» אינן אותה תשובה — ⚠️ שתיהן חזרו «נכשל», ⭐ והמשתמש

      החתימה נשברת בריפו אחד, והשער מאשר את הסטייה בשלושה. */

/* ═══ גרף העמודות — מודול משותף (סבב 137) ═══════════════════════════════════
   ⛔ סדרה מוצגת ברוחב יחסי ⛔ ולא בספריית גרפים — ⚠️ הרוחב הוא התכונה
      היחידה שנגזרת מהנתון, ⭐ והוא החריג היחיד לסגנון מוטבע.
   ⛔ פחות משתי נקודות אינו גרף — ⚠️ עמודה אחת אינה משווה דבר, ⭐ והמסך

   ⛔ **פס יחיד ופס בסדרה הם רכיב אחד (סבב 139)** — ⚠️ `bar` היא אתר

/* ══════════════════════════════════════════════════════════════════════════

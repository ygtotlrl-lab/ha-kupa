<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#9C7FD0">
<title></title>
<script>
// base דינמי לפני כל תג עם כתובת יחסית — כשה-service worker מגיש את הקליפה בנתיב עמוק, כתובת יחסית נפתרת רמה אחת עמוק מדי.
// אחרת המניפסט, העובד והאייקונים מחזירים 404, והעובד נרשם בהיקף שגוי.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*?\/ha-kupa\/)/);
  var b = document.createElement('base');
  b.href = m ? m[1] : p.replace(/[^/]*$/, '');
  document.head.appendChild(b);
})();
</script>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.8375dfd2.png">
<link rel="icon" href="icons/favicon-32.e6def847.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.e3587511.png" sizes="16x16">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="core/chart.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>

<!-- הקליפה מתחילה חשופה — המסגרת נחשפת עם הרינדור הראשון. -->
<div id="shell" class="shell is-bare">
<!-- הסרגל מחוץ למיכל התוכן — סרגל שנבנה בתוך המסך נמחק איתו בכל רינדור. -->
<nav id="tabbar" class="tabbar" aria-label="ניווט"></nav>

<!-- הלוגו מוצג בשלוש הלשוניות בלבד — מסכי המשנה הם זרימה, והכותרת אינה חלק מהם. -->
<header id="masthead" class="brand hidden"></header>

<main id="view" class="view"><div class="view-loading view-boot" role="status" aria-label="טוען"><img class="view-logo" src="icons/icon-maskable-512.34251542.png" alt=""></div></main>

<!-- הפלוס הוא ציור ולא תו — תו נשען על קו הבסיס של הגופן, ומרכזו האופטי זז בין מנוע למנוע. -->
<div class="fabrail"><div class="in"><button id="fab" class="fab" data-act="add-open" aria-label="רישום חדש"></button></div></div>
</div>

<!-- מיכל חלון הדו-שיח ילד ישיר של body — מיכל בתוך מסך נמחק איתו במעבר, והדיאלוג מפסיק להיפתח בשקט. -->
<div id="modal" class="veil veil-modal" data-veil="modal">
  <div class="sheet" data-ks role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" data-shell-ic="close" aria-label="סגירה"></button>
    </div>
    <div class="sheet-bd modal-body" id="modal-body"></div>
    <div class="sheet-ft modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="ask" class="veil veil-ask" data-veil="ask">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd ask-body" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="updater" class="updater">
  <div class="in">
    <span class="upd-ic" data-shell-ic="refresh"></span><span>גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" data-shell-ic="close" aria-label="סגור"></button>
  </div>
</div>

<script type="module" src="app/main.js"></script>

</body>
</html>
